name: Temporary NFL design preview

on:
  push:
    branches:
      - design/nfl-game-day-theme
    paths:
      - "Flask_App/templates/**"
      - "Flask_App/static/css/nfl.css"
      - ".github/workflows/nfl-design-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Seed isolated preview databases
        env:
          DATABASE_PATH: /tmp/ticketsignal-preview/baseball.db
          NFL_DATABASE_PATH: /tmp/ticketsignal-preview/nfl.db
          FLASK_SECRET_KEY: preview-only-secret
        run: |
          mkdir -p /tmp/ticketsignal-preview
          python - <<'PY'
          from datetime import datetime, timedelta
          from sqlalchemy import create_engine
          from sqlalchemy.orm import sessionmaker
          import os

          from models import Base
          from Flask_App.nfl_blueprint import NFLBase, NFLEvent, NFLIteration, NFLTicket

          baseball_engine = create_engine(f"sqlite:///{os.environ['DATABASE_PATH']}")
          Base.metadata.create_all(baseball_engine)
          baseball_engine.dispose()

          nfl_engine = create_engine(f"sqlite:///{os.environ['NFL_DATABASE_PATH']}")
          NFLBase.metadata.create_all(nfl_engine)
          Session = sessionmaker(bind=nfl_engine, expire_on_commit=False)

          kickoff = datetime(2026, 9, 20, 13, 0)
          games = [
              NFLEvent(
                  source_id="preview-1",
                  title="Pittsburgh Steelers at New England Patriots",
                  event_date=kickoff,
                  sections=["Lower Level 105", "Club 211", "Upper Level 325"],
                  source_url="https://www.vividseats.com/preview/production/preview-1",
                  venue="Gillette Stadium",
              ),
              NFLEvent(
                  source_id="preview-2",
                  title="Buffalo Bills at New England Patriots",
                  event_date=datetime(2026, 10, 4, 16, 25),
                  sections=["Lower Level 105", "Club 211", "Upper Level 325"],
                  source_url="https://www.vividseats.com/preview/production/preview-2",
                  venue="Gillette Stadium",
              ),
              NFLEvent(
                  source_id="preview-3",
                  title="Dallas Cowboys at Philadelphia Eagles",
                  event_date=datetime(2026, 9, 27, 20, 20),
                  sections=["Section 101", "Section 204", "Section 229"],
                  source_url="https://www.vividseats.com/preview/production/preview-3",
                  venue="Lincoln Financial Field",
              ),
          ]

          with Session() as session:
              session.add_all(games)
              session.flush()
              prices = [338, 329, 335, 318, 305, 311, 297, 289, 301, 278, 284, 269]
              for index, price in enumerate(prices):
                  captured = kickoff - timedelta(hours=168 - index * 14)
                  iteration = NFLIteration(event=games[0], captured_at=captured)
                  iteration.tickets.extend([
                      NFLTicket(section="Upper Level 325", price=price, listing_count=24, iteration=iteration),
                      NFLTicket(section="Club 211", price=price + 165, listing_count=12, iteration=iteration),
                  ])
                  session.add(iteration)
              session.commit()
          nfl_engine.dispose()
          PY
      - name: Start preview application
        env:
          DATABASE_PATH: /tmp/ticketsignal-preview/baseball.db
          NFL_DATABASE_PATH: /tmp/ticketsignal-preview/nfl.db
          FLASK_SECRET_KEY: preview-only-secret
        run: |
          python -m flask --app Flask_App.flask_app run --host 127.0.0.1 --port 5000 > /tmp/nfl-preview.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5000/nfl > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nfl-preview.log
          exit 1
      - name: Capture desktop and mobile previews
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1200 --screenshot=nfl-home-desktop.png http://127.0.0.1:5000/nfl
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1100 --screenshot=nfl-graph-desktop.png "http://127.0.0.1:5000/nfl/graph?event=Gillette%20Stadium&game=1&section=Upper%20Level%20325"
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,1000 --screenshot=nfl-home-mobile.png http://127.0.0.1:5000/nfl
      - name: Upload preview images
        uses: actions/upload-artifact@v7
        with:
          name: nfl-design-preview-${{ github.run_id }}
          path: |
            nfl-home-desktop.png
            nfl-graph-desktop.png
            nfl-home-mobile.png
          retention-days: 1
