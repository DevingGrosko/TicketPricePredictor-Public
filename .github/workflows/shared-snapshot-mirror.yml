# Canonical owner delivery: consume immutable observations with no browser or timer.
name: Deliver the same saved observation to TiDB
on:
  workflow_call:
    inputs:
      sport:
        type: string
        required: true
      source_ref:
        type: string
        required: true
    secrets:
      TIDB_STAGING_HOST:
        required: false
      TIDB_STAGING_USERNAME:
        required: false
      TIDB_STAGING_PASSWORD:
        required: false
permissions:
  contents: read
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: tidb-staging
    permissions:
      contents: read
      actions: read
    concurrency:
      group: free-refresh-staging-${{ inputs.sport }}-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          path: bridge
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r source/requirements-staging.txt
      - name: Restore immutable observations and independent acknowledgments
        uses: actions/cache/restore@v5
        with:
          path: shared-acknowledgments/${{ inputs.sport }}
          key: shared-capture-v1-${{ inputs.sport }}-tidb-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: shared-capture-v1-${{ inputs.sport }}-tidb-
      - name: Restore old free pending snapshots without another capture
        uses: actions/cache/restore@v5
        with:
          path: free-capture/${{ inputs.sport }}
          key: ticketsignal-free-v1-state-${{ inputs.sport }}-shared-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ticketsignal-free-v1-state-${{ inputs.sport }}-
      - name: Download this sport's validated public export including empty checkpoints
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: shared-observations-${{ inputs.sport }}-${{ github.run_id }}
          path: incoming
      - name: Deliver original observations without contacting Vivid
        env:
          SPORT: ${{ inputs.sport }}
          TICKETSIGNAL_STAGING_SITE: '1'
          TICKETSIGNAL_ENABLE_STAGING_WRITES: '1'
          TIDB_STAGING_HOST: ${{ secrets.TIDB_STAGING_HOST }}
          TIDB_STAGING_USERNAME: ${{ secrets.TIDB_STAGING_USERNAME }}
          TIDB_STAGING_PASSWORD: ${{ secrets.TIDB_STAGING_PASSWORD }}
        run: |
          cp bridge/tools/shared_capture.py source/tools/shared_capture.py
          cp bridge/tools/shared_capture_policy.py source/tools/shared_capture_policy.py
          cp bridge/tools/shared_capture_storage.py source/tools/shared_capture_storage.py
          cp bridge/tools/import_shared_snapshot.py source/tools/import_shared_snapshot.py
          cp bridge/Flask_App/observation_receipt.py source/Flask_App/observation_receipt.py
          cd source
          python -m tools.shared_capture deliver --sport "$SPORT" --directory "../shared-acknowledgments/$SPORT" --incoming ../incoming --legacy-free-state "../free-capture/$SPORT"
      - name: Verify current export in the delivery checkpoint
        id: checkpoint
        if: always() && steps.download.outcome == 'success'
        env:
          SPORT: ${{ inputs.sport }}
        run: |
          cd source
          python -m tools.shared_capture verify-checkpoint --sport "$SPORT" --directory "../shared-acknowledgments/$SPORT" --incoming ../incoming
      - name: Bound saved public delivery state
        id: budget
        if: always()
        env:
          SPORT: ${{ inputs.sport }}
        run: |
          cd bridge
          python -m tools.shared_capture_storage queue-budget --directory "../shared-acknowledgments/$SPORT"
      - name: Preserve independent delivery acknowledgments and failures
        if: always() && steps.budget.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: shared-acknowledgments/${{ inputs.sport }}
          key: shared-capture-v1-${{ inputs.sport }}-tidb-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Bound preserved old free pending state
        id: legacy-budget
        if: always()
        env:
          SPORT: ${{ inputs.sport }}
        run: |
          cd bridge
          python -m tools.shared_capture_storage queue-budget --directory "../free-capture/$SPORT"
      - name: Checkpoint old free delivery replay under the same TiDB writer lock
        if: always() && steps.legacy-budget.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: free-capture/${{ inputs.sport }}
          key: ticketsignal-free-v1-state-${{ inputs.sport }}-shared-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report missing current capture artifact as a real failure
        if: always() && steps.download.outcome != 'success'
        run: exit 1
