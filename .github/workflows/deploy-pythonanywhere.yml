name: Deploy to PythonAnywhere

on:
  push:
    branches:
      - main
    paths:
      - "Flask_App/**"
      - "models.py"
      - "graph_builder.py"
      - "nhl_collector.py"
      - "nhl_schedule_collector.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/deploy-pythonanywhere.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Flask_App/**"
      - "models.py"
      - "graph_builder.py"
      - "nhl_collector.py"
      - "nhl_schedule_collector.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/deploy-pythonanywhere.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pythonanywhere-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate collector and application code
        env:
          DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/baseball.db
          CONCERT_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/concerts.db
          NFL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nfl.db
          NHL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nhl.db
          FLASK_SECRET_KEY: deployment-validation-key
          COLLECTOR_INGEST_TOKEN: deployment-validation-token
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          python -m py_compile \
            models.py \
            graph_builder.py \
            nhl_collector.py \
            nhl_schedule_collector.py \
            Flask_App/flask_app.py \
            Flask_App/analytics_maintenance.py \
            Flask_App/materialized_analytics.py \
            Flask_App/nfl_blueprint.py \
            Flask_App/section_canonicalization.py \
            Flask_App/nfl_stadium_blueprint.py \
            Flask_App/nhl_blueprint.py
          node --check Flask_App/static/js/script.js
          node --check Flask_App/static/js/graph.js
          node --check Flask_App/static/js/concerts.js
          node --check Flask_App/static/js/nfl.js
          node --check Flask_App/static/js/nfl-map.js
          node --check Flask_App/static/js/nfl-stadium.js
          node --check Flask_App/static/js/venue-section.js
          node --check Flask_App/static/js/nhl.js
          node --check Flask_App/static/js/nhl-graph.js
          node --check Flask_App/static/js/nhl-map.js
          python -m unittest discover -s tests -v
          rm -f "$DATABASE_PATH" "$CONCERT_DATABASE_PATH" "$NFL_DATABASE_PATH" "$NHL_DATABASE_PATH"
          rm -rf \
            "${DATABASE_PATH%.db}_backups" \
            "${DATABASE_PATH%.db}_collector_audit" \
            "${CONCERT_DATABASE_PATH%.db}_backups" \
            "${CONCERT_DATABASE_PATH%.db}_audit" \
            "${NFL_DATABASE_PATH%.db}_backups" \
            "${NFL_DATABASE_PATH%.db}_audit" \
            "${NHL_DATABASE_PATH%.db}_backups" \
            "${NHL_DATABASE_PATH%.db}_audit"

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Configure restricted deployment key
        env:
          PYTHONANYWHERE_SSH_KEY: ${{ secrets.PYTHONANYWHERE_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PYTHONANYWHERE_SSH_KEY" > ~/.ssh/pythonanywhere_deploy
          chmod 600 ~/.ssh/pythonanywhere_deploy
          ssh-keyscan -t rsa,ed25519 -H ssh.pythonanywhere.com > ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | grep -F 'SHA256:zy2jmqxNg/fs6tFZK55OjHTI3B2UofzOiUvTPtcX3/Y'

      - name: Deploy website and reload web app
        run: |
          ssh \
            -i ~/.ssh/pythonanywhere_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            bunnyjeff@ssh.pythonanywhere.com deploy

      - name: Backfill materialized ticket analytics
        timeout-minutes: 120
        env:
          COLLECTOR_INGEST_TOKEN: ${{ secrets.COLLECTOR_INGEST_TOKEN }}
        run: |
          set -euo pipefail
          base="https://bunnyjeff.pythonanywhere.com"
          for sport in mlb nfl nhl; do
            echo "Backfilling $sport materialized summaries"
            complete=0
            for attempt in $(seq 1 300); do
              response="$(
                curl -fsS --max-time 180 \
                  -X POST \
                  -H "Authorization: Bearer $COLLECTOR_INGEST_TOKEN" \
                  -H 'Content-Type: application/json' \
                  -d "{\"sport\":\"$sport\",\"limit\":5}" \
                  "$base/api/analytics/backfill"
              )"
              echo "$response"
              complete="$(
                RESPONSE="$response" python - <<'PYCODE'
import json
import os
payload = json.loads(os.environ["RESPONSE"])
print(1 if payload.get("complete") else 0)
PYCODE
              )"
              if [[ "$complete" == "1" ]]; then
                break
              fi
            done
            if [[ "$complete" != "1" ]]; then
              echo "$sport backfill did not complete within 300 batches" >&2
              exit 1
            fi
          done

      - name: Verify public pages and API startup
        run: |
          base="https://bunnyjeff.pythonanywhere.com"
          for attempt in $(seq 1 8); do
            home_status="$(curl -sS --max-time 15 -o /tmp/home.html -w '%{http_code}' "$base/" || true)"
            nfl_status="$(curl -sS --max-time 15 -o /tmp/nfl.html -w '%{http_code}' "$base/nfl" || true)"
            nfl_archive_status="$(curl -sS --max-time 15 -o /tmp/nfl-archive.html -w '%{http_code}' "$base/nfl/archive" || true)"
            nhl_status="$(curl -sS --max-time 15 -o /tmp/nhl.html -w '%{http_code}' "$base/nhl" || true)"
            concerts_status="$(curl -sS --max-time 15 -o /tmp/concerts.html -w '%{http_code}' "$base/concerts" || true)"
            baseball_api_status="$(curl -sS --max-time 15 -o /tmp/baseball-api.txt -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$base/api/collector/snapshot" || true)"
            nfl_api_status="$(curl -sS --max-time 15 -o /tmp/nfl-api.txt -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$base/api/nfl/snapshot" || true)"
            nhl_api_status="$(curl -sS --max-time 15 -o /tmp/nhl-api.txt -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$base/api/nhl/snapshot" || true)"
            concert_api_status="$(curl -sS --max-time 15 -o /tmp/concert-api.txt -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$base/api/concerts/snapshot" || true)"
            analytics_api_status="$(curl -sS --max-time 15 -o /tmp/analytics-api.txt -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"sport":"mlb"}' "$base/api/analytics/backfill" || true)"

            echo "Attempt $attempt: home=$home_status nfl=$nfl_status nfl_archive=$nfl_archive_status nhl=$nhl_status concerts=$concerts_status baseball_api=$baseball_api_status nfl_api=$nfl_api_status nhl_api=$nhl_api_status concert_api=$concert_api_status analytics_api=$analytics_api_status"
            if [[ "$home_status" == "200" && "$nfl_status" == "200" && "$nfl_archive_status" == "200" && "$nhl_status" == "200" && "$concerts_status" == "200" && "$baseball_api_status" == "401" && "$nfl_api_status" == "401" && "$nhl_api_status" == "401" && "$concert_api_status" == "401" && "$analytics_api_status" == "401" ]]; then
              echo "PythonAnywhere startup verification passed."
              exit 0
            fi
            sleep 5
          done

          echo "Home response:"
          cat /tmp/home.html || true
          echo "NFL response:"
          cat /tmp/nfl.html || true
          echo "NFL archive response:"
          cat /tmp/nfl-archive.html || true
          echo "NHL response:"
          cat /tmp/nhl.html || true
          echo "Concerts response:"
          cat /tmp/concerts.html || true
          echo "Baseball API response:"
          cat /tmp/baseball-api.txt || true
          echo "NFL API response:"
          cat /tmp/nfl-api.txt || true
          echo "NHL API response:"
          cat /tmp/nhl-api.txt || true
          echo "Concert API response:"
          cat /tmp/concert-api.txt || true
          echo "Analytics API response:"
          cat /tmp/analytics-api.txt || true
          exit 1

      - name: Collect PythonAnywhere diagnostics
        if: failure()
        run: |
          echo "Deployment or startup verification failed."
          echo "The restricted deployment key does not permit arbitrary shell access;"
          echo "inspect the deploy step and public-response bodies above."
