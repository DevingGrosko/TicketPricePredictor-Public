name: Deploy to PythonAnywhere

on:
  pull_request:
    branches:
      - main
    paths:
      - "Flask_App/**"
      - "collector.py"
      - "nfl_collector.py"
      - "nfl_schedule_collector.py"
      - "concert_collector.py"
      - "concert_models.py"
      - "concert_graph_builder.py"
      - "legacy_concert_migration.py"
      - "github_dispatcher.py"
      - "graph_builder.py"
      - "models.py"
      - "tests/**"
      - ".github/workflows/deploy-pythonanywhere.yml"
  push:
    branches:
      - main
    paths:
      - "Flask_App/**"
      - "collector.py"
      - "nfl_collector.py"
      - "nfl_schedule_collector.py"
      - "concert_collector.py"
      - "concert_models.py"
      - "concert_graph_builder.py"
      - "legacy_concert_migration.py"
      - "github_dispatcher.py"
      - "graph_builder.py"
      - "models.py"
      - "tests/**"
      - ".github/workflows/deploy-pythonanywhere.yml"
  workflow_dispatch:

concurrency:
  group: pythonanywhere-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate collector and application code
        run: |
          python -m py_compile \
            collector.py \
            nfl_collector.py \
            nfl_schedule_collector.py \
            concert_collector.py \
            concert_models.py \
            concert_graph_builder.py \
            legacy_concert_migration.py \
            github_dispatcher.py \
            models.py \
            graph_builder.py \
            Flask_App/nfl_blueprint.py \
            Flask_App/flask_app.py
          python -m unittest discover -s tests -v

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Configure restricted deployment key
        env:
          PYTHONANYWHERE_SSH_KEY: ${{ secrets.PYTHONANYWHERE_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PYTHONANYWHERE_SSH_KEY" > ~/.ssh/pythonanywhere_deploy
          chmod 600 ~/.ssh/pythonanywhere_deploy
          ssh-keyscan -t rsa,ed25519 -H ssh.pythonanywhere.com > ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | grep -F 'SHA256:zy2jmqxNg/fs6tFZK55OjHTI3B2UofzOiUvTPtcX3/Y'

      - name: Deploy website and reload web app
        run: |
          ssh \
            -i ~/.ssh/pythonanywhere_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            bunnyjeff@ssh.pythonanywhere.com deploy

      - name: Verify public pages and API startup
        run: |
          base="https://bunnyjeff.pythonanywhere.com"
          for attempt in $(seq 1 8); do
            home_status="$(curl -sS --max-time 15 -o /tmp/home.html -w '%{http_code}' "$base/" || true)"
            nfl_status="$(curl -sS --max-time 15 -o /tmp/nfl.html -w '%{http_code}' "$base/nfl" || true)"
            concerts_status="$(curl -sS --max-time 15 -o /tmp/concerts.html -w '%{http_code}' "$base/concerts" || true)"
            baseball_api_status="$(curl -sS --max-time 15 -o /tmp/baseball-api.txt -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$base/api/collector/snapshot" || true)"
            nfl_api_status="$(curl -sS --max-time 15 -o /tmp/nfl-api.txt -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$base/api/nfl/snapshot" || true)"
            concert_api_status="$(curl -sS --max-time 15 -o /tmp/concert-api.txt -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$base/api/concerts/snapshot" || true)"

            echo "Attempt $attempt: home=$home_status nfl=$nfl_status concerts=$concerts_status baseball_api=$baseball_api_status nfl_api=$nfl_api_status concert_api=$concert_api_status"
            if [[ "$home_status" == "200" && "$nfl_status" == "200" && "$concerts_status" == "200" && "$baseball_api_status" == "401" && "$nfl_api_status" == "401" && "$concert_api_status" == "401" ]]; then
              echo "PythonAnywhere startup verification passed."
              exit 0
            fi
            sleep 5
          done

          echo "Home response:"
          cat /tmp/home.html || true
          echo "NFL response:"
          cat /tmp/nfl.html || true
          echo "Concerts response:"
          cat /tmp/concerts.html || true
          echo "Baseball API response:"
          cat /tmp/baseball-api.txt || true
          echo "NFL API response:"
          cat /tmp/nfl-api.txt || true
          echo "Concert API response:"
          cat /tmp/concert-api.txt || true
          exit 1

      - name: Collect PythonAnywhere diagnostics
        if: failure()
        run: |
          ssh \
            -i ~/.ssh/pythonanywhere_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            bunnyjeff@ssh.pythonanywhere.com 'bash -s' <<'REMOTE'
          set +e
          echo '=== Repository state ==='
          cd /home/bunnyjeff/TicketPricePredictor || exit 0
          pwd
          git rev-parse HEAD
          git status --short

          echo '=== Python environments ==='
          python --version 2>&1
          /home/bunnyjeff/venv/bin/python --version 2>&1

          echo '=== Direct Flask import ==='
          PYTHONPATH=/home/bunnyjeff/TicketPricePredictor \
            /home/bunnyjeff/venv/bin/python -c \
            'from Flask_App.flask_app import app; print(app.url_map)' 2>&1

          echo '=== PythonAnywhere error log ==='
          tail -n 250 /var/log/bunnyjeff.pythonanywhere.com.error.log 2>&1

          echo '=== PythonAnywhere server log ==='
          tail -n 120 /var/log/bunnyjeff.pythonanywhere.com.server.log 2>&1
          REMOTE
