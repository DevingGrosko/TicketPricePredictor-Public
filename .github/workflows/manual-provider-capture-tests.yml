name: Manual and hosted provider capture tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "manual_provider_capture.py"
      - "hosted_provider_probe.py"
      - "tests/test_manual_provider_capture.py"
      - "tests/test_hosted_provider_probe.py"
      - ".github/workflows/manual-provider-capture-tests.yml"
      - ".github/workflows/provider-probe.yml"
  push:
    branches:
      - main
    paths:
      - "manual_provider_capture.py"
      - "hosted_provider_probe.py"
      - "tests/test_manual_provider_capture.py"
      - "tests/test_hosted_provider_probe.py"
      - ".github/workflows/manual-provider-capture-tests.yml"
      - ".github/workflows/provider-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate provider diagnostics
        run: |
          python -m py_compile manual_provider_capture.py hosted_provider_probe.py
          python -m unittest \
            tests.test_manual_provider_capture \
            tests.test_hosted_provider_probe \
            -v
