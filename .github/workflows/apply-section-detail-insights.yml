name: Apply aggregate section detail pages

on:
  push:
    branches:
      - feature/section-detail-insights
    paths:
      - ".github/workflows/apply-section-detail-insights.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-section-detail-insights
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/section-detail-insights
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Extract prepared implementation
        run: |
          parts=(
            .github/section-detail-payload/part00
            .github/section-detail-payload/part01
            .github/section-detail-payload/part02
            .github/section-detail-payload/part03
            .github/section-detail-payload/part04a
            .github/section-detail-payload/part04b
            .github/section-detail-payload/part05a
            .github/section-detail-payload/part05b
            .github/section-detail-payload/part06
            .github/section-detail-payload/part07
          )
          wc -c "${parts[@]}"
          sha256sum "${parts[@]}"
          cat "${parts[@]}" > /tmp/section-detail.b64
          echo "ce7ebdfd2520f89816840d44d31b544dea231c40f29c51a071bd33b2829f8450  /tmp/section-detail.b64" | sha256sum -c -
          base64 --decode /tmp/section-detail.b64 > /tmp/section-detail.tar.gz
          echo "e42749eee489ffeea792fb55b3836b0d1556622d2cb81e335c693d3e257e7bb8  /tmp/section-detail.tar.gz" | sha256sum -c -
          tar -xzf /tmp/section-detail.tar.gz
          rm -rf .github/section-detail-payload
          git checkout HEAD -- .github/workflows/deploy-pythonanywhere.yml

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate implementation
        env:
          DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/baseball.db
          CONCERT_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/concerts.db
          NFL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nfl.db
          NHL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nhl.db
          FLASK_SECRET_KEY: deployment-validation-key
          COLLECTOR_INGEST_TOKEN: deployment-validation-token
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          python -m py_compile \
            Flask_App/nfl_stadium_blueprint.py \
            tests/test_nfl_stadium_insights.py \
            tests/test_multi_sport_venue_insights.py
          node --check Flask_App/static/js/venue-section.js
          python -m unittest discover -s tests -v

      - name: Commit section detail pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add aggregate section detail pages"
          git push origin HEAD:feature/section-detail-insights
