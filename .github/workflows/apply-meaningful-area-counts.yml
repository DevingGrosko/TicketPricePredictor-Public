name: Apply meaningful area count cleanup

on:
  push:
    branches:
      - fix/meaningful-area-counts

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/meaningful-area-counts
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply the reviewed transformation
        run: |
          python -m py_compile tools/apply_meaningful_area_counts.py
          python tools/apply_meaningful_area_counts.py
          git diff --check

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate application and tests
        env:
          DATABASE_PATH: ${{ runner.temp }}/meaningful-area-counts/baseball.db
          CONCERT_DATABASE_PATH: ${{ runner.temp }}/meaningful-area-counts/concerts.db
          NFL_DATABASE_PATH: ${{ runner.temp }}/meaningful-area-counts/nfl.db
          NHL_DATABASE_PATH: ${{ runner.temp }}/meaningful-area-counts/nhl.db
          FLASK_SECRET_KEY: meaningful-area-counts-validation
          COLLECTOR_INGEST_TOKEN: meaningful-area-counts-token
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          python -m py_compile \
            Flask_App/section_canonicalization.py \
            Flask_App/nfl_stadium_blueprint.py
          python -m unittest discover -s tests -v

      - name: Commit the clean implementation
        run: |
          rm -f tools/apply_meaningful_area_counts.py
          rm -f .github/workflows/apply-meaningful-area-counts.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use supported areas in team reports"
          git push origin HEAD:fix/meaningful-area-counts
