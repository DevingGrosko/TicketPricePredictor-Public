name: Materialize NFL stadium insights

on:
  push:
    branches:
      - feature/nfl-stadium-insights
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nfl-stadium-insights
          fetch-depth: 0

      - name: Restore reviewed files from Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          write_blob() {
            local sha="$1"
            local path="$2"
            mkdir -p "$(dirname "$path")"
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq '.content' \
              | tr -d '\n' \
              | base64 --decode > "$path"
          }

          write_blob 451bc65fde7da3bdd8fcac44e2507a4a4a1c0ce3 Flask_App/flask_app.py
          write_blob aebf35ba7beb249ec3e438dbb34118a9dc6bd9c6 Flask_App/templates/base.html
          write_blob e95272fe40418ba2387654ef06f9c2b58139e870 Flask_App/templates/NFLHomeScreen.html
          write_blob 84f39b352a14df88c6f70be5e142079822c21cd0 Flask_App/templates/nfl_stadium.html
          write_blob 239d4e40132fc4bad853620faf3b3335741e3fd7 Flask_App/static/css/nfl-stadium.css
          write_blob 382582922f37223e218c6ab655b11e88e1eac923 Flask_App/static/css/nfl-stadium-dashboard.css
          write_blob ed288e73fee6a0c35ea76b41f2f330164c562717 Flask_App/static/css/nfl-stadium-table.css
          write_blob 179db1981ab864151a416504bd48b40f83bce563 Flask_App/static/js/nfl-stadium.js
          write_blob efa03791e4722714849823334502bbb4589107a4 tests/test_nfl_stadium_insights.py

          rm -f Flask_App/nfl_stadium_blueprint.py Flask_App/flask_app_original.py
          rm -f .github/workflows/materialize-nfl-stadium-insights.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add stadium-first NFL section insights"
          git push origin HEAD:feature/nfl-stadium-insights
