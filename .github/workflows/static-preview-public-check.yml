name: Public static preview acceptance

on:
  push:
    branches: [staging/tidb-free-hosting-2026-09-20]
    paths:
      - .github/workflows/static-preview-public-check.yml
      - tools/check_public_static_preview.py

permissions:
  contents: read

concurrency:
  group: public-static-preview-acceptance
  cancel-in-progress: false

jobs:
  public-static:
    if: github.repository == 'DevingGrosko/TicketPricePredictor-Public' && github.ref == 'refs/heads/staging/tidb-free-hosting-2026-09-20'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Validate script syntax and bounded request helpers
        run: |
          python -m py_compile tools/check_public_static_preview.py
          python -m tools.check_public_static_preview --self-test
      - name: Install browser test dependency only
        run: python -m pip install --disable-pip-version-check 'selenium==4.26.1'
      - name: Check public static files and real Chrome interactions
        run: python -u -m tools.check_public_static_preview
      - name: Retain bounded report and browser screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-static-preview-results
          path: static-public-results/
          if-no-files-found: warn
          retention-days: 7
