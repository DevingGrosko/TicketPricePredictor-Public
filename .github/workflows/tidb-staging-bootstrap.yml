name: Create empty TiDB staging schemas

# One-time staging setup. Never imports history, creates tables, or targets production.
on:
  push:
    branches:
      - staging/tidb-free-hosting-2026-09-20
    paths:
      - .github/workflows/tidb-staging-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tidb-staging-connectivity-check
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      github.repository == 'DevingGrosko/TicketPricePredictor-Public' &&
      github.ref == 'refs/heads/staging/tidb-free-hosting-2026-09-20'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: tidb-staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install only database-test dependencies
        run: python -m pip install --disable-pip-version-check 'SQLAlchemy>=2,<3' 'PyMySQL>=1.1.1,<2'
      - name: Run isolated tests without credentials
        run: python -m unittest discover -s tests -p 'test_tidb_staging*.py' -v
      - name: Create only the three empty staging schemas and verify them
        env:
          TIDB_STAGING_HOST: ${{ secrets.TIDB_STAGING_HOST }}
          TIDB_STAGING_USERNAME: ${{ secrets.TIDB_STAGING_USERNAME }}
          TIDB_STAGING_PASSWORD: ${{ secrets.TIDB_STAGING_PASSWORD }}
        run: |
          python - <<'PYCODE'
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import URL
          from sqlalchemy.pool import NullPool
          from Flask_App.tidb_staging import SCHEMAS, StagingTiDBConfig
          from Flask_App.tidb_staging_check import CheckFailed, safe_diagnostic

          targets = ('ticketsignal_staging_mlb', 'ticketsignal_staging_nfl', 'ticketsignal_staging_nhl')
          engine = None
          try:
              if tuple(SCHEMAS.values()) != targets:
                  raise CheckFailed('invalid_target')
              config = StagingTiDBConfig.from_environment()
              url = URL.create('mysql+pymysql', host=config.host, port=4000,
                               username=config.username, password=config.password,
                               query={'charset': 'utf8mb4'})
              engine = create_engine(url, poolclass=NullPool, hide_parameters=True,
                                     connect_args={'ssl': config.tls_context(),
                                                   'connect_timeout': 10,
                                                   'read_timeout': 30,
                                                   'write_timeout': 30})
              with engine.begin() as connection:
                  version = connection.execute(text('SELECT VERSION()')).scalar_one()
                  if 'tidb' not in str(version).lower():
                      raise CheckFailed('wrong_server')
                  # Inspect every target before executing any CREATE statement.
                  for schema in targets:
                      count = connection.execute(text(
                          'SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = :schema'
                      ), {'schema': schema}).scalar_one()
                      if count != 0:
                          raise CheckFailed('not_empty')
                  # Identifiers below are fixed literals, never user-controlled SQL.
                  for schema in targets:
                      connection.exec_driver_sql(
                          f'CREATE DATABASE IF NOT EXISTS `{schema}` CHARACTER SET utf8mb4'
                      )
                      print('Empty staging schema ready: ' + schema)
          except Exception as error:
              print('Setup stopped: ' + safe_diagnostic(error))
              print('Some empty schemas may already exist. No tables or history were changed.')
              raise SystemExit(1)
          finally:
              if engine is not None:
                  engine.dispose()
          PYCODE
          python -m Flask_App.tidb_staging_check
