name: NHL staging importer tests

# No staging environment/secrets, historical exports, production access or deployment.
on:
  push:
    branches: [staging/tidb-free-hosting-2026-09-20]
    paths:
      - .github/workflows/tidb-nhl-import-tests.yml
      - tools/tidb_nhl_import.py
      - tests/test_tidb_nhl_import*.py

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'DevingGrosko/TicketPricePredictor-Public' && github.ref == 'refs/heads/staging/tidb-free-hosting-2026-09-20'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-test-only
          MYSQL_DATABASE: importer_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install only the MySQL client
        run: python -m pip install --disable-pip-version-check 'PyMySQL[rsa]>=1.1.1,<2'
      - name: Run unit and disposable-MySQL driver tests
        env:
          NHL_IMPORT_TEST_MYSQL: '1'
        run: python -m unittest discover -s tests -p 'test_tidb_nhl_import*.py' -v
