name: Apply compact navigation and parking filter

on:
  push:
    branches:
      - fix/simplify-navigation-filter-parking
    paths:
      - ".github/workflows/apply-simplify-navigation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: simplify-navigation-filter-parking
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/simplify-navigation-filter-parking
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply focused interface changes
        run: python .github/scripts/simplify_navigation.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate changes
        env:
          DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/baseball.db
          CONCERT_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/concerts.db
          NFL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nfl.db
          NHL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nhl.db
          FLASK_SECRET_KEY: deployment-validation-key
          COLLECTOR_INGEST_TOKEN: deployment-validation-token
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          python -m py_compile \
            Flask_App/nfl_stadium_blueprint.py \
            tests/test_navigation_and_parking_filter.py
          node --check Flask_App/static/js/script.js
          node --check Flask_App/static/js/nfl.js
          node --check Flask_App/static/js/nhl.js
          node --check Flask_App/static/js/nfl-map.js
          node --check Flask_App/static/js/nhl-map.js
          node --check Flask_App/static/js/nfl-stadium.js
          python -m unittest discover -s tests -v

      - name: Commit simplified interface
        run: |
          rm -f .github/scripts/simplify_navigation.py
          rm -f .github/workflows/apply-simplify-navigation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Simplify navigation and exclude parking sections"
          git push origin HEAD:fix/simplify-navigation-filter-parking
