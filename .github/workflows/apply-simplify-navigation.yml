name: Apply compact navigation and parking filter

on:
  push:
    branches:
      - fix/simplify-navigation-filter-parking
    paths:
      - ".github/workflows/apply-simplify-navigation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: simplify-navigation-filter-parking
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/simplify-navigation-filter-parking
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply focused interface changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/scripts/simplify_navigation.py")
          text = path.read_text()

          old = '''for path, script_name in (
              ("Flask_App/templates/nfl_map.html", "nfl-map.js"),
              ("Flask_App/templates/nhl_map.html", "nhl-map.js"),
          ):
              replace_exact(path, "    {% else %}\\n", map_counts)
          '''
          new = '''for path, script_name, success_header in (
              (
                  "Flask_App/templates/nfl_map.html",
                  "nfl-map.js",
                  '      <header class="nfl-matchup-banner nfl-map-banner">',
              ),
              (
                  "Flask_App/templates/nhl_map.html",
                  "nhl-map.js",
                  '      <header class="nfl-matchup-banner nhl-matchup-banner nfl-map-banner">',
              ),
          ):
              success_marker = "    {% else %}\\n" + success_header
              replace_exact(path, success_marker, map_counts + success_header)
          '''
          if text.count(old) != 1:
              raise SystemExit("Could not locate the map replacement block")
          text = text.replace(old, new, 1)

          version_pairs = (
              (
                  '''f"js/{script_name}') }}?v=2"''',
                  '''"js/" + script_name + "') }}?v=2"''',
              ),
              (
                  '''f"js/{script_name}') }}?v=3"''',
                  '''"js/" + script_name + "') }}?v=3"''',
              ),
          )
          for old_version, new_version in version_pairs:
              if text.count(old_version) != 1:
                  raise SystemExit(
                      f"Could not locate map asset expression: {old_version}"
                  )
              text = text.replace(old_version, new_version, 1)

          path.write_text(text)
          PY
          python .github/scripts/simplify_navigation.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate changes
        env:
          DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/baseball.db
          CONCERT_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/concerts.db
          NFL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nfl.db
          NHL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nhl.db
          FLASK_SECRET_KEY: deployment-validation-key
          COLLECTOR_INGEST_TOKEN: deployment-validation-token
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          python -m py_compile \
            Flask_App/nfl_stadium_blueprint.py \
            tests/test_navigation_and_parking_filter.py
          node --check Flask_App/static/js/script.js
          node --check Flask_App/static/js/nfl.js
          node --check Flask_App/static/js/nhl.js
          node --check Flask_App/static/js/nfl-map.js
          node --check Flask_App/static/js/nhl-map.js
          node --check Flask_App/static/js/nfl-stadium.js
          python -m unittest discover -s tests -v

      - name: Commit simplified interface
        run: |
          rm -f .github/scripts/simplify_navigation.py
          rm -f .github/workflows/apply-simplify-navigation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Simplify navigation and exclude parking sections"
          git push origin HEAD:fix/simplify-navigation-filter-parking
