name: Gate NFL geometry on usable coverage

on:
  push:
    branches:
      - feature/nfl-eastern-metadata-real-maps
    paths:
      - ".github/workflows/fix-nfl-geometry-readiness.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/nfl-eastern-metadata-real-maps
          fetch-depth: 0
      - name: Patch collector readiness gate
        run: python scripts/patch_nfl_geometry_readiness.py
      - name: Commit branch patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_collector.py
          git commit -m "Wait for usable NFL provider geometry"
          git push origin HEAD:feature/nfl-eastern-metadata-real-maps
