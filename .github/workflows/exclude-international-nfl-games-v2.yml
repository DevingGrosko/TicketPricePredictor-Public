name: Exclude international NFL games v2

on:
  push:
    branches:
      - fix/exclude-international-nfl-games
    paths:
      - ".github/workflows/exclude-international-nfl-games-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/exclude-international-nfl-games
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply U.S.-venue-only NFL scope
        run: python .github/scripts/exclude_international_nfl_games.py

      - name: Compile modified Python
        run: |
          python -m py_compile \
            nfl_schedule_collector.py \
            Flask_App/nfl_blueprint.py \
            tests/test_nfl_schedule_collector.py \
            tests/test_nfl_metadata_enhancements.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run complete test suite
        run: python -m unittest discover -s tests -v

      - name: Commit the U.S.-only scope
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            nfl_schedule_collector.py \
            Flask_App/nfl_blueprint.py \
            tests/test_nfl_schedule_collector.py \
            tests/test_nfl_metadata_enhancements.py
          git commit -m "Exclude international games from NFL tracking"
          git push origin HEAD:fix/exclude-international-nfl-games
