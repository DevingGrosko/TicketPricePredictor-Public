name: Implement NHL 30-day cadence v3

on:
  push:
    branches:
      - feature/nhl-30-day-tiered-cadence
    paths:
      - ".github/workflows/implement-nhl-30-day-v3.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/nhl-30-day-tiered-cadence
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply the validated 30-day patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/implement-nhl-30-day-v2.yml").read_text(
              encoding="utf-8"
          )
          marker = "python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          Path("/tmp/nhl-30-day-patch.py").write_text(script, encoding="utf-8")
          PY
          python /tmp/nhl-30-day-patch.py

      - name: Restore Python method indentation in generated tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          methods = {
              "tests/test_nhl_collector.py": [
                  "test_cadence_tiers_cover_the_full_thirty_day_window",
              ],
              "tests/test_nhl_schedule_collector.py": [
                  "test_schedule_includes_us_and_canada_but_excludes_global_series",
                  "test_official_schedule_pagination_covers_the_full_month",
                  "test_due_filter_and_summary_apply_agreed_cadence",
              ],
              "tests/test_nhl_blueprint.py": [
                  "test_compaction_keeps_final_day_hourly_and_representative_earlier_points",
              ],
              "tests/test_nhl_empty_schedule.py": [
                  "test_empty_schedule_is_a_healthy_collection_cycle",
              ],
          }

          for filename, method_names in methods.items():
              path = Path(filename)
              lines = path.read_text(encoding="utf-8").splitlines()
              for method_name in method_names:
                  start = next(
                      index
                      for index, line in enumerate(lines)
                      if line.startswith(f"    def {method_name}(")
                  )
                  end = len(lines)
                  for index in range(start + 1, len(lines)):
                      line = lines[index]
                      if line.startswith("    def ") or line.startswith("if __name__"):
                          end = index
                          break
                  for index in range(start + 1, end):
                      if lines[index]:
                          lines[index] = "    " + lines[index]
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate implementation
        env:
          DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/baseball.db
          CONCERT_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/concerts.db
          NFL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nfl.db
          NHL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nhl.db
          FLASK_SECRET_KEY: deployment-validation-key
          COLLECTOR_INGEST_TOKEN: deployment-validation-token
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          python -m py_compile \
            nhl_collector.py \
            nhl_schedule_collector.py \
            Flask_App/nhl_blueprint.py \
            tests/test_nhl_collector.py \
            tests/test_nhl_schedule_collector.py \
            tests/test_nhl_blueprint.py \
            tests/test_nhl_empty_schedule.py
          node --check Flask_App/static/js/nhl.js
          node --check Flask_App/static/js/nhl-graph.js
          node --check Flask_App/static/js/nhl-map.js
          python -m unittest discover -s tests -v

      - name: Commit the 30-day NHL cadence
        run: |
          rm .github/workflows/implement-nhl-30-day.yml
          rm .github/workflows/implement-nhl-30-day-v2.yml
          rm .github/workflows/implement-nhl-30-day-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extend NHL tracking to a 30-day tiered cadence"
          git push origin HEAD:feature/nhl-30-day-tiered-cadence
