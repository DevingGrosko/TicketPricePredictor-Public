name: Free MLB capture canary
on:
  push:
    branches: [feature/free-half-hour-publication]
    paths: [.github/workflows/free-mlb-canary.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r requirements-staging.txt
      - name: Capture a current verified game without any database access
        run: |
          python -u - <<'PY'
          from datetime import datetime,timezone
          from unittest.mock import patch
          import collector,json,time
          from tools.free_live_mlb_schedule import fetch_schedule,capture_game
          games,_=fetch_schedule(datetime.now(timezone.utc))
          if not games: raise RuntimeError('No upcoming game available for live acceptance')
          clock=time.monotonic()
          with patch.object(collector,'MIN_USABLE_SECTIONS',1):
              url,at,snapshot=capture_game(games[0],True,35)
          print('FREE_MLB_CANARY '+json.dumps({'schedule_id':games[0]['schedule_id'],
              'url':url,'event_at':at.isoformat(),'title':snapshot.title,'venue':snapshot.venue,
              'sections':len(snapshot.sections),'seconds':round(time.monotonic()-clock,2),
              'database_writes':0}),flush=True)
          PY
