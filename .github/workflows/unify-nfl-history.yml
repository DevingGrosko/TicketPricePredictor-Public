name: Unify NFL game history

on:
  push:
    branches:
      - fix/unify-nfl-game-history
    paths:
      - ".github/workflows/unify-nfl-history.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/unify-nfl-game-history
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Unify upcoming and completed NFL history
        run: |
          python - <<'PY'
          from pathlib import Path

          blueprint = Path("Flask_App/nfl_blueprint.py")
          source = blueprint.read_text(encoding="utf-8")
          old = '''def _nfl_home_context(archive_mode: bool) -> dict[str, Any]:
              model = CreateNFLModel()
              now = datetime.now(timezone.utc)
              try:
                  with model.getSession()() as session:
                      all_games = session.query(NFLEvent).order_by(NFLEvent.event_date).all()
                      completed_count = sum(_event_is_completed(game, now) for game in all_games)
                      upcoming_count = len(all_games) - completed_count
                      games = [
                          game
                          for game in all_games
                          if _event_is_completed(game, now) == archive_mode
                      ]
                      if archive_mode:
                          games.reverse()

                      games_dict: dict[str, list[dict[str, str]]] = {}
                      game_sections_dict: dict[str, dict[str, list[str]]] = {}
                      for game in games:
                          home_team = nfl_event_home_team(game)
                          if home_team is None:
                              continue
                          games_dict.setdefault(home_team, []).append(
                              {"value": str(game.id), "label": format_nfl_title(game)}
                          )
                          game_sections_dict.setdefault(home_team, {})[
                              str(game.id)
                          ] = sorted(set(game.sections or []))

                      games_dict = dict(sorted(games_dict.items()))
                      game_sections_dict = {
                          team: game_sections_dict[team] for team in games_dict
                      }
                      team_count = len(games_dict)
                      game_count = sum(len(team_games) for team_games in games_dict.values())
                      section_count = len(
                          {
                              section
                              for by_game in game_sections_dict.values()
                              for sections in by_game.values()
                              for section in sections
                          }
                      )
              finally:
                  model.engine.dispose()

              return {
                  "games_dict": games_dict,
                  "game_sections_dict": game_sections_dict,
                  "team_count": team_count,
                  "game_count": game_count,
                  "section_count": section_count,
                  "archive_mode": archive_mode,
                  "upcoming_count": upcoming_count,
                  "completed_count": completed_count,
              }


          @nfl_blueprint.get("/nfl")
          def nfl_home():
              return render_template("NFLHomeScreen.html", **_nfl_home_context(False))


          @nfl_blueprint.get("/nfl/archive")
          def nfl_archive():
              return render_template("NFLHomeScreen.html", **_nfl_home_context(True))
          '''
          new = '''def _nfl_home_context() -> dict[str, Any]:
              """Expose every tracked game through one persistent NFL history."""
              model = CreateNFLModel()
              now = datetime.now(timezone.utc)
              try:
                  with model.getSession()() as session:
                      all_games = session.query(NFLEvent).order_by(NFLEvent.event_date).all()
                      upcoming_games = [
                          game for game in all_games if not _event_is_completed(game, now)
                      ]
                      completed_games = [
                          game for game in all_games if _event_is_completed(game, now)
                      ]
                      # Upcoming games stay chronological; completed games follow newest first.
                      games = upcoming_games + list(reversed(completed_games))
                      upcoming_count = len(upcoming_games)
                      completed_count = len(completed_games)

                      games_dict: dict[str, list[dict[str, str]]] = {}
                      game_sections_dict: dict[str, dict[str, list[str]]] = {}
                      stadium_game_counts: dict[str, int] = {}
                      for game in games:
                          home_team = nfl_event_home_team(game)
                          if home_team is None:
                              continue
                          completed = _event_is_completed(game, now)
                          status = "Completed" if completed else "Upcoming"
                          venue = nfl_display_venue(game)
                          games_dict.setdefault(home_team, []).append(
                              {
                                  "value": str(game.id),
                                  "label": (
                                      f"{status} · {format_nfl_title(game)} · {venue}"
                                  ),
                                  "status": status.casefold(),
                                  "venue": venue,
                              }
                          )
                          game_sections_dict.setdefault(home_team, {})[
                              str(game.id)
                          ] = sorted(set(game.sections or []))
                          if venue:
                              stadium_game_counts[venue] = (
                                  stadium_game_counts.get(venue, 0) + 1
                              )

                      games_dict = dict(sorted(games_dict.items()))
                      game_sections_dict = {
                          team: game_sections_dict[team] for team in games_dict
                      }
                      stadium_game_counts = dict(sorted(stadium_game_counts.items()))
                      team_count = len(games_dict)
                      game_count = sum(len(team_games) for team_games in games_dict.values())
                      section_count = len(
                          {
                              section
                              for by_game in game_sections_dict.values()
                              for sections in by_game.values()
                              for section in sections
                          }
                      )
              finally:
                  model.engine.dispose()

              return {
                  "games_dict": games_dict,
                  "game_sections_dict": game_sections_dict,
                  "team_count": team_count,
                  "game_count": game_count,
                  "section_count": section_count,
                  "stadium_count": len(stadium_game_counts),
                  "stadium_game_counts": stadium_game_counts,
                  "upcoming_count": upcoming_count,
                  "completed_count": completed_count,
              }


          @nfl_blueprint.get("/nfl")
          def nfl_home():
              return render_template("NFLHomeScreen.html", **_nfl_home_context())


          @nfl_blueprint.get("/nfl/archive")
          def nfl_archive():
              """Retain old bookmarks while serving the unified NFL history."""
              return nfl_home()
          '''
          if source.count(old) != 1:
              raise SystemExit(
                  f"Expected one split NFL history block, found {source.count(old)}"
              )
          blueprint.write_text(source.replace(old, new), encoding="utf-8")

          template = Path("Flask_App/templates/NFLHomeScreen.html")
          template.write_text('''{% extends "base.html" %}
          {% block title %}NFL ticket history — TicketSignal{% endblock %}
          {% block body_class %}nfl-theme{% endblock %}
          {% block head %}
            <meta name="theme-color" content="#013369">
            <link rel="stylesheet" href="{{ url_for('static', filename='css/nfl.css') }}?v=1">
            <link rel="stylesheet" href="{{ url_for('static', filename='css/nfl-responsive.css') }}?v=1">
            <link rel="stylesheet" href="{{ url_for('static', filename='css/nfl-map.css') }}?v=2">
          {% endblock %}

          {% block content %}
          <div class="nfl-page">
            <section class="nfl-hero">
              <div class="nfl-hero__copy">
                <div class="nfl-kicker">
                  <span class="nfl-mini-shield" aria-hidden="true"><i></i><strong>TS</strong></span>
                  <span>NFL market history</span>
                  <span class="nfl-live-tag"><i></i> Live + historical</span>
                </div>
                <h1>Track every game.<br><em>Build the market history.</em></h1>
                <p class="nfl-hero__lede">Upcoming and completed games remain in one searchable history. Choose any tracked home team, matchup, and section to inspect its full ticket-price movement. Kickoff and capture times are shown in Eastern Time.</p>
                <div class="nfl-hero__actions">
                  <a class="button nfl-button nfl-button--primary" href="#explore-nfl">Explore game history <span aria-hidden="true">&#8595;</span></a>
                  <a class="nfl-text-link" href="#explore-nfl">{{ upcoming_count }} upcoming · {{ completed_count }} completed <span aria-hidden="true">&#8594;</span></a>
                  <a class="nfl-text-link" href="{{ url_for('home') }}">Switch to baseball <span aria-hidden="true">&#8594;</span></a>
                </div>

                <dl class="nfl-metrics" aria-label="NFL database totals">
                  <div><dt>{{ team_count }}</dt><dd>Home teams</dd></div>
                  <div><dt>{{ game_count }}</dt><dd>Games tracked</dd></div>
                  <div><dt>{{ stadium_count }}</dt><dd>Stadiums tracked</dd></div>
                </dl>
              </div>

              <div class="nfl-scoreboard" aria-label="NFL collection window and cadence">
                <div class="nfl-scoreboard__topline">
                  <div>
                    <span>Market history</span>
                    <strong>Thirty-day price movement</strong>
                  </div>
                  <span class="nfl-status"><i></i> Persistent dataset</span>
                </div>

                <div class="nfl-clock">
                  <span>Tracking window</span>
                  <strong>720:00</strong>
                  <small>Hours to kickoff</small>
                </div>

                <div class="nfl-field" aria-hidden="true">
                  <div class="nfl-field__endzone nfl-field__endzone--left">30 DAYS</div>
                  <div class="nfl-field__surface">
                    <div class="nfl-yard-labels"><span>20</span><span>40</span><span>50</span><span>40</span><span>20</span></div>
                    <div class="nfl-hash nfl-hash--top"></div>
                    <div class="nfl-hash nfl-hash--bottom"></div>
                    <svg viewBox="0 0 620 220" preserveAspectRatio="none" role="img" aria-label="Illustrative ticket price movement toward kickoff">
                      <defs>
                        <linearGradient id="nflHomeAreaGradient" x1="0" x2="0" y1="0" y2="1">
                          <stop offset="0%" stop-color="#d50a0a" stop-opacity=".34"/>
                          <stop offset="100%" stop-color="#d50a0a" stop-opacity="0"/>
                        </linearGradient>
                      </defs>
                      <path class="nfl-field__area" d="M0 62 C70 38,116 106,178 79 S280 128,342 91 S455 156,620 112 L620 220 L0 220 Z"/>
                      <path class="nfl-field__line" d="M0 62 C70 38,116 106,178 79 S280 128,342 91 S455 156,620 112"/>
                      <circle cx="455" cy="142" r="7"/>
                    </svg>
                    <span class="nfl-field__tooltip">Scheduled snapshot</span>
                  </div>
                  <div class="nfl-field__endzone nfl-field__endzone--right">KICKOFF</div>
                </div>

                <div class="nfl-scoreboard__footer">
                  <div><span>Cadence</span><strong>6h → 3h → 1h</strong></div>
                  <div><span>Timezone</span><strong>Eastern Time</strong></div>
                </div>
              </div>
            </section>

            <section class="nfl-data-bar" id="how-it-works" aria-label="NFL tracker methodology">
              <div><span>01</span><strong>Thirty-day window</strong><small>Collection begins up to 720 hours before kickoff.</small></div>
              <div><span>02</span><strong>Adaptive cadence</strong><small>Every 6 hours, then 3 hours, then hourly in the final week.</small></div>
              <div><span>03</span><strong>Persistent game history</strong><small>Upcoming and completed games stay together for cross-game and stadium analysis.</small></div>
            </section>

            <section class="nfl-explore" id="explore-nfl">
              <div class="nfl-section-heading">
                <div>
                  <span class="nfl-section-kicker">Any tracked matchup</span>
                  <h2>Choose a game in three steps.</h2>
                </div>
                <p>Select the designated home team, game, and section. Games remain available after kickoff, so the same interface supports live decisions, historical review, and future stadium-level comparisons.</p>
              </div>

              <div class="nfl-analysis-shell">
                <div class="nfl-playbook">
                  <div class="nfl-playbook__mark" aria-hidden="true">
                    <span class="nfl-football-icon"><i></i></span>
                  </div>
                  <span class="nfl-section-kicker">Single-game analysis</span>
                  <h3>One dataset from collection through history.</h3>
                  <p>Completed games are not removed from the analysis flow. Their section histories remain alongside upcoming games and accumulate under canonical stadium names.</p>
                  <div class="nfl-feature-list">
                    <div><span>720h</span><p><strong>Full 30-day window</strong><small>Early movement through the final kickoff countdown.</small></p></div>
                    <div><span>6→3→1h</span><p><strong>Adaptive snapshots</strong><small>More frequent observations as kickoff gets closer.</small></p></div>
                    <div><span>VENUE</span><p><strong>Canonical stadiums</strong><small>Games can later be compared and aggregated by home venue.</small></p></div>
                  </div>
                </div>

                <form class="nfl-selection-form">
                  <div class="nfl-form__header">
                    <div><span>Price chart setup</span><strong>Choose your view</strong></div>
                    <span class="nfl-form__count">3 picks</span>
                  </div>
                  {% if not games_dict %}
                    <p class="nfl-form-note"><span aria-hidden="true">&#9432;</span> No NFL games are stored yet.</p>
                  {% endif %}
                  <div class="field nfl-field-control">
                    <label for="nfl-team"><span>1</span> Home team</label>
                    <select id="nfl-team" class="place-select">
                      <option value="">Select a team</option>
                      {% for team in games_dict %}<option value="{{ team }}">{{ team }}</option>{% endfor %}
                    </select>
                  </div>
                  <div class="field nfl-field-control">
                    <label for="nfl-game"><span>2</span> Matchup</label>
                    <select id="nfl-game" class="game-select" disabled><option value="">Select a game</option></select>
                  </div>
                  <div class="field nfl-field-control">
                    <label for="nfl-section"><span>3</span> Section</label>
                    <select id="nfl-section" class="section-select" disabled><option value="">Select a section</option></select>
                  </div>
                  <div class="nfl-form-actions">
                    <button class="button nfl-button nfl-button--primary submit-analysis" type="submit" disabled>Open price trend <span aria-hidden="true">&#8594;</span></button>
                    <button class="button nfl-map-launch" type="button" data-map-launch data-map-base="{{ url_for('nfl.nfl_map') }}" disabled>Explore stadium map <span aria-hidden="true">&#8594;</span></button>
                  </div>
                  <p class="nfl-form-note"><span aria-hidden="true">&#9432;</span> Prices are historical marketplace observations, not a guarantee of future availability.</p>
                </form>
              </div>
            </section>
          </div>

          <script>
            const nflGamesData = {{ games_dict | tojson }};
            const nflGameSectionsData = {{ game_sections_dict | tojson }};
          </script>
          {% endblock %}

          {% block scripts %}<script src="{{ url_for('static', filename='js/nfl.js') }}?v=3"></script>{% endblock %}
          '''.replace("\n          ", "\n").lstrip(), encoding="utf-8")

          tests = Path("tests/test_nfl_metadata_enhancements.py")
          test_source = tests.read_text(encoding="utf-8")
          old_test = '''                with app.test_request_context("/nfl"):
                      self.assertEqual(nfl_home(), "ok")
                  upcoming_context = render.call_args.kwargs
                  self.assertEqual(upcoming_context["game_count"], 1)
                  self.assertFalse(upcoming_context["archive_mode"])
                  self.assertIn("New York Giants", upcoming_context["games_dict"])

                  render.reset_mock(return_value=True)
                  render.return_value = "archive"
                  with app.test_request_context("/nfl/archive"):
                      self.assertEqual(nfl_archive(), "archive")
                  archive_context = render.call_args.kwargs
                  self.assertEqual(archive_context["game_count"], 1)
                  self.assertTrue(archive_context["archive_mode"])
                  self.assertIn("New York Jets", archive_context["games_dict"])
          '''
          new_test = '''                with app.test_request_context("/nfl"):
                      self.assertEqual(nfl_home(), "ok")
                  history_context = render.call_args.kwargs
                  self.assertEqual(history_context["game_count"], 2)
                  self.assertEqual(history_context["upcoming_count"], 1)
                  self.assertEqual(history_context["completed_count"], 1)
                  self.assertEqual(history_context["stadium_count"], 1)
                  self.assertEqual(
                      history_context["stadium_game_counts"],
                      {"U.S. Bank Stadium": 2},
                  )
                  self.assertIn("New York Giants", history_context["games_dict"])
                  self.assertIn("New York Jets", history_context["games_dict"])
                  self.assertTrue(
                      history_context["games_dict"]["New York Giants"][0]["label"]
                      .startswith("Upcoming ·")
                  )
                  self.assertTrue(
                      history_context["games_dict"]["New York Jets"][0]["label"]
                      .startswith("Completed ·")
                  )

                  render.reset_mock(return_value=True)
                  render.return_value = "history"
                  with app.test_request_context("/nfl/archive"):
                      self.assertEqual(nfl_archive(), "history")
                  legacy_context = render.call_args.kwargs
                  self.assertEqual(legacy_context["game_count"], 2)
                  self.assertIn("New York Giants", legacy_context["games_dict"])
                  self.assertIn("New York Jets", legacy_context["games_dict"])
          '''
          if test_source.count(old_test) != 1:
              raise SystemExit(
                  f"Expected one split-history test block, found {test_source.count(old_test)}"
              )
          tests.write_text(test_source.replace(old_test, new_test), encoding="utf-8")

          readme = Path("README.md")
          readme_source = readme.read_text(encoding="utf-8")
          old_bullet = "- Each tracked NFL game has an interactive stadium-bowl schematic generated from its collected section names and numbers, with direct links to price history and the provider's exact event map.\n"
          new_bullets = (
              "- Upcoming and completed NFL games remain in one selectable history, so completed games continue feeding cross-game and future stadium-level analysis.\n"
              "- Each tracked NFL game has an interactive stadium map using verified provider polygons when available, with a generated schematic fallback and direct links to section price history.\n"
          )
          if readme_source.count(old_bullet) != 1:
              raise SystemExit("Expected the NFL map README bullet once")
          readme_source = readme_source.replace(old_bullet, new_bullets)
          old_endpoint = "- `/nfl`: NFL analysis.\n"
          new_endpoint = (
              "- `/nfl`: unified NFL analysis for upcoming and completed games.\n"
              "- `/nfl/archive`: legacy bookmark alias for the unified NFL history.\n"
          )
          if readme_source.count(old_endpoint) != 1:
              raise SystemExit("Expected the NFL endpoint README line once")
          readme.write_text(
              readme_source.replace(old_endpoint, new_endpoint),
              encoding="utf-8",
          )
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate unified NFL history
        run: python -m unittest discover -s tests -v

      - name: Commit the unified history
        run: |
          rm .github/workflows/unify-nfl-history.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Flask_App/nfl_blueprint.py Flask_App/templates/NFLHomeScreen.html tests/test_nfl_metadata_enhancements.py README.md .github/workflows/unify-nfl-history.yml
          git commit -m "Keep all NFL games in one market history"
          git push origin HEAD:fix/unify-nfl-game-history
