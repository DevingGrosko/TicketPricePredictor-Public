name: Unify NFL game history v3

on:
  push:
    branches:
      - fix/unify-nfl-game-history
    paths:
      - ".github/workflows/unify-nfl-history-v3.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/unify-nfl-game-history
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Unify upcoming and completed NFL history
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          blueprint = Path("Flask_App/nfl_blueprint.py")
          source = blueprint.read_text(encoding="utf-8")
          start_marker = "def _nfl_home_context(archive_mode: bool) -> dict[str, Any]:"
          end_marker = '@nfl_blueprint.get("/nfl/map")'
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate the split NFL history route block")

          unified = textwrap.dedent(
              '''
              def _nfl_home_context() -> dict[str, Any]:
                  """Expose every tracked game through one persistent NFL history."""
                  model = CreateNFLModel()
                  now = datetime.now(timezone.utc)
                  try:
                      with model.getSession()() as session:
                          all_games = (
                              session.query(NFLEvent)
                              .order_by(NFLEvent.event_date)
                              .all()
                          )
                          upcoming_games = [
                              game
                              for game in all_games
                              if not _event_is_completed(game, now)
                          ]
                          completed_games = [
                              game
                              for game in all_games
                              if _event_is_completed(game, now)
                          ]
                          # Upcoming games stay chronological; completed games follow
                          # newest first. Both remain in the same selectable history.
                          games = upcoming_games + list(reversed(completed_games))
                          upcoming_count = len(upcoming_games)
                          completed_count = len(completed_games)

                          games_dict: dict[str, list[dict[str, str]]] = {}
                          game_sections_dict: dict[str, dict[str, list[str]]] = {}
                          stadium_game_counts: dict[str, int] = {}
                          for game in games:
                              home_team = nfl_event_home_team(game)
                              if home_team is None:
                                  continue
                              completed = _event_is_completed(game, now)
                              status = "Completed" if completed else "Upcoming"
                              venue = nfl_display_venue(game)
                              games_dict.setdefault(home_team, []).append(
                                  {
                                      "value": str(game.id),
                                      "label": (
                                          f"{status} · {format_nfl_title(game)} · "
                                          f"{venue}"
                                      ),
                                      "status": status.casefold(),
                                      "venue": venue,
                                  }
                              )
                              game_sections_dict.setdefault(home_team, {})[
                                  str(game.id)
                              ] = sorted(set(game.sections or []))
                              if venue:
                                  stadium_game_counts[venue] = (
                                      stadium_game_counts.get(venue, 0) + 1
                                  )

                          games_dict = dict(sorted(games_dict.items()))
                          game_sections_dict = {
                              team: game_sections_dict[team] for team in games_dict
                          }
                          stadium_game_counts = dict(sorted(stadium_game_counts.items()))
                          team_count = len(games_dict)
                          game_count = sum(
                              len(team_games) for team_games in games_dict.values()
                          )
                          section_count = len(
                              {
                                  section
                                  for by_game in game_sections_dict.values()
                                  for sections in by_game.values()
                                  for section in sections
                              }
                          )
                  finally:
                      model.engine.dispose()

                  return {
                      "games_dict": games_dict,
                      "game_sections_dict": game_sections_dict,
                      "team_count": team_count,
                      "game_count": game_count,
                      "section_count": section_count,
                      "stadium_count": len(stadium_game_counts),
                      "stadium_game_counts": stadium_game_counts,
                      "upcoming_count": upcoming_count,
                      "completed_count": completed_count,
                  }


              @nfl_blueprint.get("/nfl")
              def nfl_home():
                  return render_template("NFLHomeScreen.html", **_nfl_home_context())


              @nfl_blueprint.get("/nfl/archive")
              def nfl_archive():
                  """Retain old bookmarks while serving the unified NFL history."""
                  return nfl_home()
              '''
          ).lstrip()
          blueprint.write_text(
              source[:start] + unified + "\n\n\n" + source[end:],
              encoding="utf-8",
          )

          # The complete unified template was reviewed in the first one-shot file.
          # Strip only the workflow's ten-space YAML prefix, preserving HTML nesting.
          first_workflow = Path(".github/workflows/unify-nfl-history.yml").read_text(
              encoding="utf-8"
          )
          template_start_marker = "          template.write_text('''"
          template_end_marker = (
              "\n          '''.replace(\"\\n          \", \"\\n\").lstrip(), "
              "encoding=\"utf-8\")"
          )
          template_start = first_workflow.find(template_start_marker)
          template_end = first_workflow.find(template_end_marker, template_start)
          if template_start < 0 or template_end < 0:
              raise SystemExit("Could not extract the unified NFL template")
          raw_template = first_workflow[
              template_start + len(template_start_marker):template_end
          ]
          template_lines = raw_template.splitlines()
          normalized_lines = []
          for index, line in enumerate(template_lines):
              if index and line.startswith("          "):
                  line = line[10:]
              normalized_lines.append(line)
          template_text = "\n".join(normalized_lines).lstrip() + "\n"
          Path("Flask_App/templates/NFLHomeScreen.html").write_text(
              template_text,
              encoding="utf-8",
          )

          tests = Path("tests/test_nfl_metadata_enhancements.py")
          test_source = tests.read_text(encoding="utf-8")
          test_start_marker = '                with app.test_request_context("/nfl"):\n'
          test_end_marker = (
              "                render.reset_mock(return_value=True)\n"
              "                render.return_value = \"map\"\n"
          )
          test_start = test_source.find(test_start_marker)
          test_end = test_source.find(test_end_marker, test_start)
          if test_start < 0 or test_end < 0:
              raise SystemExit("Could not locate the split-history test assertions")

          test_body = textwrap.dedent(
              '''
              with app.test_request_context("/nfl"):
                  self.assertEqual(nfl_home(), "ok")
              history_context = render.call_args.kwargs
              self.assertEqual(history_context["game_count"], 2)
              self.assertEqual(history_context["upcoming_count"], 1)
              self.assertEqual(history_context["completed_count"], 1)
              self.assertEqual(history_context["stadium_count"], 1)
              self.assertEqual(
                  history_context["stadium_game_counts"],
                  {"U.S. Bank Stadium": 2},
              )
              self.assertIn("New York Giants", history_context["games_dict"])
              self.assertIn("New York Jets", history_context["games_dict"])
              self.assertTrue(
                  history_context["games_dict"]["New York Giants"][0]["label"]
                  .startswith("Upcoming ·")
              )
              self.assertTrue(
                  history_context["games_dict"]["New York Jets"][0]["label"]
                  .startswith("Completed ·")
              )

              render.reset_mock(return_value=True)
              render.return_value = "history"
              with app.test_request_context("/nfl/archive"):
                  self.assertEqual(nfl_archive(), "history")
              legacy_context = render.call_args.kwargs
              self.assertEqual(legacy_context["game_count"], 2)
              self.assertIn("New York Giants", legacy_context["games_dict"])
              self.assertIn("New York Jets", legacy_context["games_dict"])
              '''
          ).lstrip()
          unified_test = textwrap.indent(test_body, "                ") + "\n\n"
          tests.write_text(
              test_source[:test_start] + unified_test + test_source[test_end:],
              encoding="utf-8",
          )

          readme = Path("README.md")
          readme_source = readme.read_text(encoding="utf-8")
          old_bullet = "- Each tracked NFL game has an interactive stadium-bowl schematic generated from its collected section names and numbers, with direct links to price history and the provider's exact event map.\n"
          new_bullets = (
              "- Upcoming and completed NFL games remain in one selectable history, so completed games continue feeding cross-game and future stadium-level analysis.\n"
              "- Each tracked NFL game has an interactive stadium map using verified provider polygons when available, with a generated schematic fallback and direct links to section price history.\n"
          )
          if readme_source.count(old_bullet) != 1:
              raise SystemExit("Expected the NFL map README bullet once")
          readme_source = readme_source.replace(old_bullet, new_bullets)
          old_endpoint = "- `/nfl`: NFL analysis.\n"
          new_endpoint = (
              "- `/nfl`: unified NFL analysis for upcoming and completed games.\n"
              "- `/nfl/archive`: legacy bookmark alias for the unified NFL history.\n"
          )
          if readme_source.count(old_endpoint) != 1:
              raise SystemExit("Expected the NFL endpoint README line once")
          readme.write_text(
              readme_source.replace(old_endpoint, new_endpoint),
              encoding="utf-8",
          )
          PY

      - name: Compile transformed Python
        run: |
          python -m py_compile \
            Flask_App/nfl_blueprint.py \
            tests/test_nfl_metadata_enhancements.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate unified NFL history
        run: python -m unittest discover -s tests -v

      - name: Commit the unified history
        run: |
          rm .github/workflows/unify-nfl-history.yml
          rm .github/workflows/unify-nfl-history-v2.yml
          rm .github/workflows/unify-nfl-history-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Flask_App/nfl_blueprint.py \
            Flask_App/templates/NFLHomeScreen.html \
            tests/test_nfl_metadata_enhancements.py \
            README.md \
            .github/workflows/unify-nfl-history.yml \
            .github/workflows/unify-nfl-history-v2.yml \
            .github/workflows/unify-nfl-history-v3.yml
          git commit -m "Keep all NFL games in one market history"
          git push origin HEAD:fix/unify-nfl-game-history
