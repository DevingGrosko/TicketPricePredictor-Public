name: Finalize MySQL cutover integration

on:
  push:
    branches:
      - feature/mysql-cutover
    paths:
      - ".github/workflows/finalize-mysql-cutover.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mysql-cutover
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Integrate MySQL backend and guarded cutover
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          def replace_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S | re.M)
              if count != 1:
                  raise RuntimeError(f"Expected one {label} match, found {count}")
              return updated

          # MLB backend selection. Explicit test/local paths remain SQLite.
          path = Path("models.py")
          text = path.read_text(encoding="utf-8")
          import_line = "from Flask_App.database_config import create_ticket_engine, is_sqlite_engine\n"
          if import_line not in text:
              marker = "PROJECT_DIR = Path(__file__).resolve().parent\n"
              if marker not in text:
                  raise RuntimeError("models.py project marker not found")
              text = text.replace(marker, import_line + "\n" + marker, 1)

          new_create_model = '''class CreateModel:
              def __init__(self, db_path: str | Path | None = None):
                  self.db_path = Path(db_path or database_path()).expanduser().resolve()
                  self.engine = create_ticket_engine(
                      "mlb",
                      sqlite_path=self.db_path,
                      force_sqlite=db_path is not None,
                  )
                  if is_sqlite_engine(self.engine):
                      if not self.db_path.exists():
                          raise FileNotFoundError(f"Database file missing: {self.db_path}")
                      _ensure_baseball_performance_indexes(self.engine, self.db_path)

                  from Flask_App.materialized_analytics import ensure_summary_schema

                  ensure_summary_schema(self.engine)
                  self.SessionLocal = sessionmaker(
                      bind=self.engine,
                      autoflush=False,
                      expire_on_commit=False,
                  )

              def getSession(self):
                  return self.SessionLocal
          '''
          new_create_model = re.sub(r"^          ", "", new_create_model, flags=re.M)
          text = replace_once(
              text,
              r"class CreateModel:\n.*?(?=\n\n# ---------------------------------------------------------------------------\n# Concert storage)",
              new_create_model.rstrip(),
              "CreateModel block",
          )
          path.write_text(text, encoding="utf-8")

          # NFL backend selection and SQLite-only legacy schema upgrades.
          path = Path("Flask_App/nfl_blueprint.py")
          text = path.read_text(encoding="utf-8")
          if "from Flask_App.database_config import" not in text:
              marker = "from Flask_App.performance_cache import (\n"
              imports = '''from Flask_App.database_config import (
              configured_backend,
              create_ticket_engine,
              is_sqlite_engine,
          )
          '''
              imports = re.sub(r"^          ", "", imports, flags=re.M)
              if marker not in text:
                  raise RuntimeError("NFL import marker not found")
              text = text.replace(marker, imports + marker, 1)

          signature = "def _ensure_nfl_schema(engine: Any, db_path: Path) -> None:\n"
          guard = signature + "    if not is_sqlite_engine(engine):\n        return\n"
          if guard not in text:
              if signature not in text:
                  raise RuntimeError("NFL schema function not found")
              text = text.replace(signature, guard, 1)

          new_nfl_model = '''class CreateNFLModel:
              """Open the configured NFL database, preserving explicit SQLite test files."""

              def __init__(self, db_path: str | Path | None = None):
                  self.db_path = Path(db_path or nfl_database_path()).expanduser().resolve()
                  self.engine = create_ticket_engine(
                      "nfl",
                      sqlite_path=self.db_path,
                      force_sqlite=db_path is not None,
                  )
                  if is_sqlite_engine(self.engine):
                      NFLBase.metadata.create_all(self.engine)
                      _ensure_nfl_schema(self.engine, self.db_path)
                  ensure_summary_schema(self.engine)
                  self.SessionLocal = sessionmaker(
                      bind=self.engine,
                      autoflush=False,
                      expire_on_commit=False,
                  )

              def getSession(self):
                  return self.SessionLocal
          '''
          new_nfl_model = re.sub(r"^          ", "", new_nfl_model, flags=re.M)
          text = replace_once(
              text,
              r"class CreateNFLModel:\n.*?\n    def getSession\(self\):\n        return self\.SessionLocal",
              new_nfl_model.rstrip(),
              "CreateNFLModel block",
          )
          text = text.replace(
              "        create_nfl_daily_backup(now=now)\n",
              "        if configured_backend() == \"sqlite\":\n            create_nfl_daily_backup(now=now)\n",
              1,
          )
          path.write_text(text, encoding="utf-8")

          # NHL backend selection and SQLite-only legacy schema upgrades.
          path = Path("Flask_App/nhl_blueprint.py")
          text = path.read_text(encoding="utf-8")
          if "from Flask_App.database_config import" not in text:
              marker = "from Flask_App.performance_cache import (\n"
              imports = '''from Flask_App.database_config import (
              configured_backend,
              create_ticket_engine,
              is_sqlite_engine,
          )
          '''
              imports = re.sub(r"^          ", "", imports, flags=re.M)
              if marker not in text:
                  raise RuntimeError("NHL import marker not found")
              text = text.replace(marker, imports + marker, 1)

          signature = "def _ensure_nhl_schema(engine: Any, db_path: Path) -> None:\n"
          guard = signature + "    if not is_sqlite_engine(engine):\n        return\n"
          if guard not in text:
              if signature not in text:
                  raise RuntimeError("NHL schema function not found")
              text = text.replace(signature, guard, 1)

          new_nhl_model = '''class CreateNHLModel:
              """Open the configured NHL database, preserving explicit SQLite test files."""

              def __init__(self, db_path: str | Path | None = None):
                  self.db_path = Path(db_path or nhl_database_path()).expanduser().resolve()
                  self.engine = create_ticket_engine(
                      "nhl",
                      sqlite_path=self.db_path,
                      force_sqlite=db_path is not None,
                  )
                  if is_sqlite_engine(self.engine):
                      NHLBase.metadata.create_all(self.engine)
                      _ensure_nhl_schema(self.engine, self.db_path)
                  ensure_summary_schema(self.engine)
                  self.SessionLocal = sessionmaker(
                      bind=self.engine,
                      autoflush=False,
                      expire_on_commit=False,
                  )

              def getSession(self):
                  return self.SessionLocal
          '''
          new_nhl_model = re.sub(r"^          ", "", new_nhl_model, flags=re.M)
          text = replace_once(
              text,
              r"class CreateNHLModel:\n.*?\n    def getSession\(self\):\n        return self\.SessionLocal",
              new_nhl_model.rstrip(),
              "CreateNHLModel block",
          )
          text = text.replace(
              "        create_nhl_daily_backup(now=now)\n",
              "        if configured_backend() == \"sqlite\":\n            create_nhl_daily_backup(now=now)\n",
              1,
          )
          path.write_text(text, encoding="utf-8")

          # App-wide migration pause and authenticated live backend status.
          path = Path("Flask_App/flask_app.py")
          text = path.read_text(encoding="utf-8")
          import_line = "from Flask_App.database_config import configured_backend, migration_pause_active\n"
          if import_line not in text:
              marker = "from Flask_App.performance_cache import (\n"
              if marker not in text:
                  raise RuntimeError("Flask app import marker not found")
              text = text.replace(marker, import_line + marker, 1)

          authorized_block = '''def authorized_collector_request():
              configured = os.environ.get("COLLECTOR_INGEST_TOKEN", "")
              supplied = request.headers.get("Authorization", "")
              if not configured:
                  return False
              return hmac.compare_digest(supplied, f"Bearer {configured}")
          '''
          authorized_block = re.sub(r"^          ", "", authorized_block, flags=re.M)
          routes = '''

          @app.before_request
          def pause_ticket_ingestion_during_database_migration():
              protected_paths = {
                  "/api/collector/snapshot",
                  "/api/nfl/snapshot",
                  "/api/nhl/snapshot",
              }
              if (
                  request.method == "POST"
                  and request.path in protected_paths
                  and migration_pause_active()
              ):
                  return (
                      jsonify(
                          {
                              "status": "maintenance",
                              "message": "Ticket collection is paused during a database migration.",
                          }
                      ),
                      503,
                  )
              return None


          @app.get("/api/database/status")
          def database_backend_status():
              if not authorized_collector_request():
                  return jsonify({"status": "unauthorized"}), 401
              return jsonify(
                  {
                      "status": "ok",
                      "backend": configured_backend(),
                      "migration_paused": migration_pause_active(),
                  }
              )
          '''
          routes = re.sub(r"^          ", "", routes, flags=re.M)
          if "/api/database/status" not in text:
              if authorized_block not in text:
                  raise RuntimeError("authorized_collector_request block not found")
              text = text.replace(authorized_block, authorized_block + routes, 1)
          text = text.replace(
              "        create_daily_backup(now=now)\n",
              "        if configured_backend() == \"sqlite\":\n            create_daily_backup(now=now)\n",
              1,
          )
          path.write_text(text, encoding="utf-8")

          # Production deploy synchronizes Flask_App but not arbitrary root tool folders.
          source_tool = Path("tools/mysql_cutover.py")
          deployed_tool = Path("Flask_App/mysql_cutover.py")
          if source_tool.exists():
              shutil.copy2(source_tool, deployed_tool)
              source_tool.unlink()
          if not deployed_tool.exists():
              raise RuntimeError("MySQL cutover tool is missing")

          # Harden connection pooling for one-request-at-a-time PythonAnywhere workers.
          path = Path("Flask_App/database_config.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("            max_overflow=2,\n", "            max_overflow=0,\n", 1)
          path.write_text(text, encoding="utf-8")

          # Preserve microseconds, bound the source snapshot, and verify through the
          # intended SQLAlchemy types instead of reflected MySQL integer booleans.
          path = deployed_tool
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from sqlalchemy import JSON, MetaData, String, Table, create_engine, func, inspect, select, text\n",
              "from sqlalchemy import DateTime, JSON, MetaData, String, Table, create_engine, func, inspect, select, text\n"
              "from sqlalchemy.dialects.mysql import DATETIME as MYSQL_DATETIME\n",
              1,
          )
          text = text.replace(
              "            if isinstance(column.type, String) and column.type.length is None:\n"
              "                column.type = String(_column_length(table.name, column.name))\n",
              "            if isinstance(column.type, String) and column.type.length is None:\n"
              "                column.type = String(_column_length(table.name, column.name))\n"
              "            if isinstance(column.type, DateTime):\n"
              "                column.type = MYSQL_DATETIME(fsp=6)\n",
              1,
          )
          source_engine_marker = '''def _source_engine(path: Path) -> Engine:
              if not path.exists():
                  raise FileNotFoundError(f"SQLite source database is missing: {path}")
              return create_engine(
                  f"sqlite:///{path.expanduser().resolve()}",
                  connect_args={"timeout": 60},
              )
          '''
          source_engine_marker = re.sub(r"^          ", "", source_engine_marker, flags=re.M)
          fingerprint_code = '''

          def _source_fingerprint(path: Path) -> dict[str, tuple[int, int]]:
              result: dict[str, tuple[int, int]] = {}
              for candidate in (
                  path,
                  Path(str(path) + "-wal"),
                  Path(str(path) + "-journal"),
              ):
                  if candidate.exists():
                      stat = candidate.stat()
                      result[candidate.name] = (int(stat.st_size), int(stat.st_mtime_ns))
              return result
          '''
          fingerprint_code = re.sub(r"^          ", "", fingerprint_code, flags=re.M)
          if "def _source_fingerprint" not in text:
              if source_engine_marker not in text:
                  raise RuntimeError("Migration source-engine block not found")
              text = text.replace(source_engine_marker, source_engine_marker + fingerprint_code, 1)

          text = text.replace(
              "        destination.execute(destination_table.insert(), payload)\n"
              "        copied += len(payload)\n",
              "        destination.execute(destination_table.insert(), payload)\n"
              "        destination.commit()\n"
              "        copied += len(payload)\n",
              1,
          )
          text = text.replace(
              "    source_engine = _source_engine(source_path)\n",
              "    source_before = _source_fingerprint(source_path)\n"
              "    source_engine = _source_engine(source_path)\n",
              1,
          )
          old_verification = '''        destination_reflected = MetaData()
              destination_reflected.reflect(bind=destination, only=table_names)
              for name in table_names:
                  source_table = source_tables[name]
                  destination_table = destination_reflected.tables[name]
          '''
          old_verification = re.sub(r"^              ", "", old_verification, flags=re.M)
          new_verification = '''        for name in table_names:
                  source_table = source_tables[name]
                  destination_table = destination_tables[name]
          '''
          new_verification = re.sub(r"^              ", "", new_verification, flags=re.M)
          if old_verification not in text:
              raise RuntimeError("Migration verification block not found")
          text = text.replace(old_verification, new_verification, 1)
          text = text.replace(
              "        orphans = _foreign_key_orphans(destination, sport, destination_reflected.tables)\n",
              "        orphans = _foreign_key_orphans(destination, sport, destination_tables)\n",
              1,
          )
          source_stability = '''

              source_after = _source_fingerprint(source_path)
              if source_after != source_before:
                  raise RuntimeError(
                      f"{sport}: SQLite source changed during migration; "
                      "collector writes remain paused and the copy must be repeated with --replace."
                  )
          '''
          source_stability = re.sub(r"^              ", "", source_stability, flags=re.M)
          marker = "        if any(orphans.values()):\n            raise RuntimeError(f\"{sport}: foreign-key orphan verification failed: {orphans}\")\n"
          if "SQLite source changed during migration" not in text:
              if marker not in text:
                  raise RuntimeError("Foreign-key verification marker not found")
              text = text.replace(marker, marker + source_stability, 1)
          text = text.replace("python tools/mysql_cutover.py", "python3 -m Flask_App.mysql_cutover")
          path.write_text(text, encoding="utf-8")

          # Documentation.
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          if "## Production database migration" not in text:
              text += '''

          ## Production database migration

          SQLite remains the default local and rollback backend. Production can use
          independent MySQL databases for MLB, NFL, and NHL by setting
          `TICKETSIGNAL_DATABASE_BACKEND=mysql` and the server-owned MySQL settings
          documented in `.env.example`.

          The guarded production cutover is:

          ```bash
          python3 -m Flask_App.mysql_cutover migrate
          # Reload the PythonAnywhere web app from the Web tab.
          python3 -m Flask_App.mysql_cutover activate
          ```

          `migrate` blocks collector writes, copies all raw and materialized tables,
          verifies counts, key ranges, deterministic samples, source stability, and
          foreign-key integrity, then leaves collection paused until a reloaded live
          worker confirms MySQL. The original SQLite files remain rollback copies.
          Active MySQL data should also be protected with a scheduled `mysqldump`.
          '''
              text = re.sub(r"^          ", "", text, flags=re.M)
          else:
              text = text.replace("python tools/mysql_cutover.py", "python3 -m Flask_App.mysql_cutover")
          path.write_text(text, encoding="utf-8")

          # Focused regression coverage for the production route and MySQL schema.
          Path("tests/test_mysql_cutover_support.py").write_text('''from __future__ import annotations

          import os
          from pathlib import Path
          import tempfile
          import unittest
          from unittest.mock import patch

          from sqlalchemy import DateTime, String
          from sqlalchemy.dialects.mysql import DATETIME as MYSQL_DATETIME

          from Flask_App import database_config
          from Flask_App.mysql_cutover import _mysql_metadata


          class MySQLCutoverSupportTests(unittest.TestCase):
              def tearDown(self):
                  database_config.clear_mysql_engine_cache()

              def test_mysql_metadata_has_bounded_strings_and_microseconds(self):
                  for sport in ("mlb", "nfl", "nhl"):
                      metadata = _mysql_metadata(sport)
                      for table in metadata.tables.values():
                          for column in table.columns:
                              if isinstance(column.type, String):
                                  self.assertIsNotNone(column.type.length)
                              if isinstance(column.type, DateTime):
                                  self.assertIsInstance(column.type, MYSQL_DATETIME)
                                  self.assertEqual(column.type.fsp, 6)

              def test_pause_marker_blocks_all_ticket_ingestion_routes(self):
                  with tempfile.TemporaryDirectory() as temporary:
                      marker = Path(temporary) / "paused"
                      marker.write_text("paused")
                      with patch.object(database_config, "MIGRATION_PAUSE_PATH", marker), patch.dict(
                          os.environ,
                          {
                              "TICKETSIGNAL_DATABASE_BACKEND": "sqlite",
                              "COLLECTOR_INGEST_TOKEN": "test-token",
                          },
                          clear=False,
                      ):
                          from Flask_App.flask_app import app

                          client = app.test_client()
                          headers = {"Authorization": "Bearer test-token"}
                          for path in (
                              "/api/collector/snapshot",
                              "/api/nfl/snapshot",
                              "/api/nhl/snapshot",
                          ):
                              response = client.post(path, json={}, headers=headers)
                              self.assertEqual(response.status_code, 503, path)
                              self.assertEqual(response.get_json()["status"], "maintenance")


          if __name__ == "__main__":
              unittest.main()
          '''.replace("          ", ""), encoding="utf-8")
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate complete implementation
        env:
          DATABASE_PATH: ${{ runner.temp }}/mysql-cutover-tests/baseball.db
          CONCERT_DATABASE_PATH: ${{ runner.temp }}/mysql-cutover-tests/concerts.db
          NFL_DATABASE_PATH: ${{ runner.temp }}/mysql-cutover-tests/nfl.db
          NHL_DATABASE_PATH: ${{ runner.temp }}/mysql-cutover-tests/nhl.db
          FLASK_SECRET_KEY: test-key
          COLLECTOR_INGEST_TOKEN: test-token
          TICKETSIGNAL_DATABASE_BACKEND: sqlite
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          python -m py_compile \
            Flask_App/database_config.py \
            Flask_App/mysql_cutover.py \
            Flask_App/analytics_maintenance.py \
            Flask_App/flask_app.py \
            Flask_App/materialized_analytics.py \
            Flask_App/nfl_blueprint.py \
            Flask_App/nhl_blueprint.py \
            models.py
          python -m unittest discover -s tests -v

      - name: Publish reviewed implementation
        run: |
          rm -f .github/workflows/apply-mysql-cutover.yml
          rm -f .github/workflows/finalize-mysql-cutover.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete guarded MySQL production cutover"
          git push origin HEAD:feature/mysql-cutover
