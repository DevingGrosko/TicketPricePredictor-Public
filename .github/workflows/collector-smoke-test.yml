name: Collector smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/cache/restore@v5
        with:
          path: shared-observations/nfl
          key: shared-capture-v1-nfl-capture-41550615493-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v5
        with:
          path: shared-acknowledgments/nfl
          key: shared-capture-v1-nfl-tidb-41550615493-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v5
        with:
          path: shared-observations/nhl
          key: shared-capture-v1-nhl-capture-41550615493-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v5
        with:
          path: shared-acknowledgments/nhl
          key: shared-capture-v1-nhl-tidb-41550615493-1
          fail-on-cache-miss: true
      - name: Archive the four restored checkpoints without modifying them
        run: tar -czf recovery-checkpoints.tgz shared-observations shared-acknowledgments
      - uses: actions/upload-artifact@v7
        with:
          name: recovery-checkpoints-nov02
          path: recovery-checkpoints.tgz
          compression-level: 0
          retention-days: 90
