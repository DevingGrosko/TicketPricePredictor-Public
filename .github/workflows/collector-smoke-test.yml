name: Collector smoke test

on:
  pull_request:
    branches:
      - main
    paths:
      - "collector.py"
      - "models.py"
      - "tests/**"
      - "tools/install_capture_webkit.sh"
      - "requirements-webkit-collector.txt"
      - ".github/workflows/collect-ticket-prices.yml"
      - ".github/workflows/collector-smoke-test.yml"
  workflow_dispatch:
    inputs:
      event_url:
        description: Optional Vivid Seats event URL (otherwise discovers the next game)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  webkit-runtime:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install the production WebKit runtime within five minutes
        timeout-minutes: 5
        run: bash tools/install_capture_webkit.sh
      - name: Verify ordinary browser actions against local fixtures
        env:
          RUN_WEBKIT_OVERLAY_FIXTURE: '1'
        run: |
          python -m pip install -r requirements-collector.txt
          xvfb-run --auto-servernum python -m unittest tests.test_vivid_webkit_native_overlays -v

  capture:
    # MLB collection is paused; retain the explicitly requested manual canary.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install collector dependencies
        run: python -m pip install "selenium>=4.26.1,<5" "SQLAlchemy>=2,<3"

      - name: Show browser versions
        run: |
          google-chrome --version
          python -c "import selenium; print(f'Selenium {selenium.__version__}')"

      - name: Capture one event without writing to the database
        env:
          REQUESTED_EVENT_URL: ${{ inputs.event_url }}
        run: |
          if [[ -n "$REQUESTED_EVENT_URL" ]]; then
            python collector.py smoke "$REQUESTED_EVENT_URL" \
              --headless --timeout 45 --output collector_smoke_result.json
          else
            python collector.py smoke \
              --headless --timeout 45 --output collector_smoke_result.json
          fi

      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: collector-smoke-result
          path: collector_smoke_result.json
          if-no-files-found: warn
          retention-days: 7
