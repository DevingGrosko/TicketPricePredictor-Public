name: Collector smoke test

on:
  pull_request:
    branches:
      - main
    paths:
      - "collector.py"
      - "models.py"
      - "tests/**"
      - ".github/workflows/collector-smoke-test.yml"
  workflow_dispatch:
    inputs:
      event_url:
        description: Vivid Seats event URL to test
        required: true
        default: https://www.vividseats.com/washington-nationals-tickets-nationals-park-7-25-2026--sports-mlb-baseball/production/5967811

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEFAULT_EVENT_URL: https://www.vividseats.com/washington-nationals-tickets-nationals-park-7-25-2026--sports-mlb-baseball/production/5967811
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install collector dependencies
        run: python -m pip install "selenium>=4.26.1,<5" "SQLAlchemy>=2,<3"

      - name: Show browser versions
        run: |
          google-chrome --version
          python -c "import selenium; print(f'Selenium {selenium.__version__}')"

      - name: Capture one event without writing to the database
        env:
          REQUESTED_EVENT_URL: ${{ inputs.event_url }}
        run: |
          EVENT_URL="${REQUESTED_EVENT_URL:-$DEFAULT_EVENT_URL}"
          python collector.py smoke \
            "$EVENT_URL" \
            --headless \
            --timeout 45 \
            --output collector_smoke_result.json

      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: collector-smoke-result
          path: collector_smoke_result.json
          if-no-files-found: warn
          retention-days: 7
