name: Collector smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-collector.txt
      - run: bash tools/install_capture_webkit.sh
        timeout-minutes: 5
      - name: Read one event with the unchanged production adapter, without database access
        env:
          TICKETSIGNAL_BROWSER_ENGINE: webkit
        run: xvfb-run --auto-servernum python -u -m tools.browser_link_diagnostic
