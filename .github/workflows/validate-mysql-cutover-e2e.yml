name: Validate MySQL cutover end to end

on:
  push:
    branches:
      - feature/mysql-cutover
    paths:
      - ".github/workflows/validate-mysql-cutover-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bootstrap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_PATH: ${{ runner.temp }}/mysql-e2e/baseball.db
      CONCERT_DATABASE_PATH: ${{ runner.temp }}/mysql-e2e/concerts.db
      NFL_DATABASE_PATH: ${{ runner.temp }}/mysql-e2e/nfl.db
      NHL_DATABASE_PATH: ${{ runner.temp }}/mysql-e2e/nhl.db
      FLASK_SECRET_KEY: mysql-e2e-secret
      COLLECTOR_INGEST_TOKEN: mysql-e2e-token
      TICKETSIGNAL_DATABASE_BACKEND: sqlite
      MYSQL_HOST: 127.0.0.1
      MYSQL_USERNAME: root
      MYSQL_PASSWORD_B64: cm9vdA==
      MYSQL_MLB_DATABASE: ticketsignal_mlb
      MYSQL_NFL_DATABASE: ticketsignal_nfl
      MYSQL_NHL_DATABASE: ticketsignal_nhl

    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mysql-cutover

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Create isolated MySQL databases
        run: |
          python - <<'PY'
          import pymysql

          connection = pymysql.connect(
              host="127.0.0.1",
              user="root",
              password="root",
              autocommit=True,
              charset="utf8mb4",
          )
          try:
              with connection.cursor() as cursor:
                  for name in ("ticketsignal_mlb", "ticketsignal_nfl", "ticketsignal_nhl"):
                      cursor.execute(f"DROP DATABASE IF EXISTS `{name}`")
                      cursor.execute(
                          f"CREATE DATABASE `{name}` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
                      )
          finally:
              connection.close()
          PY

      - name: Build representative SQLite source databases
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          python - <<'PY'
          from datetime import datetime
          import os

          from sqlalchemy import create_engine
          from sqlalchemy.orm import Session

          from models import Base, Event, Iteration, Ticket
          from Flask_App.nfl_blueprint import NFLBase, NFLEvent, NFLIteration, NFLTicket
          from Flask_App.nhl_blueprint import NHLBase, NHLEvent, NHLIteration, NHLTicket
          from Flask_App.materialized_analytics import (
              DIRTY_VENUE,
              SECTION_BUCKET_SUMMARY,
              SECTION_SUMMARY_STATE,
              ensure_summary_schema,
          )

          captured = datetime(2026, 9, 10, 17, 0, 0, 123456)
          event_date = datetime(2026, 9, 10, 19, 0, 0, 654321)
          refreshed = datetime(2026, 9, 10, 17, 1, 0, 234567)

          def add_summary(engine, venue, section):
              ensure_summary_schema(engine)
              with engine.begin() as connection:
                  connection.execute(
                      SECTION_BUCKET_SUMMARY.insert().values(
                          event_id=1,
                          section_key=section.casefold().replace(" ", "-"),
                          bucket_slot=6,
                          section_name=section,
                          median_price=123.45,
                          observation_count=1,
                          first_captured_at=captured,
                          last_captured_at=captured,
                          refreshed_at=refreshed,
                      )
                  )
                  connection.execute(
                      SECTION_SUMMARY_STATE.insert().values(
                          event_id=1,
                          summary_version=1,
                          event_signature="a" * 64,
                          source_iteration_id=1,
                          source_iteration_count=1,
                          complete=True,
                          refreshed_at=refreshed,
                      )
                  )
                  connection.execute(
                      DIRTY_VENUE.insert().values(
                          venue=venue,
                          revision=1,
                          dirty=False,
                          updated_at=refreshed,
                      )
                  )

          mlb_engine = create_engine(f"sqlite:///{os.environ['DATABASE_PATH']}")
          Base.metadata.create_all(mlb_engine)
          with Session(mlb_engine) as session:
              event = Event(
                  id=1,
                  title="New York Yankees at Boston Red Sox",
                  event_date=event_date,
                  event_sections=["Field Box 10"],
                  URL="https://www.vividseats.com/game-tickets/production/1001",
                  Place="Fenway Park",
              )
              iteration = Iteration(id=1, event=event, captured_at=captured)
              ticket = Ticket(
                  id=1,
                  iteration=iteration,
                  section="Field Box 10",
                  price=123,
                  ticketsPerSection=2,
              )
              session.add_all([event, iteration, ticket])
              session.commit()
          add_summary(mlb_engine, "Fenway Park", "Field Box 10")
          mlb_engine.dispose()

          nfl_engine = create_engine(f"sqlite:///{os.environ['NFL_DATABASE_PATH']}")
          NFLBase.metadata.create_all(nfl_engine)
          with Session(nfl_engine) as session:
              event = NFLEvent(
                  id=1,
                  source_id="2001",
                  title="San Francisco 49ers at Los Angeles Rams",
                  event_date=event_date,
                  sections=["Section 100"],
                  source_url="https://www.vividseats.com/game-tickets/production/2001",
                  venue="SoFi Stadium",
                  home_team="Los Angeles Rams",
                  canonical_venue="SoFi Stadium",
                  provider_venue="SoFi Stadium",
                  map_geometry={"view_box": [0, 0, 10, 10], "sections": []},
              )
              iteration = NFLIteration(id=1, event=event, captured_at=captured)
              ticket = NFLTicket(
                  id=1,
                  iteration=iteration,
                  section="Section 100",
                  price=234,
                  listing_count=3,
              )
              session.add_all([event, iteration, ticket])
              session.commit()
          add_summary(nfl_engine, "SoFi Stadium", "Section 100")
          nfl_engine.dispose()

          nhl_engine = create_engine(f"sqlite:///{os.environ['NHL_DATABASE_PATH']}")
          NHLBase.metadata.create_all(nhl_engine)
          with Session(nhl_engine) as session:
              event = NHLEvent(
                  id=1,
                  source_id="3001",
                  title="Boston Bruins at New York Rangers",
                  event_date=event_date,
                  sections=["Section 101"],
                  source_url="https://www.vividseats.com/game-tickets/production/3001",
                  venue="Madison Square Garden",
                  home_team="New York Rangers",
                  canonical_venue="Madison Square Garden",
                  provider_venue="Madison Square Garden",
                  country="US",
                  currency="USD",
                  map_geometry={"view_box": [0, 0, 10, 10], "sections": []},
              )
              iteration = NHLIteration(id=1, event=event, captured_at=captured)
              ticket = NHLTicket(
                  id=1,
                  iteration=iteration,
                  section="Section 101",
                  price=345,
                  listing_count=4,
              )
              session.add_all([event, iteration, ticket])
              session.commit()
          add_summary(nhl_engine, "Madison Square Garden", "Section 101")
          nhl_engine.dispose()
          PY

          sha256sum "$DATABASE_PATH" "$NFL_DATABASE_PATH" "$NHL_DATABASE_PATH" > "$RUNNER_TEMP/sqlite-before.sha256"

      - name: Run guarded migration and verification
        run: |
          cat > .env <<EOF
          DATABASE_PATH=$DATABASE_PATH
          CONCERT_DATABASE_PATH=$CONCERT_DATABASE_PATH
          NFL_DATABASE_PATH=$NFL_DATABASE_PATH
          NHL_DATABASE_PATH=$NHL_DATABASE_PATH
          FLASK_SECRET_KEY=$FLASK_SECRET_KEY
          COLLECTOR_INGEST_TOKEN=$COLLECTOR_INGEST_TOKEN
          TICKETSIGNAL_DATABASE_BACKEND=sqlite
          MYSQL_HOST=$MYSQL_HOST
          MYSQL_USERNAME=$MYSQL_USERNAME
          MYSQL_PASSWORD_B64=$MYSQL_PASSWORD_B64
          MYSQL_MLB_DATABASE=$MYSQL_MLB_DATABASE
          MYSQL_NFL_DATABASE=$MYSQL_NFL_DATABASE
          MYSQL_NHL_DATABASE=$MYSQL_NHL_DATABASE
          EOF
          chmod 600 .env
          python -m Flask_App.mysql_cutover migrate --quiesce-seconds 0 --batch-size 2
          sha256sum -c "$RUNNER_TEMP/sqlite-before.sha256"

      - name: Exercise the application on migrated MySQL data
        env:
          TICKETSIGNAL_DATABASE_BACKEND: mysql
        run: |
          python - <<'PY'
          from sqlalchemy import func, select

          from Flask_App.database_config import create_mysql_engine
          from Flask_App.mysql_cutover import verify_mysql_against_manifest
          from Flask_App.flask_app import app
          from models import Event
          from Flask_App.nfl_blueprint import NFLEvent
          from Flask_App.nhl_blueprint import NHLEvent

          expected = verify_mysql_against_manifest()
          assert expected["mlb"]["event"] == 1
          assert expected["nfl"]["nfl_event"] == 1
          assert expected["nhl"]["nhl_event"] == 1

          for sport, table in (("mlb", Event.__table__), ("nfl", NFLEvent.__table__), ("nhl", NHLEvent.__table__)):
              engine = create_mysql_engine(sport)
              assert engine.dialect.name == "mysql"
              with engine.connect() as connection:
                  assert connection.execute(select(func.count()).select_from(table)).scalar_one() == 1

          client = app.test_client()
          for path in ("/", "/nfl", "/nhl"):
              response = client.get(path)
              assert response.status_code == 200, (path, response.status_code, response.data[:500])

          headers = {"Authorization": "Bearer mysql-e2e-token"}
          status = client.get("/api/database/status", headers=headers)
          assert status.status_code == 200
          payload = status.get_json()
          assert payload["backend"] == "mysql"
          assert payload["migration_paused"] is True
          assert set(payload["databases"]) == {"mlb", "nfl", "nhl"}
          assert all(
              item["connected"] and item["dialect"] == "mysql"
              for item in payload["databases"].values()
          )

          for path in ("/api/collector/snapshot", "/api/nfl/snapshot", "/api/nhl/snapshot"):
              response = client.post(path, json={}, headers=headers)
              assert response.status_code == 503, (path, response.status_code)
          PY
