name: Free refresh reliability checks
on:
  push:
    branches: [feature/free-half-hour-publication]
    paths:
      - .github/workflows/free-reliability-check.yml
      - tools/free_live_*.py
      - tools/free_nfl_parallel.py
      - tests/test_free_live_*.py
      - docs/free-live-*.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: free-refresh-reliability-checks
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r requirements-staging.txt pytest pyyaml
      - name: Offline capture, cache and publication regression tests
        run: python -m pytest tests/test_free_refresh*.py tests/test_free_live*.py --ignore-glob='*network*' -q
        if: hashFiles('tests/test_free_live*.py') != ''
      - name: Existing offline regression tests
        run: python -m pytest tests/test_free_refresh*.py -q
        if: hashFiles('tests/test_free_live*.py') == ''
      - name: Package public tracked source for local audit (no credentials or runtime data)
        run: git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/free-reliability-source.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: free-reliability-source
          path: ${{ runner.temp }}/free-reliability-source.tar.gz
          retention-days: 1
          if-no-files-found: error
