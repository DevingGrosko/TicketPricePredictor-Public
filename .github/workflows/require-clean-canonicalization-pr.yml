name: Require clean section canonicalization PR

on:
  pull_request:
    branches:
      - main
    paths:
      - "Flask_App/section_canonicalization.py"
      - "Flask_App/nfl_stadium_blueprint.py"
      - "Flask_App/templates/**"
      - "tests/test_section_canonicalization.py"
      - ".github/workflows/deploy-pythonanywhere.yml"
      - ".github/workflows/require-clean-canonicalization-pr.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Reject temporary implementation files
        run: |
          test ! -f tools/apply_section_canonicalization.py
          test ! -f .github/workflows/apply-section-canonicalization.yml
          test ! -f .github/workflows/verify-section-canonicalization-branch.yml
          test ! -f .github/workflows/finalize-section-canonicalization.yml
          test ! -f .github/workflows/verify-section-canonicalization-prerequisites.yml

      - name: Require integrated behavior
        run: |
          grep -F 'rows = _canonicalize_snapshot_rows(events, rows, sport_key)' Flask_App/nfl_stadium_blueprint.py
          grep -F 'canonical_section_key' Flask_App/templates/HomeScreen.html
          grep -F 'tracked areas' Flask_App/templates/NFLHomeScreen.html
          grep -F 'Flask_App/section_canonicalization.py' .github/workflows/deploy-pythonanywhere.yml
