name: Diagnose baseball stadium pages

on:
  push:
    branches:
      - diagnose/baseball-stadium-500
    paths:
      - ".github/workflows/diagnose-baseball-stadium.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Capture authenticated production traceback
        env:
          COLLECTOR_INGEST_TOKEN: ${{ secrets.COLLECTOR_INGEST_TOKEN }}
        run: |
          status="$(curl -sS --max-time 120 -o /tmp/diagnostic.json -w '%{http_code}' \
            -H "Authorization: Bearer $COLLECTOR_INGEST_TOKEN" \
            'https://bunnyjeff.pythonanywhere.com/api/diagnostics/mlb-stadium?venue=Truist%20Park')"
          echo "Diagnostic HTTP status: $status"
          python -m json.tool /tmp/diagnostic.json || cat /tmp/diagnostic.json
          test "$status" = "200" || test "$status" = "500"
