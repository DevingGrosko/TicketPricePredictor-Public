name: Hotfix NHL empty schedule report

on:
  push:
    branches:
      - hotfix/nhl-empty-schedule-report
    paths:
      - ".github/workflows/hotfix-nhl-empty-schedule.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hotfix/nhl-empty-schedule-report
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Import final cadence constant and add regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          collector = Path("nhl_schedule_collector.py")
          source = collector.read_text(encoding="utf-8")
          old = '''    NHL_EARLY_CADENCE_HOURS,
              NHL_HOURLY_WINDOW_HOURS,
          '''.replace("\n          ", "\n")
          new = '''    NHL_EARLY_CADENCE_HOURS,
              NHL_FINAL_CADENCE_HOURS,
              NHL_HOURLY_WINDOW_HOURS,
          '''.replace("\n          ", "\n")
          if source.count(old) != 1:
              raise SystemExit(
                  f"Expected one NHL cadence import block, found {source.count(old)}"
              )
          collector.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

          cat > tests/test_nhl_empty_schedule.py <<'PY'
          import json
          from pathlib import Path
          import tempfile
          import unittest
          from unittest.mock import patch

          from nhl_schedule_collector import run_schedule_collector


          class NHLEmptyScheduleTests(unittest.TestCase):
              def test_empty_schedule_is_a_healthy_collection_cycle(self):
                  with tempfile.TemporaryDirectory() as directory:
                      root = Path(directory)
                      health = root / "nhl-health.json"
                      pending = root / "pending"

                      with patch(
                          "nhl_schedule_collector.replay_pending_snapshots",
                          return_value=(0, True, []),
                      ), patch(
                          "nhl_schedule_collector.fetch_schedule_games",
                          return_value=([], ["official-nhl-schedule"]),
                      ):
                          code = run_schedule_collector(
                              "https://example.test/api/nhl/snapshot",
                              "test-token",
                              True,
                              1,
                              health,
                              pending,
                          )

                      self.assertEqual(code, 0)
                      report = json.loads(health.read_text(encoding="utf-8"))
                      self.assertEqual(report["status"], "healthy")
                      self.assertEqual(report["scheduled_in_window"], 0)
                      self.assertEqual(report["scheduled_due"], 0)
                      self.assertEqual(
                          report["cadence_policy"]["final_72_hours"],
                          1,
                      )


          if __name__ == "__main__":
              unittest.main()
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate the empty-schedule path and full suite
        run: |
          python -m py_compile nhl_schedule_collector.py tests/test_nhl_empty_schedule.py
          python -m unittest tests.test_nhl_empty_schedule -v
          python -m unittest discover -s tests -v

      - name: Commit the production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nhl_schedule_collector.py tests/test_nhl_empty_schedule.py
          git commit -m "Fix NHL empty-schedule health reporting"
          git push origin HEAD:hotfix/nhl-empty-schedule-report
