name: Tidy NHL resilience patch

on:
  push:
    branches:
      - fix/nhl-collector-resilience
    paths:
      - ".github/workflows/tidy-nhl-resilience-patch.yml"

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/nhl-collector-resilience
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Normalize formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          collector = Path("nhl_collector.py")
          source = collector.read_text(encoding="utf-8")
          old = '''            raise NHLInventoryIncompleteError(
        f"NHL capture rejected: only {len(sections)} usable sections; "
        f"minimum is {MIN_USABLE_SECTIONS}."
    )'''
          new = '''            raise NHLInventoryIncompleteError(
                f"NHL capture rejected: only {len(sections)} usable sections; "
                f"minimum is {MIN_USABLE_SECTIONS}."
            )'''
          if source.count(old) != 1:
              raise SystemExit("Could not locate the NHL inventory formatting block")
          collector.write_text(source.replace(old, new, 1), encoding="utf-8")

          schedule = Path("nhl_schedule_collector.py")
          source = schedule.read_text(encoding="utf-8")
          for old, new in (
              (
                  '    return {"in_window": in_window, "due_now": due}\ndef _dedupe_candidates',
                  '    return {"in_window": in_window, "due_now": due}\n\n\ndef _dedupe_candidates',
              ),
              (
                  '    return scheduled.event_date\ndef _capture_resolution',
                  '    return scheduled.event_date\n\n\ndef _capture_resolution',
              ),
              (
                  '    return bool(capture_errors or search_errors)\ndef _write_health',
                  '    return bool(capture_errors or search_errors)\n\n\ndef _write_health',
              ),
          ):
              if source.count(old) != 1:
                  raise SystemExit(f"Could not locate formatting boundary: {old!r}")
              source = source.replace(old, new, 1)
          schedule.write_text(source, encoding="utf-8")
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate cleanup
        env:
          DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/baseball.db
          CONCERT_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/concerts.db
          NFL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nfl.db
          NHL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nhl.db
          FLASK_SECRET_KEY: deployment-validation-key
          COLLECTOR_INGEST_TOKEN: deployment-validation-token
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          python -m py_compile nhl_collector.py nhl_schedule_collector.py tests/test_nhl_resilience.py
          python -m unittest discover -s tests -v

      - name: Commit code formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nhl_collector.py nhl_schedule_collector.py
          git commit -m "Tidy NHL resilience implementation"
          git push origin HEAD:fix/nhl-collector-resilience
