name: Apply robust section metrics

on:
  push:
    branches:
      - feature/robust-section-metrics
    paths:
      - ".github/workflows/apply-robust-section-metrics.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-robust-section-metrics
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/robust-section-metrics
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Extract prepared implementation
        run: |
          parts=(
            .github/robust-metrics-payload/part00
            .github/robust-metrics-payload/part01
            .github/robust-metrics-payload/part02
            .github/robust-metrics-payload/part03
            .github/robust-metrics-payload/part04
            .github/robust-metrics-payload/part05
            .github/robust-metrics-payload/part06
            .github/robust-metrics-payload/part07
          )
          wc -c "${parts[@]}"
          cat "${parts[@]}" > /tmp/robust-metrics.b64
          echo "9d039bb7ba289d5be1a0a233e3f3b4a26f19244d9fcb4fc272e4ad6a1028131a  /tmp/robust-metrics.b64" | sha256sum -c -
          base64 --decode /tmp/robust-metrics.b64 > /tmp/robust-metrics.tar.gz
          echo "1507a97f0036686647cd724567f4de18868bf67dbdbf9905aa7bd9f61e8b7585  /tmp/robust-metrics.tar.gz" | sha256sum -c -
          tar -xzf /tmp/robust-metrics.tar.gz
          rm -rf .github/robust-metrics-payload

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate implementation
        env:
          DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/baseball.db
          CONCERT_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/concerts.db
          NFL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nfl.db
          NHL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nhl.db
          FLASK_SECRET_KEY: deployment-validation-key
          COLLECTOR_INGEST_TOKEN: deployment-validation-token
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          python -m py_compile \
            Flask_App/nfl_stadium_blueprint.py \
            tests/test_flask_production_startup.py \
            tests/test_navigation_and_parking_filter.py \
            tests/test_nfl_stadium_insights.py
          node --check Flask_App/static/js/nfl-stadium.js
          node --check Flask_App/static/js/venue-section.js
          python -m unittest discover -s tests -v

      - name: Commit robust metrics and compact reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Use robust section metrics and compact reports"
          git push origin HEAD:feature/robust-section-metrics
