name: Clean section canonicalization branch

on:
  push:
    branches:
      - feature/section-canonicalization
    paths:
      - ".github/workflows/cleanup-section-canonicalization-branch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/section-canonicalization
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Remove temporary branch machinery and placeholder notes
        run: |
          rm -f tools/apply_section_canonicalization.py
          rmdir tools 2>/dev/null || true
          rm -f .github/workflows/apply-section-canonicalization.yml
          rm -f .github/workflows/verify-section-canonicalization-branch.yml
          rm -f .github/workflows/finalize-section-canonicalization.yml
          rm -f .github/workflows/verify-section-canonicalization-prerequisites.yml
          rm -f .github/workflows/require-clean-canonicalization-pr.yml
          rm -f audits/DO_NOT_ADD_MORE_MARKERS.txt
          rm -f audits/last-marker-before-pr.txt
          rm -f audits/pr-next.txt
          rm -f audits/no-more-files.txt
          rm -f audits/why-am-i-doing-this.txt
          rm -f audits/section-canonicalization-ready.txt
          rm -f audits/section-canonicalization-scope.txt
          rm -f audits/final-cleanup-list.txt
          rm -f audits/section-canonicalization-validation.md
          rm -f audits/section-canonicalization-release-notes.md

      - name: Require the intended implementation
        run: |
          test -f Flask_App/section_canonicalization.py
          test -f tests/test_section_canonicalization.py
          test -f audits/section-canonicalization-implementation.md
          grep -F 'rows = _canonicalize_snapshot_rows(events, rows, sport_key)' Flask_App/nfl_stadium_blueprint.py
          grep -F 'canonical_section_key' Flask_App/templates/HomeScreen.html
          grep -F 'tracked areas' Flask_App/templates/NFLHomeScreen.html
          grep -F 'tracked areas' Flask_App/templates/NHLHomeScreen.html
          grep -F 'tracked areas' Flask_App/templates/nfl_stadium.html
          grep -F 'Flask_App/section_canonicalization.py' .github/workflows/deploy-pythonanywhere.yml

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run complete validation
        env:
          DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/baseball.db
          CONCERT_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/concerts.db
          NFL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nfl.db
          NHL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nhl.db
          FLASK_SECRET_KEY: deployment-validation-key
          COLLECTOR_INGEST_TOKEN: deployment-validation-token
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          python -m py_compile Flask_App/section_canonicalization.py Flask_App/nfl_stadium_blueprint.py
          python -m unittest discover -s tests -v
          git diff --check

      - name: Commit cleaned branch
        run: |
          rm -f .github/workflows/cleanup-section-canonicalization-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Clean section canonicalization branch"
          git push origin HEAD:feature/section-canonicalization
