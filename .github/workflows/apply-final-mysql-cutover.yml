name: Validate and publish final MySQL cutover implementation

on:
  push:
    branches:
      - feature/mysql-cutover
    paths:
      - ".github/workflows/apply-final-mysql-cutover.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mysql-cutover
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply reviewed implementation patch
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/mysql-cutover.patch.gz.b64" <<'PATCH_B64'

PATCH_B64
          base64 --decode "$RUNNER_TEMP/mysql-cutover.patch.gz.b64" \
            | gzip --decompress > "$RUNNER_TEMP/mysql-cutover.patch"
          git apply --check "$RUNNER_TEMP/mysql-cutover.patch"
          git apply --index "$RUNNER_TEMP/mysql-cutover.patch"
          rm -f .github/workflows/apply-final-mysql-cutover.yml
          git add -A

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate implementation
        env:
          DATABASE_PATH: ${{ runner.temp }}/mysql-cutover-tests/baseball.db
          CONCERT_DATABASE_PATH: ${{ runner.temp }}/mysql-cutover-tests/concerts.db
          NFL_DATABASE_PATH: ${{ runner.temp }}/mysql-cutover-tests/nfl.db
          NHL_DATABASE_PATH: ${{ runner.temp }}/mysql-cutover-tests/nhl.db
          FLASK_SECRET_KEY: test-key
          COLLECTOR_INGEST_TOKEN: test-token
          TICKETSIGNAL_DATABASE_BACKEND: sqlite
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          python -m py_compile \
            models.py \
            Flask_App/database_config.py \
            Flask_App/mysql_cutover.py \
            Flask_App/flask_app.py \
            Flask_App/analytics_maintenance.py \
            Flask_App/materialized_analytics.py \
            Flask_App/nfl_blueprint.py \
            Flask_App/nfl_stadium_blueprint.py \
            Flask_App/nhl_blueprint.py
          python -m unittest discover -s tests -v

      - name: Publish validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete guarded MySQL production cutover"
          git push origin HEAD:feature/mysql-cutover
