name: Apply NFL reversed-matchup fix

on:
  push:
    branches:
      - fix/nfl-reversed-matchup-baseball-home
    paths:
      - "apply_nfl_failure_fix.ready"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/nfl-reversed-matchup-baseball-home
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply resolver and homepage fixes
        run: python apply_nfl_failure_fix.py

      - name: Validate targeted regressions
        run: |
          python -m py_compile nfl_schedule_collector.py Flask_App/flask_app.py
          python -m unittest \
            tests.test_nfl_schedule_collector \
            tests.test_flask_production_startup \
            -v

      - name: Commit implementation
        run: |
          rm -f \
            apply_nfl_failure_fix.py \
            apply_nfl_failure_fix.ready \
            .github/workflows/apply-nfl-failure-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reject reversed NFL matchups and restore baseball homepage"
          git push origin HEAD:fix/nfl-reversed-matchup-baseball-home
