name: Implement NHL collector resilience v3

on:
  push:
    branches:
      - fix/nhl-collector-resilience
    paths:
      - ".github/workflows/implement-nhl-collector-resilience-v3.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/nhl-collector-resilience
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply the NHL resilience patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re


          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one {label} in {path}, found {count}"
                  )
              file.write_text(source.replace(old, new, 1), encoding="utf-8")


          def regex_once(path: str, pattern: str, replacement: str, label: str) -> None:
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one {label} in {path}, found {count}"
                  )
              file.write_text(updated, encoding="utf-8")


          replace_once(
              "nhl_collector.py",
              '''class NHLSnapshotParser:
              """Convert one Vivid listings response to one lowest price per arena section."""''',
              '''class NHLInventoryIncompleteError(ValueError):
              """Vivid exposed too few priced sections for a trustworthy snapshot."""


          class NHLSnapshotParser:
              """Convert one Vivid listings response to one lowest price per arena section."""''',
              "NHL thin-inventory exception",
          )
          regex_once(
              "nhl_collector.py",
              r'''raise ValueError\(\s*f"NHL capture rejected: only \{len\(sections\)\} usable sections; "\s*f"minimum is \{MIN_USABLE_SECTIONS\}\."\s*\)''',
              '''raise NHLInventoryIncompleteError(
                  f"NHL capture rejected: only {len(sections)} usable sections; "
                  f"minimum is {MIN_USABLE_SECTIONS}."
              )''',
              "NHL thin-inventory raise",
          )

          replace_once(
              "nhl_schedule_collector.py",
              '''    NHL_FINAL_CADENCE_HOURS,
              NHL_SIX_HOUR_CADENCE_HOURS,''',
              '''    NHL_FINAL_CADENCE_HOURS,
              NHLInventoryIncompleteError,
              NHL_SIX_HOUR_CADENCE_HOURS,''',
              "NHL inventory exception import",
          )
          replace_once(
              "nhl_schedule_collector.py",
              '''@dataclass(frozen=True)
          class ScheduleResolution:
              game: ScheduledNHLGame
              candidates: tuple[DiscoveredNHLGame, ...]
              source: str


          JsonFetcher = Callable[[str, int], dict[str, Any]]''',
              '''@dataclass(frozen=True)
          class ScheduleResolution:
              game: ScheduledNHLGame
              candidates: tuple[DiscoveredNHLGame, ...]
              source: str


          class NHLProviderGapError(RuntimeError):
              """Vivid lacks enough trustworthy inventory for a scheduled game."""


          JsonFetcher = Callable[[str, int], dict[str, Any]]''',
              "NHL provider-gap exception",
          )
          replace_once(
              "nhl_schedule_collector.py",
              '''    same_date = [row for row in matches if row.date_hint == game.local_date]
              return _dedupe_candidates(same_date or matches)''',
              '''    same_date = [row for row in matches if row.date_hint == game.local_date]
              undated = [row for row in matches if row.date_hint is None]
              # A later meeting between the same teams is not a fallback for this
              # game. Undated candidates remain eligible and are verified from the
              # captured provider metadata.
              return _dedupe_candidates(same_date or undated)''',
              "exact-date NHL candidate policy",
          )
          regex_once(
              "nhl_schedule_collector.py",
              r'''def validate_captured_match\(.*?(?=\n\ndef _capture_resolution)''',
              '''def validate_captured_match(
              scheduled: ScheduledNHLGame,
              event_date: datetime,
              title: str,
          ) -> datetime:
              if ordered_matchup_from_title(title) != scheduled.matchup_key:
                  raise ValueError(
                      "Captured title does not match scheduled NHL teams in away/home order: "
                      f"{title}"
                  )

              provider_utc = as_utc(event_date)
              try:
                  provider_zone = ZoneInfo(
                      scheduled.venue_timezone or "America/New_York"
                  )
              except Exception:
                  provider_zone = ZoneInfo("America/New_York")
              provider_local_date = provider_utc.astimezone(provider_zone).date()
              difference = abs((provider_utc - scheduled.event_date).total_seconds())
              if (
                  provider_local_date != scheduled.local_date
                  and difference > EVENT_TIME_TOLERANCE_HOURS * 3600
              ):
                  raise ValueError(
                      "Vivid event date does not match the NHL schedule: "
                      f"provider {provider_local_date.isoformat()}, "
                      f"schedule {scheduled.local_date.isoformat()}."
                  )

              # The official NHL schedule is canonical. Some Vivid pages expose a
              # date-only startDate, which becomes local midnight and appears 19
              # hours earlier than a normal evening game on the same calendar date.
              return scheduled.event_date''',
              "NHL schedule-authoritative time validation",
          )
          regex_once(
              "nhl_schedule_collector.py",
              r'''def _capture_resolution\(.*?(?=\n\ndef _write_health)''',
              '''def _capture_resolution(
              resolution: ScheduleResolution,
              *,
              headless: bool,
              timeout: int,
          ) -> tuple[str, datetime, Any]:
              provider_gap_errors: list[str] = []
              capture_errors: list[str] = []
              for candidate in resolution.candidates:
                  browser: VividNFLBrowser | None = None
                  try:
                      url = validated_vivid_url(candidate.url)
                      browser = VividNFLBrowser(headless=headless, timeout=timeout)
                      raw_payload, provider_event_date = browser.capture(url)
                      snapshot = NHLSnapshotParser.parse(raw_payload)
                      event_date = validate_captured_match(
                          resolution.game,
                          provider_event_date,
                          snapshot.title,
                      )
                      return url, event_date, snapshot
                  except NHLInventoryIncompleteError as exc:
                      provider_gap_errors.append(
                          f"{candidate.url}: {type(exc).__name__}: {exc}"
                      )
                  except Exception as exc:
                      capture_errors.append(
                          f"{candidate.url}: {type(exc).__name__}: {exc}"
                      )
                  finally:
                      if browser is not None:
                          try:
                              browser.close()
                          except Exception:
                              pass

              if provider_gap_errors and not capture_errors:
                  raise NHLProviderGapError("; ".join(provider_gap_errors))
              raise RuntimeError(
                  "; ".join(capture_errors + provider_gap_errors)
                  or "No Vivid candidate was available."
              )


          def nhl_collection_should_fail(
              capture_errors: list[str],
              search_errors: list[str],
          ) -> bool:
              """Only operational failures should turn the workflow red."""

              return bool(capture_errors or search_errors)''',
              "NHL capture resolution and failure policy",
          )

          run_cycle = '''def run_schedule_collector(
              endpoint: str,
              token: str,
              headless: bool,
              timeout: int,
              health_output: Path,
              pending_dir: Path,
          ) -> int:
              started_at = datetime.now(timezone.utc)
              replayed, endpoint_available, queue_errors = replay_pending_snapshots(
                  endpoint,
                  token,
                  pending_dir,
              )
              capture_slot = hourly_capture_slot(started_at)

              try:
                  schedule, schedule_sources = fetch_schedule_games(started_at)
              except Exception as exc:
                  message = f"{type(exc).__name__}: {exc}"
                  _write_health(
                      health_output,
                      {
                          "status": "failure",
                          "event_type": "nhl",
                          "schedule_status": "unavailable",
                          "started_at": eastern_iso(started_at),
                          "error": message,
                      },
                  )
                  print(
                      f"NHL SCHEDULE FAILED: {message}",
                      file=sys.stderr,
                      flush=True,
                  )
                  return 1

              due_schedule = schedule_games_due(schedule, capture_slot)
              cadence_summary = schedule_cadence_summary(schedule, capture_slot)
              if due_schedule:
                  feed_rows, feed_warnings = discover_nhl_games(headless, timeout)
                  resolutions, search_errors = resolve_schedule_games(
                      due_schedule,
                      feed_rows,
                      headless=headless,
                      timeout=timeout,
                  )
              else:
                  feed_rows, feed_warnings = [], []
                  resolutions, search_errors = [], []
                  print(
                      f"No NHL games are due in this cadence slot; "
                      f"{len(schedule)} remain inside the 30-day window.",
                      flush=True,
                  )

              uploaded = 0
              captured = 0
              queued = 0
              capture_errors: list[str] = []
              unresolved: list[str] = []
              provider_gaps: list[str] = []
              uploads: list[dict[str, Any]] = []

              for index, resolution in enumerate(resolutions, start=1):
                  game = resolution.game
                  if not resolution.candidates:
                      message = (
                          f"{game.away_team} at {game.home_team} "
                          f"({eastern_iso(game.event_date)})"
                      )
                      unresolved.append(message)
                      provider_gaps.append(
                          f"{message}: no exact-date Vivid event was available"
                      )
                      print(
                          f"NHL PROVIDER GAP: {message}",
                          file=sys.stderr,
                          flush=True,
                      )
                      continue

                  try:
                      print(
                          f"[{index}/{len(resolutions)}] Capturing NHL game "
                          f"{game.away_team} at {game.home_team} via "
                          f"{resolution.source}.",
                          flush=True,
                      )
                      url, event_date, snapshot = _capture_resolution(
                          resolution,
                          headless=headless,
                          timeout=timeout,
                      )
                      if not nhl_is_within_capture_window(
                          event_date,
                          datetime.now(timezone.utc),
                      ):
                          raise ValueError(
                              "Resolved NHL event is outside the exact 30-day window."
                          )

                      payload = nhl_snapshot_to_payload(
                          url,
                          event_date,
                          capture_slot,
                          snapshot,
                          schedule=game.snapshot_metadata(snapshot.venue),
                      )
                      pending_path = queue_snapshot(payload, pending_dir)
                      captured += 1

                      if endpoint_available:
                          try:
                              response = post_snapshot_with_retry(
                                  endpoint,
                                  token,
                                  payload,
                              )
                          except Exception as exc:
                              endpoint_available = False
                              queued += 1
                              queue_errors.append(
                                  f"Snapshot retained as {pending_path.name}: "
                                  f"{type(exc).__name__}: {exc}"
                              )
                          else:
                              pending_path.unlink(missing_ok=True)
                              uploaded += response["status"] == "stored"
                              uploads.append(
                                  {
                                      "schedule_id": game.schedule_id,
                                      "game_type": game_type_label(game.game_type),
                                      "cadence_hours": nhl_capture_interval_hours(
                                          game.event_date,
                                          capture_slot,
                                      ),
                                      "cadence_tier": nhl_capture_tier(
                                          game.event_date,
                                          capture_slot,
                                      ),
                                      "url": url,
                                      "title": snapshot.title,
                                      "provider_venue": snapshot.venue,
                                      "canonical_venue": game.snapshot_metadata(
                                          snapshot.venue
                                      )["canonical_venue"],
                                      "country": game.country,
                                      "currency": snapshot.currency,
                                      "sections": len(snapshot.sections),
                                      "map_geometry_sections": geometry_section_count(
                                          getattr(snapshot, "map_geometry", None)
                                      ),
                                      "resolution_source": resolution.source,
                                      "result": response["status"],
                                  }
                              )
                              print(
                                  f"UPLOADED: {len(snapshot.sections)} sections for "
                                  f"{snapshot.title} ({response['status']}).",
                                  flush=True,
                              )
                      else:
                          queued += 1
                          print(
                              f"QUEUED: {len(snapshot.sections)} sections for "
                              f"{snapshot.title}.",
                              flush=True,
                          )
                  except NHLProviderGapError as exc:
                      message = (
                          f"{game.away_team} at {game.home_team}: "
                          f"{type(exc).__name__}: {exc}"
                      )
                      provider_gaps.append(message)
                      print(
                          f"NHL PROVIDER GAP: {message}",
                          file=sys.stderr,
                          flush=True,
                      )
                  except Exception as exc:
                      message = (
                          f"{game.away_team} at {game.home_team}: "
                          f"{type(exc).__name__}: {exc}"
                      )
                      capture_errors.append(message)
                      print(
                          f"NHL CAPTURE FAILED: {message}",
                          file=sys.stderr,
                          flush=True,
                      )

              pending_count = len(list(pending_dir.glob("*.json")))
              expected = len(due_schedule)
              coverage = (
                  100.0
                  if expected == 0
                  else round(captured / expected * 100, 2)
              )
              provider_supported_expected = max(0, expected - len(provider_gaps))
              provider_supported_coverage = (
                  100.0
                  if provider_supported_expected == 0
                  else round(captured / provider_supported_expected * 100, 2)
              )
              all_errors = search_errors + capture_errors + queue_errors
              collection_failed = nhl_collection_should_fail(
                  capture_errors,
                  search_errors,
              )
              if collection_failed or provider_gaps:
                  status = "degraded"
              elif pending_count:
                  status = "queued"
              else:
                  status = "healthy"

              report = {
                  "status": status,
                  "event_type": "nhl",
                  "coverage_mode": "official-schedule-backed",
                  "collection_scope": "United States and Canada",
                  "schedule_status": "available",
                  "schedule_sources": schedule_sources,
                  "timezone": "America/New_York",
                  "started_at": eastern_iso(started_at),
                  "capture_slot": eastern_iso(capture_slot),
                  "capture_window_hours": NHL_CAPTURE_WINDOW_HOURS,
                  "cadence_policy": {
                      "days_15_to_30_hours": NHL_DAILY_CADENCE_HOURS,
                      "days_8_to_14_hours": NHL_TWELVE_HOUR_CADENCE_HOURS,
                      "days_4_to_7_hours": NHL_SIX_HOUR_CADENCE_HOURS,
                      "final_72_hours": NHL_FINAL_CADENCE_HOURS,
                      "staggering": "deterministic per NHL game ID",
                  },
                  "scheduled_in_window": len(schedule),
                  "scheduled_due": expected,
                  "skipped_by_cadence": len(schedule) - expected,
                  "cadence_tiers": cadence_summary,
                  "feed_discovered": len(feed_rows),
                  "feed_warnings": feed_warnings,
                  "unresolved_count": len(unresolved),
                  "unresolved": unresolved,
                  "provider_gap_count": len(provider_gaps),
                  "provider_gaps": provider_gaps,
                  "provider_supported_expected": provider_supported_expected,
                  "provider_supported_coverage_percent": provider_supported_coverage,
                  "coverage_percent": coverage,
                  "captured": captured,
                  "uploaded": uploaded,
                  "queued": queued,
                  "replayed": replayed,
                  "pending": pending_count,
                  "failed": len(capture_errors),
                  "uploads": uploads,
                  "errors": all_errors,
              }
              _write_health(health_output, report)
              print(
                  "NHL schedule-backed collection finished: "
                  f"{captured}/{expected} due games captured "
                  f"({coverage:.2f}% overall; "
                  f"{provider_supported_coverage:.2f}% of Vivid-supported games); "
                  f"{len(schedule)} games remain inside the 30-day window, "
                  f"{len(provider_gaps)} provider gaps, {queued} queued, "
                  f"{replayed} replayed.",
                  flush=True,
              )

              return 1 if collection_failed else 0'''
          regex_once(
              "nhl_schedule_collector.py",
              r'''def run_schedule_collector\(.*?(?=\n\ndef run_schedule_smoke)''',
              run_cycle,
              "complete NHL collection cycle",
          )

          workflow_path = Path(".github/workflows/collect-ticket-prices.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          old_condition = 'if [[ "$EVENT_NAME" == "push" || "$DISPATCH_SOURCE" == "manual" || 10#$minute -lt 30 ]]; then'
          new_condition = '''if [[ "$EVENT_NAME" == "schedule" ]]; then
                      echo "run=false" >> "$GITHUB_OUTPUT"
                      echo "Skipping hourly league jobs; the scheduled fallback is reserved for baseball."
                    elif [[ "$EVENT_NAME" == "push" || "$DISPATCH_SOURCE" == "manual" || 10#$minute -lt 30 ]]; then'''
          count = workflow.count(old_condition)
          if count != 2:
              raise SystemExit(
                  f"Expected two hourly-league cadence conditions, found {count}"
              )
          workflow = workflow.replace(old_condition, new_condition)
          workflow = workflow.replace(
              "Collect due NHL games across the adaptive seven-day window",
              "Collect due NHL games across the adaptive 30-day window",
              1,
          )
          workflow_path.write_text(workflow, encoding="utf-8")

          Path("tests/test_nhl_resilience.py").write_text(
              '''from datetime import datetime, timezone
          from pathlib import Path
          import unittest
          from unittest.mock import patch

          from nhl_collector import (
              DiscoveredNHLGame,
              NHLInventoryIncompleteError,
              NHLSnapshotParser,
          )
          from nhl_schedule_collector import (
              NHLProviderGapError,
              ScheduleResolution,
              ScheduledNHLGame,
              _capture_resolution,
              candidates_for_schedule_game,
              nhl_collection_should_fail,
              validate_captured_match,
          )


          class NHLResilienceTests(unittest.TestCase):
              def _scheduled_game(self):
                  return ScheduledNHLGame(
                      schedule_id="2026010001",
                      event_date=datetime(2026, 9, 12, 23, tzinfo=timezone.utc),
                      away_team="Toronto Maple Leafs",
                      home_team="Ottawa Senators",
                      venue="Canadian Tire Centre",
                      name="Toronto Maple Leafs at Ottawa Senators",
                      venue_timezone="America/Toronto",
                      country="Canada",
                      game_type=1,
                      season=20262027,
                  )

              def _thin_payload(self):
                  return {
                      "global": [
                          {
                              "productionName": "Toronto Maple Leafs at Ottawa Senators",
                              "mapTitle": "Centre Slush Puppie",
                              "productionId": "7227372",
                              "currencyCode": "USD",
                          }
                      ],
                      "tickets": [
                          {
                              "l": "General Admission",
                              "p": "45",
                              "r": "GA",
                              "q": "2",
                              "tags": [],
                          }
                      ],
                  }

              def test_thin_inventory_has_a_specific_provider_gap_exception(self):
                  with self.assertRaises(NHLInventoryIncompleteError):
                      NHLSnapshotParser.parse(self._thin_payload())

              def test_explicitly_wrong_dates_are_never_used_as_fallbacks(self):
                  game = self._scheduled_game()
                  wrong_date = DiscoveredNHLGame(
                      url="https://www.vividseats.com/wrong/production/1",
                      title=game.name,
                      date_hint=datetime(2026, 10, 28).date(),
                  )
                  undated = DiscoveredNHLGame(
                      url="https://www.vividseats.com/undated/production/2",
                      title=game.name,
                      date_hint=None,
                  )
                  self.assertEqual(candidates_for_schedule_game(game, [wrong_date]), ())
                  self.assertEqual(
                      candidates_for_schedule_game(game, [wrong_date, undated]),
                      (undated,),
                  )

              def test_date_only_provider_metadata_uses_official_puck_drop(self):
                  game = self._scheduled_game()
                  provider_midnight = datetime(2026, 9, 12, 4, tzinfo=timezone.utc)
                  self.assertEqual(
                      validate_captured_match(game, provider_midnight, game.name),
                      game.event_date,
                  )
                  with self.assertRaisesRegex(ValueError, "does not match"):
                      validate_captured_match(
                          game,
                          datetime(2026, 10, 28, 23, tzinfo=timezone.utc),
                          game.name,
                      )

              def test_capture_classifies_thin_inventory_as_provider_gap(self):
                  game = self._scheduled_game()
                  candidate = DiscoveredNHLGame(
                      url="https://www.vividseats.com/game/production/7227372",
                      title=game.name,
                      date_hint=game.local_date,
                  )
                  resolution = ScheduleResolution(game, (candidate,), "test")
                  payload = self._thin_payload()

                  class FakeBrowser:
                      def __init__(self, **kwargs):
                          pass

                      def capture(self, url):
                          return (
                              payload,
                              datetime(2026, 9, 12, 4, tzinfo=timezone.utc),
                          )

                      def close(self):
                          pass

                  with patch("nhl_schedule_collector.VividNFLBrowser", FakeBrowser):
                      with self.assertRaises(NHLProviderGapError):
                          _capture_resolution(
                              resolution,
                              headless=True,
                              timeout=1,
                          )

              def test_provider_gaps_do_not_define_an_operational_failure(self):
                  self.assertFalse(nhl_collection_should_fail([], []))
                  self.assertTrue(
                      nhl_collection_should_fail(["browser crashed"], [])
                  )
                  self.assertTrue(
                      nhl_collection_should_fail([], ["search failed"])
                  )

              def test_scheduled_fallback_never_runs_hourly_league_jobs(self):
                  workflow = Path(
                      ".github/workflows/collect-ticket-prices.yml"
                  ).read_text(encoding="utf-8")
                  self.assertEqual(
                      workflow.count('if [[ "$EVENT_NAME" == "schedule" ]]; then'),
                      2,
                  )
                  self.assertIn(
                      "Collect due NHL games across the adaptive 30-day window",
                      workflow,
                  )


          if __name__ == "__main__":
              unittest.main()
          ''',
              encoding="utf-8",
          )

          for name in (
              "implement-nhl-collector-resilience.yml",
              "implement-nhl-collector-resilience-v2.yml",
              "implement-nhl-collector-resilience-v3.yml",
          ):
              Path(".github/workflows", name).unlink()
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate the full repository
        env:
          DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/baseball.db
          CONCERT_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/concerts.db
          NFL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nfl.db
          NHL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nhl.db
          FLASK_SECRET_KEY: deployment-validation-key
          COLLECTOR_INGEST_TOKEN: deployment-validation-token
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          python -m py_compile nhl_collector.py nhl_schedule_collector.py tests/test_nhl_resilience.py
          python -m unittest discover -s tests -v

      - name: Commit the resilience fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make NHL collection tolerant of provider-limited events"
          git push origin HEAD:fix/nhl-collector-resilience
