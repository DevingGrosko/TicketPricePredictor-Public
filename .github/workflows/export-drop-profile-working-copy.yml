name: Export drop-profile working copy

on:
  push:
    branches:
      - feature/drop-profile-details
    paths:
      - ".github/workflows/export-drop-profile-working-copy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/drop-profile-details

      - name: Remove Git metadata
        run: rm -rf .git

      - uses: actions/upload-artifact@v4
        with:
          name: drop-profile-working-copy
          path: .
          include-hidden-files: true
          retention-days: 1
