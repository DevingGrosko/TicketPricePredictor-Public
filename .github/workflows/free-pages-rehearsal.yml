name: Free Pages publisher rehearsal
on:
  push:
    branches: [feature/free-half-hour-publication]
    paths: [.github/workflows/free-pages-rehearsal.yml]
permissions:
  contents: read
concurrency:
  group: free-pages-readonly-rehearsal
  cancel-in-progress: true
jobs:
  offline:
    if: github.repository == 'DevingGrosko/TicketPricePredictor-Public' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Read Pages readiness only; no settings are changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          request=urllib.request.Request('https://api.github.com/repos/DevingGrosko/TicketPricePredictor-Public/pages',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request,timeout=20) as response:
                  value=json.load(response)
              print('PAGES_READINESS '+json.dumps({'enabled':True,'build_type':value.get('build_type'),'html_url':value.get('html_url')}))
          except urllib.error.HTTPError as error:
              if error.code not in (403,404): raise
              print('PAGES_READINESS '+json.dumps({'enabled':None,'http_status':error.code,'note':'Pages not enabled or not readable with this token; owner setup may be required.'}))
          PY
      - run: python -m pip install --disable-pip-version-check -r requirements-staging.txt
      - run: python -m unittest discover -s tests -p 'test_free_refresh*.py' -v
      - name: Build original synthetic pages at the Pages project path
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          from tools.build_original_fast import cached_original_analysis
          from tools.free_refresh_publish import mount_pages
          spec=importlib.util.spec_from_file_location('fixture_module','tests/test_original_static.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          with cached_original_analysis():module.fixture(Path('free-synthetic'))
          print(mount_pages('free-synthetic'))
          PY
          python -u -m tools.check_free_pages free-synthetic --output synthetic-pages-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: free-pages-synthetic-failure
          path: synthetic-pages-results/
          retention-days: 1
  snapshot:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: tidb-staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r requirements-staging.txt
      - name: Build from staging including the accepted new real capture; read-only
        env:
          TICKETSIGNAL_STAGING_SITE: '1'
          TIDB_STAGING_HOST: ${{ secrets.TIDB_STAGING_HOST }}
          TIDB_STAGING_USERNAME: ${{ secrets.TIDB_STAGING_USERNAME }}
          TIDB_STAGING_PASSWORD: ${{ secrets.TIDB_STAGING_PASSWORD }}
        run: |
          python -u -m tools.free_refresh_publish --output free-pages-dist --cache .free-refresh-cache
          python -u - <<'PY'
          import json, sqlite3
          from pathlib import Path
          from models import event_datetime_utc
          from Flask_App import staging_site_config as settings
          from tools.free_refresh_cache import SnapshotCache
          reader=SnapshotCache('.free-refresh-cache')
          for sport in ('mlb','nfl','nhl'):
              with sqlite3.connect(':memory:') as spool:
                  reader.read_sport(sport,spool,settings,event_datetime_utc,include_maps=True)
          assert all(value['ticket_rows_read_from_tidb']==0 for value in reader.metrics.values())
          print('SECOND_READ_NO_RAW_SCAN '+json.dumps(reader.metrics))
          root=Path('free-pages-dist')
          def read(p):return json.loads((root/p.lstrip('/')).read_bytes())
          manifest=read('original-manifest.json');cat=read(manifest['sports']['mlb'])
          sample=cat['games']['30313'];record=read(sample['file'])
          assert sample['captured_through']=='2026-09-26T23:30:00+00:00'
          assert len(record['sections'])==109
          assert all(section['points']==1 for section in record['sections'])
          print('FRESH_CAPTURE_PUBLISHED '+json.dumps({'event_id':'30313','sections':len(record['sections']),'captured_through':sample['captured_through']}))
          settings.clear_engines()
          PY
      - name: Exercise all sports on the complete mounted static build without credentials
        run: python -u -m tools.check_free_pages free-pages-dist --output free-pages-results
      - name: Save small report only, not raw database caches or repeated full site artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: free-pages-rehearsal-result
          path: |
            free-pages-results/report.json
            free-pages-results/console.json
            free-pages-results/failure.html
          retention-days: 1
          if-no-files-found: warn
