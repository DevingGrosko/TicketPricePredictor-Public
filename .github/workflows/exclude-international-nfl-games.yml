name: Exclude international NFL games

on:
  push:
    branches:
      - fix/exclude-international-nfl-games
    paths:
      - ".github/workflows/exclude-international-nfl-games.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/exclude-international-nfl-games
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Remove international games from NFL collection and storage
        run: |
          python - <<'PY'
          from pathlib import Path

          collector = Path("nfl_schedule_collector.py")
          source = collector.read_text(encoding="utf-8")

          old_doc = '''"""Schedule-backed NFL ticket collection with explicit coverage accounting.

          The existing Vivid league feed is useful, but a lazy-loaded marketplace page is
          not a reliable statement of the complete NFL slate. This collector first loads
          a structured NFL schedule for the requested time window, then resolves every
          scheduled matchup to a Vivid event. Feed matches are used first; missing games
          are recovered through Vivid search. Every due game is either captured or listed
          as unresolved in the health report.
          """'''.replace("\n          ", "\n")
          new_doc = '''"""Schedule-backed U.S. NFL ticket collection with coverage accounting.

          The collector loads the structured NFL schedule, removes games played outside
          the United States, and then resolves each due domestic matchup to a Vivid event.
          Feed matches are used first and missing domestic games are recovered through
          Vivid search. Every in-scope game is either captured or reported as unresolved.
          """'''.replace("\n          ", "\n")
          if source.count(old_doc) != 1:
              raise SystemExit(f"Expected collector docstring once, found {source.count(old_doc)}")
          source = source.replace(old_doc, new_doc, 1)

          helper_start = source.find("_US_COUNTRY_MARKERS = frozenset(")
          helper_end = source.find("\n\ndef _parse_datetime", helper_start)
          if helper_start < 0 or helper_end < 0:
              raise SystemExit("Could not locate the NFL country/provider-gap helpers")
          helper_block = '''_US_COUNTRY_MARKERS = frozenset(
              {
                  "us",
                  "usa",
                  "united states",
                  "united states of america",
              }
          )


          def is_us_venue_country(value: Any) -> bool:
              """Keep unknown legacy locations, but exclude every explicit non-U.S. venue."""
              country = " ".join(str(value or "").split()).casefold().replace(".", "")
              return not country or country in _US_COUNTRY_MARKERS
          '''.replace("\n          ", "\n").strip()
          source = source[:helper_start] + helper_block + source[helper_end:]

          country_marker = '''                country = " ".join(
                      str(address.get("country") or address.get("countryCode") or "").split()
                  )
              neutral_site = bool(competition.get("neutralSite") is True)
          '''.replace("\n          ", "\n")
          country_replacement = '''                country = " ".join(
                      str(address.get("country") or address.get("countryCode") or "").split()
                  )
              if not is_us_venue_country(country):
                  continue

              neutral_site = bool(competition.get("neutralSite") is True)
          '''.replace("\n          ", "\n")
          if source.count(country_marker) != 1:
              raise SystemExit(f"Expected one country parsing marker, found {source.count(country_marker)}")
          source = source.replace(country_marker, country_replacement, 1)

          result_start_marker = '    pending_count = len(list(pending_dir.glob("*.json")))\n'
          result_end_marker = '\n\n\ndef run_schedule_smoke('
          result_start = source.find(result_start_marker)
          result_end = source.find(result_end_marker, result_start)
          if result_start < 0 or result_end < 0:
              raise SystemExit("Could not locate the NFL collection result block")
          result_block = '''    pending_count = len(list(pending_dir.glob("*.json")))
              expected = len(due_schedule)
              coverage = 100.0 if expected == 0 else round(captured / expected * 100, 2)
              all_errors = feed_errors + search_errors + capture_errors + queue_errors
              if unresolved or capture_errors or feed_errors or search_errors:
                  status = "degraded"
              elif pending_count:
                  status = "queued"
              else:
                  status = "healthy"

              report = {
                  "status": status,
                  "event_type": "nfl",
                  "coverage_mode": "schedule-backed",
                  "collection_scope": "us-venues-only",
                  "schedule_status": "available",
                  "schedule_source": schedule_source,
                  "timezone": "America/New_York",
                  "started_at": eastern_iso(started_at),
                  "capture_slot": eastern_iso(capture_slot),
                  "capture_window_hours": NFL_CAPTURE_WINDOW_HOURS,
                  "cadence_policy": {
                      "days_15_to_30_hours": 6,
                      "days_8_to_14_hours": 3,
                      "final_7_days_hours": 1,
                      "staggering": "deterministic per schedule ID",
                  },
                  "scheduled_in_window": len(schedule),
                  "scheduled_due": expected,
                  "skipped_by_cadence": len(schedule) - expected,
                  "cadence_tiers": cadence_summary,
                  "feed_discovered": len(feed_rows),
                  "matched_from_feed": matched_from_feed,
                  "recovered_from_search": recovered_from_search,
                  "unresolved_count": len(unresolved),
                  "unresolved": unresolved,
                  "coverage_percent": coverage,
                  "captured": captured,
                  "uploaded": uploaded,
                  "queued": queued,
                  "replayed": replayed,
                  "pending": pending_count,
                  "failed": len(capture_errors),
                  "uploads": uploads,
                  "errors": all_errors,
              }
              _write_health(health_output, report)
              print(
                  "NFL U.S.-venue collection finished: "
                  f"{captured}/{expected} due games captured ({coverage:.2f}% coverage); "
                  f"{len(schedule)} domestic games remain inside the 30-day window, "
                  f"{recovered_from_search} recovered through search, "
                  f"{len(unresolved)} unresolved, {queued} queued, {replayed} replayed.",
                  flush=True,
              )

              if expected > 0 and captured < expected:
                  return 1
              if feed_errors or search_errors:
                  return 1
              return 0
          '''.replace("\n              ", "\n").lstrip()
          source = source[:result_start] + result_block + source[result_end:]
          collector.write_text(source, encoding="utf-8")

          blueprint = Path("Flask_App/nfl_blueprint.py")
          web = blueprint.read_text(encoding="utf-8")

          clean_marker = '''def _clean_metadata_text(value: Any, maximum: int = 250) -> str:
              return " ".join(str(value or "").split())[:maximum]


          def normalize_nfl_schedule_metadata(
          '''.replace("\n          ", "\n")
          clean_replacement = '''def _clean_metadata_text(value: Any, maximum: int = 250) -> str:
              return " ".join(str(value or "").split())[:maximum]


          _US_COUNTRY_MARKERS = frozenset(
              {"us", "usa", "united states", "united states of america"}
          )


          def _country_is_explicitly_non_us(value: Any) -> bool:
              country = _clean_metadata_text(value).casefold().replace(".", "")
              return bool(country) and country not in _US_COUNTRY_MARKERS


          def normalize_nfl_schedule_metadata(
          '''.replace("\n          ", "\n")
          if web.count(clean_marker) != 1:
              raise SystemExit(f"Expected one metadata helper marker, found {web.count(clean_marker)}")
          web = web.replace(clean_marker, clean_replacement, 1)

          metadata_marker = '''    schedule_id = _clean_metadata_text(raw.get("schedule_id"), maximum=160)
              canonical_venue = canonical_venue_name(
                  raw.get("canonical_venue") or provider_venue
              )
              return {
                  "schedule_id": schedule_id or None,
                  "away_team": away_team,
                  "home_team": home_team,
                  "canonical_venue": canonical_venue,
                  "city": _clean_metadata_text(raw.get("city")),
                  "country": _clean_metadata_text(raw.get("country")),
          '''.replace("\n          ", "\n")
          metadata_replacement = '''    schedule_id = _clean_metadata_text(raw.get("schedule_id"), maximum=160)
              canonical_venue = canonical_venue_name(
                  raw.get("canonical_venue") or provider_venue
              )
              city = _clean_metadata_text(raw.get("city"))
              country = _clean_metadata_text(raw.get("country"))
              if _country_is_explicitly_non_us(country):
                  raise ValueError(
                      "International NFL games are outside the U.S.-venue collection scope."
                  )
              return {
                  "schedule_id": schedule_id or None,
                  "away_team": away_team,
                  "home_team": home_team,
                  "canonical_venue": canonical_venue,
                  "city": city,
                  "country": country,
          '''.replace("\n          ", "\n")
          if web.count(metadata_marker) != 1:
              raise SystemExit(f"Expected one metadata return marker, found {web.count(metadata_marker)}")
          web = web.replace(metadata_marker, metadata_replacement, 1)

          schema_marker = '''            rows = connection.execute(
          '''
          cleanup_block = '''            international_predicate = (
                  "country IS NOT NULL AND TRIM(country) <> '' AND "
                  "LOWER(REPLACE(TRIM(country), '.', '')) NOT IN "
                  "('us', 'usa', 'united states', 'united states of america')"
              )
              connection.exec_driver_sql(
                  "DELETE FROM nfl_tickets WHERE iteration_id IN ("
                  "SELECT id FROM nfl_iterations WHERE event_id IN ("
                  f"SELECT id FROM nfl_event WHERE {international_predicate}))"
              )
              connection.exec_driver_sql(
                  "DELETE FROM nfl_iterations WHERE event_id IN ("
                  f"SELECT id FROM nfl_event WHERE {international_predicate})"
              )
              connection.exec_driver_sql(
                  f"DELETE FROM nfl_event WHERE {international_predicate}"
              )

              rows = connection.execute(
          '''.replace("\n              ", "\n")
          if web.count(schema_marker) != 1:
              raise SystemExit(f"Expected one schema row marker, found {web.count(schema_marker)}")
          web = web.replace(schema_marker, cleanup_block, 1)

          query_marker = '''            all_games = (
                  session.query(NFLEvent)
                  .order_by(NFLEvent.event_date)
                  .all()
              )
          '''.replace("\n          ", "\n")
          query_replacement = '''            all_games = [
                  game
                  for game in (
                      session.query(NFLEvent)
                      .order_by(NFLEvent.event_date)
                      .all()
                  )
                  if not _country_is_explicitly_non_us(game.country)
              ]
          '''.replace("\n          ", "\n")
          if web.count(query_marker) != 1:
              raise SystemExit(f"Expected one NFL home query marker, found {web.count(query_marker)}")
          web = web.replace(query_marker, query_replacement, 1)
          blueprint.write_text(web, encoding="utf-8")

          schedule_tests = Path("tests/test_nfl_schedule_collector.py")
          tests = schedule_tests.read_text(encoding="utf-8")
          import_marker = '''    EVENT_TIME_TOLERANCE_HOURS,
              _schedule_collection_exit_code,
              is_expected_vivid_provider_gap,
              ScheduledNFLGame,
          '''.replace("\n          ", "\n")
          import_replacement = '''    EVENT_TIME_TOLERANCE_HOURS,
              ScheduledNFLGame,
              is_us_venue_country,
          '''.replace("\n          ", "\n")
          if tests.count(import_marker) != 1:
              raise SystemExit(f"Expected one schedule import marker, found {tests.count(import_marker)}")
          tests = tests.replace(import_marker, import_replacement, 1)

          signature_marker = '''        *,
                  completed: bool = False,
              ):
          '''.replace("\n          ", "\n")
          signature_replacement = '''        *,
                  completed: bool = False,
                  country: str = "USA",
              ):
          '''.replace("\n          ", "\n")
          if tests.count(signature_marker) != 1:
              raise SystemExit(f"Expected one event helper signature, found {tests.count(signature_marker)}")
          tests = tests.replace(signature_marker, signature_replacement, 1)

          venue_marker = '''                    "venue": {"fullName": "Test Stadium"},
          '''
          venue_replacement = '''                    "venue": {
                          "fullName": "Test Stadium",
                          "address": {"country": country},
                      },
          '''.replace("\n          ", "\n")
          if tests.count(venue_marker) != 1:
              raise SystemExit(f"Expected one test venue marker, found {tests.count(venue_marker)}")
          tests = tests.replace(venue_marker, venue_replacement, 1)

          event_insert_marker = '''                self._event(
                      "7",
                      now + timedelta(hours=721),
                      "Miami Dolphins",
                      "New York Jets",
                  ),
          '''.replace("\n          ", "\n")
          event_insert_replacement = event_insert_marker + '''                self._event(
                  "8",
                  now + timedelta(hours=100),
                  "San Francisco 49ers",
                  "Los Angeles Rams",
                  country="Australia",
              ),
          '''.replace("\n          ", "\n")
          if tests.count(event_insert_marker) != 1:
              raise SystemExit(f"Expected one out-of-window event marker, found {tests.count(event_insert_marker)}")
          tests = tests.replace(event_insert_marker, event_insert_replacement, 1)

          old_scope_start = tests.find("    def test_non_us_games_are_expected_vivid_provider_gaps")
          old_scope_end = tests.find("\n\nclass NFLVividResolutionTests", old_scope_start)
          if old_scope_start < 0 or old_scope_end < 0:
              raise SystemExit("Could not locate the provider-gap tests")
          new_scope_tests = '''    def test_explicit_non_us_venues_are_out_of_scope(self):
              self.assertTrue(is_us_venue_country("USA"))
              self.assertTrue(is_us_venue_country("United States"))
              self.assertTrue(is_us_venue_country(""))
              self.assertFalse(is_us_venue_country("Australia"))
              self.assertFalse(is_us_venue_country("Brazil"))
          '''.replace("\n          ", "\n").rstrip()
          tests = tests[:old_scope_start] + new_scope_tests + tests[old_scope_end:]
          schedule_tests.write_text(tests, encoding="utf-8")

          metadata_tests = Path("tests/test_nfl_metadata_enhancements.py")
          metadata = metadata_tests.read_text(encoding="utf-8")
          imports_marker = '''    CreateNFLModel,
              NFLEvent,
              format_nfl_capture_label,
          '''.replace("\n          ", "\n")
          imports_replacement = '''    CreateNFLModel,
              NFLEvent,
              NFLIteration,
              NFLTicket,
              _SCHEMA_READY,
              format_nfl_capture_label,
          '''.replace("\n          ", "\n")
          if metadata.count(imports_marker) != 1:
              raise SystemExit(f"Expected one metadata test import marker, found {metadata.count(imports_marker)}")
          metadata = metadata.replace(imports_marker, imports_replacement, 1)

          normalize_import_marker = '''    nfl_map,
              store_nfl_snapshot,
          '''.replace("\n          ", "\n")
          normalize_import_replacement = '''    nfl_map,
              normalize_nfl_schedule_metadata,
              store_nfl_snapshot,
          '''.replace("\n          ", "\n")
          if metadata.count(normalize_import_marker) != 1:
              raise SystemExit(f"Expected one normalize import marker, found {metadata.count(normalize_import_marker)}")
          metadata = metadata.replace(normalize_import_marker, normalize_import_replacement, 1)

          test_insert_marker = '''    def test_existing_database_is_migrated_and_backfilled(self):
          '''
          tests_to_add = '''    def test_international_schedule_metadata_is_rejected(self):
              with self.assertRaisesRegex(ValueError, "outside the U.S.-venue"):
                  normalize_nfl_schedule_metadata(
                      {
                          "away_team": "San Francisco 49ers",
                          "home_team": "Los Angeles Rams",
                          "canonical_venue": "Melbourne Cricket Ground",
                          "city": "Melbourne",
                          "country": "Australia",
                          "neutral_site": True,
                      },
                      title="San Francisco 49ers at Los Angeles Rams",
                      provider_venue="Melbourne Cricket Ground",
                  )

              def test_existing_international_rows_are_removed(self):
                  with tempfile.TemporaryDirectory() as directory:
                      db_path = Path(directory) / "nfl.db"
                      model = CreateNFLModel(db_path)
                      try:
                          with model.getSession()() as session:
                              domestic = NFLEvent(
                                  source_id="domestic",
                                  title="Dallas Cowboys at New York Giants",
                                  event_date=datetime(2026, 9, 10, 20),
                                  sections=["Section 1"],
                                  source_url="https://www.vividseats.com/game/production/9100001",
                                  venue="MetLife Stadium",
                                  country="USA",
                              )
                              international = NFLEvent(
                                  source_id="international",
                                  title="San Francisco 49ers at Los Angeles Rams",
                                  event_date=datetime(2026, 9, 10, 20),
                                  sections=["Section 1"],
                                  source_url="https://www.vividseats.com/game/production/9100002",
                                  venue="Melbourne Cricket Ground",
                                  country="Australia",
                              )
                              iteration = NFLIteration(
                                  event=international,
                                  captured_at=datetime(2026, 9, 1, 12),
                              )
                              iteration.tickets.append(
                                  NFLTicket(
                                      section="Section 1",
                                      price=100,
                                      listing_count=1,
                                  )
                              )
                              session.add_all([domestic, international, iteration])
                              session.commit()
                      finally:
                          model.engine.dispose()

                      _SCHEMA_READY.discard(str(db_path.resolve()))
                      model = CreateNFLModel(db_path)
                      try:
                          with model.getSession()() as session:
                              self.assertEqual(
                                  [event.source_id for event in session.query(NFLEvent).all()],
                                  ["domestic"],
                              )
                              self.assertEqual(session.query(NFLIteration).count(), 0)
                              self.assertEqual(session.query(NFLTicket).count(), 0)
                      finally:
                          model.engine.dispose()

          '''.replace("\n              ", "\n")
          if metadata.count(test_insert_marker) != 1:
              raise SystemExit(f"Expected one migration test marker, found {metadata.count(test_insert_marker)}")
          metadata = metadata.replace(test_insert_marker, tests_to_add + test_insert_marker, 1)
          metadata_tests.write_text(metadata, encoding="utf-8")
          PY

      - name: Compile modified Python
        run: |
          python -m py_compile \
            nfl_schedule_collector.py \
            Flask_App/nfl_blueprint.py \
            tests/test_nfl_schedule_collector.py \
            tests/test_nfl_metadata_enhancements.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run complete test suite
        run: python -m unittest discover -s tests -v

      - name: Commit the U.S.-only scope
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            nfl_schedule_collector.py \
            Flask_App/nfl_blueprint.py \
            tests/test_nfl_schedule_collector.py \
            tests/test_nfl_metadata_enhancements.py
          git commit -m "Exclude international games from NFL tracking"
          git push origin HEAD:fix/exclude-international-nfl-games
