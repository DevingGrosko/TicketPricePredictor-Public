name: Apply MLB team report materialization

on:
  push:
    branches:
      - perf/mlb-materialized-team-reports
    paths:
      - ".github/mlb-team-report-materialization.patch"
      - ".github/workflows/apply-mlb-team-report-materialization.yml"

permissions:
  contents: write

concurrency:
  group: apply-mlb-team-report-materialization
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/mlb-materialized-team-reports
          fetch-depth: 0

      - name: Apply integration edits
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("Flask_App/flask_app.py")
          text = path.read_text()

          old_import = '''from Flask_App.materialized_analytics import (
              refresh_event_summary_safely,
              timeline_bucket_slot,
          )
          '''
          new_import = old_import + '''from Flask_App.team_report_materialized import (
              refresh_mlb_team_report,
              render_materialized_mlb_team_report,
          )
          '''
          if text.count(old_import) != 1:
              raise RuntimeError("materialized analytics import block changed")
          text = text.replace(old_import, new_import, 1)

          old_register = '''app.register_blueprint(nfl_blueprint)
          app.register_blueprint(nfl_stadium_blueprint)
          app.register_blueprint(nhl_blueprint)
          '''
          new_register = old_register + '''
          # Keep the existing endpoint and URL, but serve the MLB team report
          # from the persistent team-summary payload.
          app.view_functions["nfl_stadium.mlb_stadium"] = render_materialized_mlb_team_report
          '''
          if text.count(old_register) != 1:
              raise RuntimeError("blueprint registration block changed")
          text = text.replace(old_register, new_register, 1)

          old_result = '        return "updated" if result is not None else "deferred"\n'
          new_result = '''        if result is None:
              return "deferred"
          try:
              refreshed = refresh_mlb_team_report(venue)
          except Exception:
              app.logger.exception(
                  "Deferred MLB team report refresh for venue %s", venue
              )
              return "team-deferred"
          return "updated" if refreshed else "team-deferred"
          '''
          if text.count(old_result) != 1:
              raise RuntimeError("MLB refresh return line changed")
          path.write_text(text.replace(old_result, new_result, 1))
          PY
          rm .github/mlb-team-report-materialization.patch
          rm .github/workflows/apply-mlb-team-report-materialization.yml
          git diff --check

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Route MLB team pages through persistent summaries"
          git push origin HEAD:perf/mlb-materialized-team-reports
