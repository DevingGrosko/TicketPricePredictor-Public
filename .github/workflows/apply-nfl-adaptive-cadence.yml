name: Apply NFL 30-day adaptive cadence

on:
  push:
    branches:
      - feature/nfl-30-day-adaptive-cadence
    paths:
      - "nfl_adaptive_patch.ready"

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/nfl-30-day-adaptive-cadence
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply source changes
        run: |
          python tools/apply_nfl_adaptive_cadence.py
          python tools/fix_nfl_adaptive_patch.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate adaptive cadence implementation
        run: |
          python -m py_compile \
            nfl_collector.py \
            nfl_schedule_collector.py \
            Flask_App/nfl_blueprint.py
          python -m unittest discover -s tests -v

      - name: Commit tested non-workflow implementation
        run: |
          # GitHub Actions' installation token cannot modify workflow files.
          # Keep those two files unchanged here; they are updated through the
          # repository connector after the tested code commit lands.
          git checkout -- \
            .github/workflows/collect-ticket-prices.yml \
            .github/workflows/nfl-smoke-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            nfl_collector.py \
            nfl_schedule_collector.py \
            Flask_App/nfl_blueprint.py \
            Flask_App/templates/NFLHomeScreen.html \
            Flask_App/templates/nfl_graph.html \
            tests/test_nfl_blueprint.py \
            tests/test_nfl_collector.py \
            tests/test_nfl_schedule_collector.py
          git commit -m "Extend NFL tracking to 30 days with adaptive cadence"
          git push origin HEAD:feature/nfl-30-day-adaptive-cadence
