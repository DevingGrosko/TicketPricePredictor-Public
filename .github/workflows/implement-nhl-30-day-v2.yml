                          )
                      )

              due = schedule_games_due(games, slot)
              self.assertIn("hourly-0", {game.schedule_id for game in due})
              self.assertLess(len(due), len(games))
              summary = schedule_cadence_summary(games, slot)
              self.assertEqual(
                  summary["in_window"],
                  {"1h": 1, "6h": 12, "12h": 12, "24h": 24},
              )
              self.assertEqual(sum(summary["due_now"].values()), len(due))
          '''
          regex_once(
              "tests/test_nhl_schedule_collector.py",
              r'''    def test_due_filter_and_summary_apply_agreed_cadence\(self\):.*?(?=\n    def test_vivid_candidates_require_away_home_order_and_prefer_local_date)''',
              due_test,
              "schedule cadence test",
          )

          replace_once(
              "tests/test_nhl_blueprint.py",
              '''    NHLIteration,
              NHLTicket,
              _SCHEMA_READY,''',
              '''    NHLIteration,
              NHLTicket,
              NHL_CAPTURE_WINDOW_HOURS,
              _SCHEMA_READY,''',
              "blueprint test imports",
          )
          compaction_test = '''    def test_compaction_keeps_final_day_hourly_and_representative_earlier_points(self):
              with tempfile.TemporaryDirectory() as directory:
                  db_path = Path(directory) / "NHL-collection.db"
                  _SCHEMA_READY.discard(str(db_path.resolve()))
                  model = CreateNHLModel(db_path)
                  event_time = datetime(2026, 10, 20, 19, tzinfo=EASTERN)
                  try:
                      with model.getSession()() as session:
                          event = NHLEvent(
                              source_id="compaction-game",
                              title="Boston Bruins at Toronto Maple Leafs",
                              event_date=event_datetime_for_storage(event_time),
                              sections=["Section 100"],
                              source_url="https://www.vividseats.com/game/production/9300003",
                              venue="Scotiabank Arena",
                              away_team="Boston Bruins",
                              home_team="Toronto Maple Leafs",
                              canonical_venue="Scotiabank Arena",
                              venue_timezone="America/Toronto",
                              country="Canada",
                              game_type=2,
                              season=20262027,
                              currency="USD",
                          )
                          session.add(event)
                          session.flush()
                          lead_hours = (
                              list(range(1, 73))
                              + list(range(78, 169, 6))
                              + list(range(180, 337, 12))
                              + list(range(360, 721, 24))
                          )
                          for lead in lead_hours:
                              captured = event_time.astimezone(timezone.utc) - timedelta(hours=lead)
                              iteration = NHLIteration(
                                  event=event,
                                  captured_at=captured_datetime_for_storage(captured),
                              )
                              iteration.tickets.append(
                                  NHLTicket(
                                      section="Section 100",
                                      price=100 + lead,
                                      listing_count=1,
                                  )
                              )
                              session.add(iteration)
                          session.commit()
                          iterations = sorted(
                              event.iterations,
                              key=lambda item: item.captured_at,
                          )
                          self.assertEqual(len(iterations), 118)
                          self.assertEqual(
                              len(
                                  select_nhl_compaction_iteration_ids(
                                      event.event_date,
                                      iterations,
                                  )
                              ),
                              79,
                          )
                  finally:
                      model.engine.dispose()

                  report = compact_completed_nhl_games(
                      now=event_time.astimezone(timezone.utc) + timedelta(days=15),
                      db_path=db_path,
                  )
                  self.assertEqual(NHL_CAPTURE_WINDOW_HOURS, 720)
                  self.assertEqual(report["games_compacted"], 1)
                  self.assertEqual(report["iterations_before"], 118)
                  self.assertEqual(report["iterations_retained"], 79)
                  self.assertEqual(report["iterations_deleted"], 39)

                  _SCHEMA_READY.discard(str(db_path.resolve()))
                  model = CreateNHLModel(db_path)
                  try:
                      with model.getSession()() as session:
                          event = session.query(NHLEvent).one()
                          self.assertIsNotNone(event.compacted_at)
                          self.assertEqual(event.original_iteration_count, 118)
                          self.assertEqual(event.retained_iteration_count, 79)
                          self.assertEqual(session.query(NHLIteration).count(), 79)
                          self.assertEqual(session.query(NHLTicket).count(), 79)
                  finally:
                      model.engine.dispose()
                      _SCHEMA_READY.discard(str(db_path.resolve()))
          '''
          regex_once(
              "tests/test_nhl_blueprint.py",
              r'''    def test_compaction_keeps_final_day_hourly_and_representative_earlier_points\(self\):.*?(?=\n\nif __name__)''',
              compaction_test,
              "blueprint compaction test",
          )

