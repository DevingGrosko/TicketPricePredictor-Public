name: Apply section canonicalization

on:
  push:
    branches:
      - feature/section-canonicalization
    paths:
      - ".github/workflows/apply-section-canonicalization.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/section-canonicalization
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply canonicalization payload
        run: |
          cat .github/section-canonicalization-payload/part* > /tmp/payload.b64
          base64 --decode /tmp/payload.b64 > /tmp/section-canonicalization.tar.gz
          echo "302580b7f9171200eabd062510e6d6a06b6859add0a557cdafa0e685e7695c77  /tmp/section-canonicalization.tar.gz" | sha256sum -c -
          tar -xzf /tmp/section-canonicalization.tar.gz -C .

          # Another legacy test installs a graph_builder stub in sys.modules.
          # Load the real file under a unique module name for this regression
          # test so unittest discovery order cannot replace GraphBuilder.
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_section_canonicalization.py")
          text = path.read_text()
          text = text.replace(
              "from datetime import datetime, timedelta, timezone\n",
              "from datetime import datetime, timedelta, timezone\nimport importlib.util\n",
              1,
          )
          text = text.replace("from graph_builder import GraphBuilder\n", "", 1)
          text = text.replace(
              """                x, y = GraphBuilder().eachEventGraphList(
                    "Infield Box 119",
                    event_id,
                )
""",
              """                module_path = Path(__file__).resolve().parents[1] / "graph_builder.py"
                spec = importlib.util.spec_from_file_location(
                    "graph_builder_canonicalization_test",
                    module_path,
                )
                self.assertIsNotNone(spec)
                self.assertIsNotNone(spec.loader)
                module = importlib.util.module_from_spec(spec)
                spec.loader.exec_module(module)
                x, y = module.GraphBuilder().eachEventGraphList(
                    "Infield Box 119",
                    event_id,
                )
""",
              1,
          )
          path.write_text(text)
          PY

          rm -rf .github/section-canonicalization-payload
          rm -f .github/workflows/apply-section-canonicalization.yml

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate canonicalization
        env:
          DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/baseball.db
          CONCERT_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/concerts.db
          NFL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nfl.db
          NHL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nhl.db
          FLASK_SECRET_KEY: deployment-validation-key
          COLLECTOR_INGEST_TOKEN: deployment-validation-token
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          python -m py_compile \
            models.py \
            graph_builder.py \
            Flask_App/flask_app.py \
            Flask_App/section_catalog.py \
            Flask_App/nfl_blueprint.py \
            Flask_App/nfl_stadium_blueprint.py \
            Flask_App/nhl_blueprint.py
          python -m unittest discover -s tests -v

      - name: Commit canonicalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Canonicalize section histories across aliases"
          git push origin HEAD:feature/section-canonicalization
