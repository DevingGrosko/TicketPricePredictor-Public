name: Apply MLB zero-drop hotfix v2

on:
  push:
    branches:
      - fix/mlb-zero-drop-formatting
    paths:
      - ".github/workflows/apply-mlb-zero-drop-fix-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/mlb-zero-drop-formatting
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply hotfix
        run: |
          python - <<'PY'
          from pathlib import Path

          blueprint = Path("Flask_App/nfl_stadium_blueprint.py")
          text = blueprint.read_text()

          old_imports = (
              "from datetime import datetime, timedelta, timezone\n"
              "import hmac\n"
              "import os\n"
              "from pathlib import Path\n"
              "import re\n"
              "import traceback\n"
          )
          if old_imports not in text:
              raise SystemExit("Temporary diagnostic imports not found")
          text = text.replace(
              old_imports,
              "from datetime import datetime, timedelta, timezone\nimport re\n",
              1,
          )

          old_flask = "from flask import Blueprint, jsonify, render_template, request, url_for\n"
          if old_flask not in text:
              raise SystemExit("Temporary jsonify import not found")
          text = text.replace(
              old_flask,
              "from flask import Blueprint, render_template, request, url_for\n",
              1,
          )

          old_round = "    rounded = round(value, 2)\n"
          new_round = (
              "    # round(int, 2) returns an int; normalize first so zero-dollar values\n"
              "    # can safely use float.is_integer() below.\n"
              "    rounded = round(float(value), 2)\n"
          )
          if old_round not in text:
              raise SystemExit("Currency rounding line not found")
          text = text.replace(old_round, new_round, 1)

          marker = '\n\n@nfl_stadium_blueprint.get("/api/diagnostics/mlb-stadium")\n'
          if marker not in text:
              raise SystemExit("Temporary diagnostic route not found")
          blueprint.write_text(text.split(marker, 1)[0].rstrip() + "\n")

          tests = Path("tests/test_navigation_and_parking_filter.py")
          test_text = tests.read_text()
          old_test_import = (
              "from Flask_App.nfl_stadium_blueprint import (\n"
              "    _public_sections,\n"
              "    is_parking_section,\n"
              ")\n"
          )
          new_test_import = (
              "from Flask_App.nfl_stadium_blueprint import (\n"
              "    _currency_money,\n"
              "    _currency_price_change,\n"
              "    _public_sections,\n"
              "    is_parking_section,\n"
              ")\n"
          )
          if old_test_import not in test_text:
              raise SystemExit("Test import block not found")
          test_text = test_text.replace(old_test_import, new_test_import, 1)

          insertion = "\n\nclass SimplifiedNavigationTests(unittest.TestCase):\n"
          regression = (
              "\n\nclass CurrencyFormattingTests(unittest.TestCase):\n"
              "    def test_zero_dollar_values_render_without_crashing(self):\n"
              "        self.assertEqual(_currency_money(0, \"USD\"), \"$0\")\n"
              "        self.assertEqual(_currency_money(0, \"CAD\"), \"CA$0\")\n"
              "        self.assertEqual(_currency_price_change(0, \"USD\"), \"$0\")\n"
              "        self.assertEqual(_currency_price_change(0.0, \"CAD\"), \"CA$0\")\n"
          )
          if insertion not in test_text:
              raise SystemExit("Test insertion point not found")
          tests.write_text(test_text.replace(insertion, regression + insertion, 1))

          deploy = Path(".github/workflows/deploy-pythonanywhere.yml")
          lines = deploy.read_text().splitlines()
          output = []
          inserted_probe = False
          inserted_diagnostics = False
          updated_echo = False
          updated_condition = False
          for line in lines:
              output.append(line)
              if 'home_status="$(curl ' in line and not inserted_probe:
                  output.append(
                      '            baseball_stadium_status="$(curl -sS --max-time 90 '
                      '-o /tmp/baseball-stadium.html -w \'%{http_code}\' '
                      '\"$base/baseball/stadium?venue=Truist%20Park\" || true)"'
                  )
                  inserted_probe = True
              if 'echo "Attempt $attempt:' in line:
                  output[-1] = line.replace(
                      'home=$home_status ',
                      'home=$home_status baseball_stadium=$baseball_stadium_status ',
                      1,
                  )
                  updated_echo = True
              if 'if [[ "$home_status" == "200"' in line:
                  output[-1] = line.replace(
                      '"$home_status" == "200" && ',
                      '"$home_status" == "200" && "$baseball_stadium_status" == "200" && ',
                      1,
                  )
                  updated_condition = True
              if line == '          echo "NFL response:"' and not inserted_diagnostics:
                  output[-1:-1] = [
                      '          echo "Baseball stadium response:"',
                      '          cat /tmp/baseball-stadium.html || true',
                  ]
                  inserted_diagnostics = True

          if not all((inserted_probe, inserted_diagnostics, updated_echo, updated_condition)):
              raise SystemExit(
                  f"Deploy patch incomplete: {inserted_probe=} {inserted_diagnostics=} "
                  f"{updated_echo=} {updated_condition=}"
              )
          deploy.write_text("\n".join(output) + "\n")
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate hotfix
        env:
          DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/baseball.db
          CONCERT_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/concerts.db
          NFL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nfl.db
          NHL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nhl.db
          FLASK_SECRET_KEY: deployment-validation-key
          COLLECTOR_INGEST_TOKEN: deployment-validation-token
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          python -m py_compile Flask_App/nfl_stadium_blueprint.py tests/test_navigation_and_parking_filter.py
          node --check Flask_App/static/js/nfl-stadium.js
          node --check Flask_App/static/js/venue-section.js
          python -m unittest discover -s tests -v

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Flask_App/nfl_stadium_blueprint.py tests/test_navigation_and_parking_filter.py .github/workflows/deploy-pythonanywhere.yml
          git diff --cached --check
          git commit -m "Fix zero-dollar MLB section formatting"
          git push origin HEAD:fix/mlb-zero-drop-formatting
