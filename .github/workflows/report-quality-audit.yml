name: Report quality audit
on:
  push:
    branches: [fix/team-reports-clickable-rankings-preseason]
    paths: [.github/workflows/report-quality-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Export source and test wheels
        run: |
          mkdir -p audit-output/wheels
          git archive --format=zip HEAD -o audit-output/source.zip
          python -m pip download Flask==3.1.2 selenium==4.26.1 -d audit-output/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: report-quality-audit
          path: audit-output/
          retention-days: 14
