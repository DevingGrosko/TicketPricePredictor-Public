name: Apply NFL home-team grouping

on:
  push:
    branches:
      - feature/nfl-group-by-home-team
    paths:
      - "apply_nfl_team_grouping.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/nfl-group-by-home-team
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply team-grouping patch
        run: python apply_nfl_team_grouping.py
      - name: Validate patched files
        run: |
          python -m py_compile Flask_App/nfl_blueprint.py
          python -m unittest tests.test_nfl_blueprint -v
      - name: Commit implementation
        run: |
          rm -f apply_nfl_team_grouping.py .github/workflows/apply-nfl-team-grouping.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Group NFL website by home team"
          git push origin HEAD:feature/nfl-group-by-home-team
