# Backup timer only: the canonical owner captures once for both stores.
# Existing free pending/history caches remain recoverable; this job never prunes them.
name: Free TicketSignal collection
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    if: github.repository == 'DevingGrosko/TicketPricePredictor-Public' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: ticketsignal-single-owner-backup
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Dispatch only a missing canonical half-hour capture slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.single_capture_owner dispatch-backup
