name: Ignore NFL SVG root labels

on:
  push:
    branches:
      - feature/nfl-eastern-metadata-real-maps
    paths:
      - ".github/workflows/fix-nfl-svg-root-labels.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/nfl-eastern-metadata-real-maps
          fetch-depth: 0
      - name: Ignore labels attached only to the outer SVG root
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("nfl_collector.py")
          source = path.read_text(encoding="utf-8")
          old = "while (node && node !== root.parentElement) {"
          new = "while (node && node !== root) {"
          if source.count(old) != 1:
              raise SystemExit(f"Expected exactly one SVG ancestry loop, found {source.count(old)}")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_collector.py
          git commit -m "Ignore outer SVG labels when matching NFL sections"
          git push origin HEAD:feature/nfl-eastern-metadata-real-maps
