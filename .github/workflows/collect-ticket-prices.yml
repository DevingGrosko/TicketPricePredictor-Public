    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The gate is standard-library only and runs inside the existing writer lock.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select the half-hour NHL slot
        id: cadence
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_REPAIR: ${{ inputs.manual_repair }}
          DELIVERY_ONLY: ${{ inputs.delivery_only }}
        run: |
          if [[ "$EVENT_NAME" == 'workflow_dispatch' && "$DELIVERY_ONLY" == 'true' ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Explicit saved delivery makes no new browser capture."
          else
            repair=()
            if [[ "$EVENT_NAME" == 'workflow_dispatch' && "$MANUAL_REPAIR" == 'true' ]]; then
              repair=(--manual-repair)
            fi
            python -m tools.single_capture_owner slot-gate --sport nhl "${repair[@]}"
          fi

      - if: steps.cadence.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Restore pending NHL snapshot queue
        if: steps.cadence.outputs.run == 'true'
        uses: actions/cache/restore@v5
        with:
          path: nhl_pending
          key: nhl-pending-${{ github.run_id }}
          restore-keys: |
            nhl-pending-

      - name: Install NHL collector dependencies
        if: steps.cadence.outputs.run == 'true'
        run: python -m pip install "selenium>=4.26.1,<5" "SQLAlchemy>=2,<3"

      - name: Pin the optional Firefox runtime
        if: steps.cadence.outputs.run == 'true' && env.TICKETSIGNAL_BROWSER_ENGINE == 'firefox' && !inputs.delivery_only
        run: python -m pip install -r requirements-collector.txt

      - name: Install stock WebKit for the shared capture owner
        if: steps.cadence.outputs.run == 'true' && env.TICKETSIGNAL_BROWSER_ENGINE == 'webkit' && !inputs.delivery_only
        run: |
          python -m pip install -r requirements-webkit-collector.txt
          python -m playwright install --with-deps webkit

      - name: Verify stock Firefox and geckodriver for a requested Firefox capture
        if: steps.cadence.outputs.run == 'true' && env.TICKETSIGNAL_BROWSER_ENGINE == 'firefox' && !inputs.delivery_only
        run: |
          command -v firefox
          command -v geckodriver
          firefox --version
          geckodriver --version

      - name: Validate explicit performer navigation uses a supported engine
        if: steps.cadence.outputs.run == 'true' && inputs.browser_navigation == 'performer'
        env:
          BROWSER_ENGINE: ${{ env.TICKETSIGNAL_BROWSER_ENGINE }}
        run: python -c 'import os; assert os.environ["BROWSER_ENGINE"] in {"firefox", "webkit"}'

      - name: Restore immutable NHL shared observations
        if: steps.cadence.outputs.run == 'true' && (env.SHARED_CAPTURE == 'true' || inputs.delivery_only)
        uses: actions/cache/restore@v5
        with:
          path: shared-capture/nhl
          key: shared-capture-v1-nhl-capture-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: shared-capture-v1-nhl-capture-

      - name: Restore old free NHL pending state for the same owner
        if: steps.cadence.outputs.run == 'true' && (env.SHARED_CAPTURE == 'true' || inputs.delivery_only)
        uses: actions/cache/restore@v5
        with:
          # Read-only here; only the serialized TiDB mirror checkpoints this state.
          path: free-capture/nhl
          key: ticketsignal-free-v1-state-nhl-shared-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ticketsignal-free-v1-state-nhl-

      - name: Restore independent NHL delivery acknowledgments
        if: steps.cadence.outputs.run == 'true' && (env.SHARED_CAPTURE == 'true' || inputs.delivery_only)
        uses: actions/cache/restore@v5
        with:
          path: shared-acknowledgments/nhl
          key: shared-capture-v1-nhl-tidb-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: shared-capture-v1-nhl-tidb-

      - name: Collect due NHL games across the adaptive 30-day window
        if: steps.cadence.outputs.run == 'true' && env.SHARED_CAPTURE != 'true' && !inputs.delivery_only
