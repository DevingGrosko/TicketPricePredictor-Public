name: Collect ticket prices

run-name: Collect ticket prices (${{ inputs.dispatch_source || github.event_name }})

on:
  push:
    branches:
      - main
    paths:
      # Run the current collectors immediately after this workflow changes.
      # Ordinary code pushes do not start a ticket collection cycle. A
      # workflow-only commit also provides a clean new run ID when replaying
      # snapshots that were queued during a deployment or verifying a resolver fix.
      - ".github/workflows/collect-ticket-prices.yml"
  schedule:
    # Best-effort baseball recovery trigger. PythonAnywhere dispatches the
    # reliable :08/:38 cadence. The :53 fallback maps to the same half-hour
    # baseball slot as :38 and is intentionally skipped by the league jobs.
    - cron: "53 */6 * * *"
  workflow_dispatch:
    inputs:
      dispatch_source:
        description: Service that requested this collection cycle
        required: false
        default: manual
      browser_engine:
        description: Browser for this manual collection; recurring dispatches keep Chrome
        type: choice
        required: false
        options: [chrome, firefox, webkit]
        default: chrome
      browser_navigation:
        description: Firefox navigation mode; WebKit always uses ordinary team links
        type: choice
        required: false
        options: [direct, performer]
        default: direct
      delivery_only:
        description: Replay the fixed verified04:00 observations to both stores with zero browser captures
        type: boolean
        required: false
        default: false
      shared_capture:
        description: Manual pilot captures once for both stores; recurring defaults stay unchanged
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  SHARED_SAVED_MANIFEST_SHA256: 6b894990f80fb18f766427767944d0096f74e44bd0683e3630eda9e76999e287

jobs:
  collect-baseball:
    # Paused by user request on 2026-10-01; preserve history and pending files.
    # Applies to PythonAnywhere dispatches, scheduled fallback, and manual runs.
    if: ${{ false }}
    concurrency:
      group: baseball-ticket-price-collector
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Restore pending baseball snapshot queue
        uses: actions/cache/restore@v5
        with:
          path: collector_pending
          key: collector-pending-${{ github.run_id }}
          restore-keys: |
            collector-pending-

      - name: Install collector dependencies
        run: python -m pip install "selenium>=4.26.1,<5" "SQLAlchemy>=2,<3"

      - name: Discover and collect baseball games inside 72 hours
        env:
          COLLECTOR_INGEST_TOKEN: ${{ secrets.COLLECTOR_INGEST_TOKEN }}
        run: |
          python collector.py remote-run \
            --endpoint https://bunnyjeff.pythonanywhere.com/api/collector/snapshot \
            --headless \
            --timeout 45 \
            --health-output collector_remote_health.json \
            --pending-dir collector_pending

      - name: Save pending baseball snapshot queue
        if: always()
        uses: actions/cache/save@v5
        with:
          path: collector_pending
          key: collector-pending-${{ github.run_id }}

      - name: Upload baseball collection report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseball-collector-report-${{ github.run_id }}
          path: collector_remote_health.json
          if-no-files-found: warn
          retention-days: 14

  collect-nfl:
    env:
      TICKETSIGNAL_BROWSER_ENGINE: ${{ inputs.browser_engine || 'chrome' }}
      TICKETSIGNAL_FIREFOX_NAVIGATION: ${{ inputs.browser_engine == 'firefox' && inputs.browser_navigation || 'direct' }}
    concurrency:
      group: nfl-ticket-price-collector
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Select the half-hour NFL slot
        id: cadence
        env:
          DISPATCH_SOURCE: ${{ inputs.dispatch_source }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping NFL on the best-effort GitHub baseball recovery schedule."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "NFL evaluates every dispatched 30-minute cycle."
          fi

      - if: steps.cadence.outputs.run == 'true'
        uses: actions/checkout@v7

      - if: steps.cadence.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Restore pending NFL snapshot queue
        if: steps.cadence.outputs.run == 'true'
        uses: actions/cache/restore@v5
        with:
          path: nfl_pending
          key: nfl-pending-${{ github.run_id }}
          restore-keys: |
            nfl-pending-

      - name: Install NFL collector dependencies
        if: steps.cadence.outputs.run == 'true'
        run: python -m pip install "selenium>=4.26.1,<5" "SQLAlchemy>=2,<3"

      - name: Pin the opt-in Firefox runtime
        if: steps.cadence.outputs.run == 'true' && inputs.browser_engine == 'firefox'
        run: python -m pip install -r requirements-collector.txt

      - name: Install the opt-in stock WebKit runtime
        if: steps.cadence.outputs.run == 'true' && inputs.browser_engine == 'webkit' && !inputs.delivery_only
        run: |
          python -m pip install -r requirements-webkit-collector.txt
          python -m playwright install --with-deps webkit

      - name: Verify stock Firefox and geckodriver for this manual trial
        if: steps.cadence.outputs.run == 'true' && inputs.browser_engine == 'firefox'
        run: |
          command -v firefox
          command -v geckodriver
          firefox --version
          geckodriver --version

      - name: Validate explicit performer navigation uses a supported engine
        if: inputs.browser_navigation == 'performer'
        env:
          BROWSER_ENGINE: ${{ inputs.browser_engine }}
        run: python -c 'import os; assert os.environ["BROWSER_ENGINE"] in {"firefox", "webkit"}'

      - name: Restore the optional immutable NFL shared queue
        if: steps.cadence.outputs.run == 'true' && (inputs.shared_capture || inputs.delivery_only)
        uses: actions/cache/restore@v5
        with:
          path: shared-capture/nfl
          key: shared-capture-v1-nfl-capture-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: shared-capture-v1-nfl-capture-

      - name: Restore independent NFL delivery acknowledgments
        if: steps.cadence.outputs.run == 'true' && (inputs.shared_capture || inputs.delivery_only)
        uses: actions/cache/restore@v5
        with:
          path: shared-acknowledgments/nfl
          key: shared-capture-v1-nfl-tidb-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: shared-capture-v1-nfl-tidb-

      - name: Collect due NFL games across the adaptive 30-day window
        if: steps.cadence.outputs.run == 'true' && !(inputs.shared_capture || inputs.delivery_only)
        env:
          COLLECTOR_INGEST_TOKEN: ${{ secrets.COLLECTOR_INGEST_TOKEN }}
        run: |
          xvfb-run --auto-servernum python nfl_schedule_collector.py remote-run \
            --endpoint https://bunnyjeff.pythonanywhere.com/api/nfl/snapshot \
            --timeout 45 \
            --health-output nfl_remote_health.json \
            --pending-dir nfl_pending

      - name: Pilot one NFL capture owner or replay the verified saved observations
        if: steps.cadence.outputs.run == 'true' && (inputs.shared_capture || inputs.delivery_only)
        env:
          COLLECTOR_INGEST_TOKEN: ${{ secrets.COLLECTOR_INGEST_TOKEN }}
          DELIVERY_ONLY: ${{ inputs.delivery_only }}
        run: |
          if [[ "$DELIVERY_ONLY" == 'true' ]]; then
            python -m tools.shared_capture collect \
              --sport nfl --directory shared-capture/nfl --acknowledgments shared-acknowledgments/nfl \
              --pending-dir nfl_pending --health-output nfl_remote_health.json \
              --saved-manifest docs/shared-observations/manifest-0400.json --manifest-sha256 "$SHARED_SAVED_MANIFEST_SHA256"
          else
            xvfb-run --auto-servernum python -m tools.shared_capture collect \
              --sport nfl --directory shared-capture/nfl --acknowledgments shared-acknowledgments/nfl \
              --pending-dir nfl_pending --health-output nfl_remote_health.json --timeout 45
          fi

      - name: Bound the optional NFL shared queue
        id: shared-budget
        if: always() && steps.cadence.outputs.run == 'true' && (inputs.shared_capture || inputs.delivery_only)
        run: |
          python - <<'PYBUDGET'
          from pathlib import Path
          path=Path('shared-capture/nfl')
          assert sum(p.stat().st_size for p in path.rglob('*') if p.is_file()) <= 20*1024**2
          PYBUDGET

      - name: Checkpoint the optional NFL shared queue even after a failed capture
        if: always() && (inputs.shared_capture || inputs.delivery_only) && steps.shared-budget.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: shared-capture/nfl
          key: shared-capture-v1-nfl-capture-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Export only public NFL shared observations and acknowledgments
        if: always() && (inputs.shared_capture || inputs.delivery_only) && steps.shared-budget.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: shared-observations-nfl-${{ github.run_id }}
          overwrite: true
          path: shared-capture/nfl/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Save pending NFL snapshot queue
        if: always() && steps.cadence.outputs.run == 'true'
        uses: actions/cache/save@v5
        with:
          path: nfl_pending
          key: nfl-pending-${{ github.run_id }}

      - name: Upload NFL collection report
        if: always() && steps.cadence.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nfl-collector-report-${{ github.run_id }}
          path: nfl_remote_health.json
          if-no-files-found: warn
          retention-days: 14

  collect-nhl:
    env:
      TICKETSIGNAL_BROWSER_ENGINE: ${{ inputs.browser_engine || 'chrome' }}
      TICKETSIGNAL_FIREFOX_NAVIGATION: ${{ inputs.browser_engine == 'firefox' && inputs.browser_navigation || 'direct' }}
    concurrency:
      group: nhl-ticket-price-collector
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Select the half-hour NHL slot
        id: cadence
        env:
          DISPATCH_SOURCE: ${{ inputs.dispatch_source }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping NHL on the best-effort GitHub baseball recovery schedule."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "NHL evaluates every dispatched 30-minute cycle."
          fi

      - if: steps.cadence.outputs.run == 'true'
        uses: actions/checkout@v7

      - if: steps.cadence.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Restore pending NHL snapshot queue
        if: steps.cadence.outputs.run == 'true'
        uses: actions/cache/restore@v5
        with:
          path: nhl_pending
          key: nhl-pending-${{ github.run_id }}
          restore-keys: |
            nhl-pending-

      - name: Install NHL collector dependencies
        if: steps.cadence.outputs.run == 'true'
        run: python -m pip install "selenium>=4.26.1,<5" "SQLAlchemy>=2,<3"

      - name: Pin the opt-in Firefox runtime
        if: steps.cadence.outputs.run == 'true' && inputs.browser_engine == 'firefox'
        run: python -m pip install -r requirements-collector.txt

      - name: Install the opt-in stock WebKit runtime
        if: steps.cadence.outputs.run == 'true' && inputs.browser_engine == 'webkit' && !inputs.delivery_only
        run: |
          python -m pip install -r requirements-webkit-collector.txt
          python -m playwright install --with-deps webkit

      - name: Verify stock Firefox and geckodriver for this manual trial
        if: steps.cadence.outputs.run == 'true' && inputs.browser_engine == 'firefox'
        run: |
          command -v firefox
          command -v geckodriver
          firefox --version
          geckodriver --version

      - name: Validate explicit performer navigation uses a supported engine
        if: inputs.browser_navigation == 'performer'
        env:
          BROWSER_ENGINE: ${{ inputs.browser_engine }}
        run: python -c 'import os; assert os.environ["BROWSER_ENGINE"] in {"firefox", "webkit"}'

      - name: Restore the optional immutable NHL shared queue
        if: steps.cadence.outputs.run == 'true' && (inputs.shared_capture || inputs.delivery_only)
        uses: actions/cache/restore@v5
        with:
          path: shared-capture/nhl
          key: shared-capture-v1-nhl-capture-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: shared-capture-v1-nhl-capture-

      - name: Restore independent NHL delivery acknowledgments
        if: steps.cadence.outputs.run == 'true' && (inputs.shared_capture || inputs.delivery_only)
        uses: actions/cache/restore@v5
        with:
          path: shared-acknowledgments/nhl
          key: shared-capture-v1-nhl-tidb-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: shared-capture-v1-nhl-tidb-

      - name: Collect due NHL games across the adaptive seven-day window
        if: steps.cadence.outputs.run == 'true' && !(inputs.shared_capture || inputs.delivery_only)
        env:
          COLLECTOR_INGEST_TOKEN: ${{ secrets.COLLECTOR_INGEST_TOKEN }}
        run: |
          xvfb-run --auto-servernum python nhl_schedule_collector.py remote-run \
            --endpoint https://bunnyjeff.pythonanywhere.com/api/nhl/snapshot \
            --timeout 45 \
            --health-output nhl_remote_health.json \
            --pending-dir nhl_pending

      - name: Pilot one NHL capture owner or replay the verified saved observations
        if: steps.cadence.outputs.run == 'true' && (inputs.shared_capture || inputs.delivery_only)
        env:
          COLLECTOR_INGEST_TOKEN: ${{ secrets.COLLECTOR_INGEST_TOKEN }}
          DELIVERY_ONLY: ${{ inputs.delivery_only }}
        run: |
          if [[ "$DELIVERY_ONLY" == 'true' ]]; then
            python -m tools.shared_capture collect \
              --sport nhl --directory shared-capture/nhl --acknowledgments shared-acknowledgments/nhl \
              --pending-dir nhl_pending --health-output nhl_remote_health.json \
              --saved-manifest docs/shared-observations/manifest-0400.json --manifest-sha256 "$SHARED_SAVED_MANIFEST_SHA256"
          else
            xvfb-run --auto-servernum python -m tools.shared_capture collect \
              --sport nhl --directory shared-capture/nhl --acknowledgments shared-acknowledgments/nhl \
              --pending-dir nhl_pending --health-output nhl_remote_health.json --timeout 45
          fi

      - name: Bound the optional NHL shared queue
        id: shared-budget
        if: always() && steps.cadence.outputs.run == 'true' && (inputs.shared_capture || inputs.delivery_only)
        run: |
          python - <<'PYBUDGET'
          from pathlib import Path
          path=Path('shared-capture/nhl')
          assert sum(p.stat().st_size for p in path.rglob('*') if p.is_file()) <= 20*1024**2
          PYBUDGET

      - name: Checkpoint the optional NHL shared queue even after a failed capture
        if: always() && (inputs.shared_capture || inputs.delivery_only) && steps.shared-budget.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: shared-capture/nhl
          key: shared-capture-v1-nhl-capture-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Export only public NHL shared observations and acknowledgments
        if: always() && (inputs.shared_capture || inputs.delivery_only) && steps.shared-budget.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: shared-observations-nhl-${{ github.run_id }}
          overwrite: true
          path: shared-capture/nhl/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Save pending NHL snapshot queue
        if: always() && steps.cadence.outputs.run == 'true'
        uses: actions/cache/save@v5
        with:
          path: nhl_pending
          key: nhl-pending-${{ github.run_id }}

      - name: Upload NHL collection report
        if: always() && steps.cadence.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nhl-collector-report-${{ github.run_id }}
          path: nhl_remote_health.json
          if-no-files-found: warn
          retention-days: 14

  mirror-nfl:
    if: always() && github.event_name == 'workflow_dispatch' && (inputs.shared_capture || inputs.delivery_only)
    needs: collect-nfl
    uses: ./.github/workflows/shared-snapshot-mirror.yml
    with:
      sport: nfl
      source_ref: 48735f3dd9d70c193e370e8d34cbee9a347f3376
    secrets:
      TIDB_STAGING_HOST: ${{ secrets.TIDB_STAGING_HOST }}
      TIDB_STAGING_USERNAME: ${{ secrets.TIDB_STAGING_USERNAME }}
      TIDB_STAGING_PASSWORD: ${{ secrets.TIDB_STAGING_PASSWORD }}

  mirror-nhl:
    if: always() && github.event_name == 'workflow_dispatch' && (inputs.shared_capture || inputs.delivery_only)
    needs: collect-nhl
    uses: ./.github/workflows/shared-snapshot-mirror.yml
    with:
      sport: nhl
      source_ref: 48735f3dd9d70c193e370e8d34cbee9a347f3376
    secrets:
      TIDB_STAGING_HOST: ${{ secrets.TIDB_STAGING_HOST }}
      TIDB_STAGING_USERNAME: ${{ secrets.TIDB_STAGING_USERNAME }}
      TIDB_STAGING_PASSWORD: ${{ secrets.TIDB_STAGING_PASSWORD }}

  maintain-materialized-analytics:
    if: always()
    needs:
      - collect-baseball
      - collect-nfl
      - collect-nhl
    uses: ./.github/workflows/maintain-materialized-analytics.yml
    secrets:
      COLLECTOR_INGEST_TOKEN: ${{ secrets.COLLECTOR_INGEST_TOKEN }}
