name: Collect ticket prices

run-name: Collect ticket prices (${{ inputs.dispatch_source || github.event_name }})

on:
  push:
    branches:
      - main
    paths:
      # Run the current collectors immediately after this workflow changes.
      # Ordinary code pushes do not start a ticket collection cycle. A
      # workflow-only commit also provides a clean new run ID when replaying
      # snapshots that were queued during a deployment or verifying a resolver fix.
      - ".github/workflows/collect-ticket-prices.yml"
  schedule:
    # Best-effort baseball recovery trigger. PythonAnywhere dispatches the
    # reliable :08/:38 cadence. The :53 fallback maps to the same half-hour
    # baseball slot as :38 and is intentionally skipped by hourly league jobs.
    - cron: "53 */6 * * *"
  workflow_dispatch:
    inputs:
      dispatch_source:
        description: Service that requested this collection cycle
        required: false
        default: manual

permissions:
  contents: read

jobs:
  collect-baseball:
    concurrency:
      group: baseball-ticket-price-collector
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Restore pending baseball snapshot queue
        uses: actions/cache/restore@v5
        with:
          path: collector_pending
          key: collector-pending-${{ github.run_id }}
          restore-keys: |
            collector-pending-

      - name: Install collector dependencies
        run: python -m pip install "selenium>=4.26.1,<5" "SQLAlchemy>=2,<3"

      - name: Discover and collect baseball games inside 72 hours
        env:
          COLLECTOR_INGEST_TOKEN: ${{ secrets.COLLECTOR_INGEST_TOKEN }}
        run: |
          python collector.py remote-run \
            --endpoint https://bunnyjeff.pythonanywhere.com/api/collector/snapshot \
            --headless \
            --timeout 45 \
            --health-output collector_remote_health.json \
            --pending-dir collector_pending

      - name: Save pending baseball snapshot queue
        if: always()
        uses: actions/cache/save@v5
        with:
          path: collector_pending
          key: collector-pending-${{ github.run_id }}

      - name: Upload baseball collection report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseball-collector-report-${{ github.run_id }}
          path: collector_remote_health.json
          if-no-files-found: warn
          retention-days: 14

  collect-nfl:
    concurrency:
      group: nfl-ticket-price-collector
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Select the hourly NFL slot
        id: cadence
        env:
          DISPATCH_SOURCE: ${{ inputs.dispatch_source }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          minute="$(date -u +%M)"
          if [[ "$EVENT_NAME" == "push" || "$DISPATCH_SOURCE" == "manual" || 10#$minute -lt 30 ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "NFL cadence evaluation is due for this UTC hour."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping NFL; baseball continues on its 30-minute cadence."
          fi

      - if: steps.cadence.outputs.run == 'true'
        uses: actions/checkout@v7

      - if: steps.cadence.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Restore pending NFL snapshot queue
        if: steps.cadence.outputs.run == 'true'
        uses: actions/cache/restore@v5
        with:
          path: nfl_pending
          key: nfl-pending-${{ github.run_id }}
          restore-keys: |
            nfl-pending-

      - name: Install NFL collector dependencies
        if: steps.cadence.outputs.run == 'true'
        run: python -m pip install "selenium>=4.26.1,<5" "SQLAlchemy>=2,<3"

      - name: Collect due NFL games across the adaptive 30-day window
        if: steps.cadence.outputs.run == 'true'
        env:
          COLLECTOR_INGEST_TOKEN: ${{ secrets.COLLECTOR_INGEST_TOKEN }}
        run: |
          python nfl_schedule_collector.py remote-run \
            --endpoint https://bunnyjeff.pythonanywhere.com/api/nfl/snapshot \
            --headless \
            --timeout 45 \
            --health-output nfl_remote_health.json \
            --pending-dir nfl_pending

      - name: Save pending NFL snapshot queue
        if: always() && steps.cadence.outputs.run == 'true'
        uses: actions/cache/save@v5
        with:
          path: nfl_pending
          key: nfl-pending-${{ github.run_id }}

      - name: Upload NFL collection report
        if: always() && steps.cadence.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nfl-collector-report-${{ github.run_id }}
          path: nfl_remote_health.json
          if-no-files-found: warn
          retention-days: 14

  collect-nhl:
    concurrency:
      group: nhl-ticket-price-collector
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Select the hourly NHL slot
        id: cadence
        env:
          DISPATCH_SOURCE: ${{ inputs.dispatch_source }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          minute="$(date -u +%M)"
          if [[ "$EVENT_NAME" == "push" || "$DISPATCH_SOURCE" == "manual" || 10#$minute -lt 30 ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "NHL cadence evaluation is due for this UTC hour."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping NHL; baseball continues on its 30-minute cadence."
          fi

      - if: steps.cadence.outputs.run == 'true'
        uses: actions/checkout@v7

      - if: steps.cadence.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Restore pending NHL snapshot queue
        if: steps.cadence.outputs.run == 'true'
        uses: actions/cache/restore@v5
        with:
          path: nhl_pending
          key: nhl-pending-${{ github.run_id }}
          restore-keys: |
            nhl-pending-

      - name: Install NHL collector dependencies
        if: steps.cadence.outputs.run == 'true'
        run: python -m pip install "selenium>=4.26.1,<5" "SQLAlchemy>=2,<3"

      - name: Collect due NHL games across the adaptive seven-day window
        if: steps.cadence.outputs.run == 'true'
        env:
          COLLECTOR_INGEST_TOKEN: ${{ secrets.COLLECTOR_INGEST_TOKEN }}
        run: |
          python nhl_schedule_collector.py remote-run \
            --endpoint https://bunnyjeff.pythonanywhere.com/api/nhl/snapshot \
            --headless \
            --timeout 45 \
            --health-output nhl_remote_health.json \
            --pending-dir nhl_pending

      - name: Save pending NHL snapshot queue
        if: always() && steps.cadence.outputs.run == 'true'
        uses: actions/cache/save@v5
        with:
          path: nhl_pending
          key: nhl-pending-${{ github.run_id }}

      - name: Upload NHL collection report
        if: always() && steps.cadence.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nhl-collector-report-${{ github.run_id }}
          path: nhl_remote_health.json
          if-no-files-found: warn
          retention-days: 14

  maintain-materialized-analytics:
    if: always()
    needs:
      - collect-baseball
      - collect-nfl
      - collect-nhl
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repair any deferred materialized summaries
        env:
          COLLECTOR_INGEST_TOKEN: ${{ secrets.COLLECTOR_INGEST_TOKEN }}
        run: |
          set -euo pipefail
          base="https://bunnyjeff.pythonanywhere.com"
          for sport in mlb nfl nhl; do
            completed=0
            for attempt in 1 2 3; do
              response_file="$(mktemp)"
              status="$(
                curl -sS --max-time 180 \
                  -o "$response_file" \
                  -w '%{http_code}' \
                  -X POST \
                  -H "Authorization: Bearer $COLLECTOR_INGEST_TOKEN" \
                  -H 'Content-Type: application/json' \
                  -d "{\"sport\":\"$sport\",\"limit\":10}" \
                  "$base/api/analytics/backfill" || true
              )"
              response="$(cat "$response_file")"
              rm -f "$response_file"
              echo "$sport maintenance attempt $attempt: HTTP $status $response"
              if [[ "$status" == "200" ]]; then
                completed=1
                break
              fi
              if [[ "$status" != "409" ]]; then
                break
              fi
              sleep 10
            done
            if [[ "$completed" != "1" ]]; then
              echo "$sport analytics maintenance did not complete successfully" >&2
              exit 1
            fi
          done
