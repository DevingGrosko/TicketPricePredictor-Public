          path: nhl_remote_health.json
          if-no-files-found: warn
          retention-days: 14

  mirror-nfl:
    name: mirror-nfl-staging
    permissions:
      contents: read
      actions: read
    if: always() && needs.collect-nfl.outputs.mirror == 'true'
    needs: collect-nfl
    uses: ./.github/workflows/shared-snapshot-mirror.yml
    with:
      sport: nfl
      source_ref: c0f940ca1199a81306dfa87249912c6cca9e8991
    secrets:
      TIDB_STAGING_HOST: ${{ secrets.TIDB_STAGING_HOST }}
      TIDB_STAGING_USERNAME: ${{ secrets.TIDB_STAGING_USERNAME }}
      TIDB_STAGING_PASSWORD: ${{ secrets.TIDB_STAGING_PASSWORD }}

  mirror-nhl:
    name: mirror-nhl-staging
    permissions:
      contents: read
      actions: read
    if: always() && needs.collect-nhl.outputs.mirror == 'true'
    needs: collect-nhl
    uses: ./.github/workflows/shared-snapshot-mirror.yml
    with:
      sport: nhl
      source_ref: c0f940ca1199a81306dfa87249912c6cca9e8991
    secrets:
      TIDB_STAGING_HOST: ${{ secrets.TIDB_STAGING_HOST }}
      TIDB_STAGING_USERNAME: ${{ secrets.TIDB_STAGING_USERNAME }}
      TIDB_STAGING_PASSWORD: ${{ secrets.TIDB_STAGING_PASSWORD }}

  preserve-shared-cache-budget:
    if: always() && github.repository == 'DevingGrosko/TicketPricePredictor-Public' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    needs: [collect-nfl, collect-nhl, mirror-nfl, mirror-nhl]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Retain two completed shared generations and preserve active owners
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.shared_capture_storage prune-caches

  maintain-materialized-analytics:
    if: always()
    needs:
      - collect-baseball
      - collect-nfl
      - collect-nhl
    uses: ./.github/workflows/maintain-materialized-analytics.yml
    secrets:
      COLLECTOR_INGEST_TOKEN: ${{ secrets.COLLECTOR_INGEST_TOKEN }}
