name: Collect ticket prices

run-name: Collect ticket prices (${{ inputs.dispatch_source || github.event_name }})

on:
  schedule:
    # Best-effort recovery trigger. PythonAnywhere dispatches the reliable
    # :08/:38 cadence. Minute 23 maps to the same data slot, so ingest dedupes
    # this backup if the normal dispatch already succeeded.
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      dispatch_source:
        description: Service that requested this collection cycle
        required: false
        default: manual

concurrency:
  group: ticket-price-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect-baseball:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Restore pending baseball snapshot queue
        uses: actions/cache/restore@v5
        with:
          path: collector_pending
          key: collector-pending-${{ github.run_id }}
          restore-keys: |
            collector-pending-

      - name: Install collector dependencies
        run: python -m pip install "selenium>=4.26.1,<5" "SQLAlchemy>=2,<3"

      - name: Discover and collect baseball games inside 72 hours
        env:
          COLLECTOR_INGEST_TOKEN: ${{ secrets.COLLECTOR_INGEST_TOKEN }}
        run: |
          python collector.py remote-run \
            --endpoint https://bunnyjeff.pythonanywhere.com/api/collector/snapshot \
            --headless \
            --timeout 45 \
            --health-output collector_remote_health.json \
            --pending-dir collector_pending

      - name: Save pending baseball snapshot queue
        if: always()
        uses: actions/cache/save@v5
        with:
          path: collector_pending
          key: collector-pending-${{ github.run_id }}

      - name: Upload baseball collection report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseball-collector-report-${{ github.run_id }}
          path: collector_remote_health.json
          if-no-files-found: warn
          retention-days: 14

  collect-concerts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Restore pending concert snapshot queue
        uses: actions/cache/restore@v5
        with:
          path: concert_pending
          key: concert-pending-${{ github.run_id }}
          restore-keys: |
            concert-pending-

      - name: Install collector dependencies
        run: python -m pip install "selenium>=4.26.1,<5" "SQLAlchemy>=2,<3"

      - name: Discover and collect concerts inside 72 hours
        env:
          COLLECTOR_INGEST_TOKEN: ${{ secrets.COLLECTOR_INGEST_TOKEN }}
        run: |
          python concert_collector.py remote-run \
            --endpoint https://bunnyjeff.pythonanywhere.com/api/collector/snapshot \
            --headless \
            --timeout 45 \
            --health-output concert_remote_health.json \
            --pending-dir concert_pending

      - name: Save pending concert snapshot queue
        if: always()
        uses: actions/cache/save@v5
        with:
          path: concert_pending
          key: concert-pending-${{ github.run_id }}

      - name: Upload concert collection report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: concert-collector-report-${{ github.run_id }}
          path: concert_remote_health.json
          if-no-files-found: warn
          retention-days: 14
