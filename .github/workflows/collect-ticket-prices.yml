# One-off branch only. Never merge this workflow over the canonical owner.
name: Deliver two saved Dallas NHL identity observations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect-baseball:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 0
  collect-nfl:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 0
  collect-nhl:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'DevingGrosko/TicketPricePredictor-Public' && github.ref == 'refs/heads/codex/nhl-dallas-saved-delivery' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: nhl-ticket-price-collector
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    outputs:
      mirror: ${{ steps.delivery.outputs.attempted }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install 'selenium>=4.26.1,<5' 'SQLAlchemy>=2,<3'
      - name: Restore only this pilot run's producer checkpoint
        uses: actions/cache/restore@v5
        with:
          path: |
            shared-capture/nhl
            nhl_pending
          key: shared-capture-v1-nhl-capture-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: shared-capture-v1-nhl-capture-${{ github.run_id }}-
      - name: Replay only the two hash-pinned real observations without a browser
        id: delivery
        env:
          COLLECTOR_INGEST_TOKEN: ${{ secrets.COLLECTOR_INGEST_TOKEN }}
        run: |
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          python -m tools.nhl_dallas_saved_delivery --directory shared-capture/nhl --pending-dir nhl_pending --health-output nhl_dallas_delivery_health.json
      - name: Bound the preserved producer and pending files
        id: budget
        if: always()
        run: |
          python -m tools.shared_capture_storage queue-budget --directory shared-capture/nhl
          python -m tools.shared_capture_storage queue-budget --directory nhl_pending
      - name: Preserve this pilot's actual observations and receipts
        if: always() && steps.budget.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            shared-capture/nhl
            nhl_pending
          key: shared-capture-v1-nhl-capture-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prepare the validated two-record public export
        id: export
        if: always() && steps.budget.outcome == 'success'
        run: python -m tools.shared_capture export --sport nhl --directory shared-capture/nhl --output shared-export/nhl
      - name: Apply existing transport byte caps without branch cleanup
        id: upload-budget
        if: always() && steps.export.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from tools.shared_capture import validate_export
          from tools.shared_capture_storage import ARCHIVE_MARGIN, _inventory, artifact_upload_budget
          export = validate_export('nhl', 'shared-export/nhl')
          print('SHARED_TRANSPORT_BUDGET '+json.dumps(artifact_upload_budget(
              _inventory('/actions/artifacts', 'artifacts'), export['bytes']+ARCHIVE_MARGIN)))
          PY
      - name: Export only public saved observations and actual acknowledgments
        if: always() && steps.upload-budget.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: shared-observations-nhl-${{ github.run_id }}
          path: shared-export/nhl/
          overwrite: true
          if-no-files-found: error
          retention-days: 90
      - name: Preserve honest delivery health
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nhl-saved-delivery-${{ github.run_id }}
          path: nhl_dallas_delivery_health.json
          if-no-files-found: warn
          retention-days: 7
  mirror-nhl:
    name: mirror-nhl-staging
    if: always() && needs.collect-nhl.outputs.mirror == 'true'
    needs: collect-nhl
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/shared-snapshot-mirror.yml
    with:
      sport: nhl
      source_ref: c0f940ca1199a81306dfa87249912c6cca9e8991
    secrets:
      TIDB_STAGING_HOST: ${{ secrets.TIDB_STAGING_HOST }}
      TIDB_STAGING_USERNAME: ${{ secrets.TIDB_STAGING_USERNAME }}
      TIDB_STAGING_PASSWORD: ${{ secrets.TIDB_STAGING_PASSWORD }}
