name: Collect ticket prices

run-name: Collect ticket prices (${{ inputs.dispatch_source || github.event_name }})

on:
  push:
    branches:
      - main
    paths:
      # Run the current collector immediately after its workflow changes. This
      # also provides a controlled way to replay preserved queues after an
      # endpoint recovery without making ordinary code pushes scrape tickets.
      - ".github/workflows/collect-ticket-prices.yml"
  schedule:
    # Best-effort baseball recovery trigger. PythonAnywhere dispatches the
    # reliable :08/:38 cadence. The :53 fallback maps to the same half-hour
    # baseball slot as :38 and is intentionally skipped by the concert job.
    - cron: "53 */6 * * *"
  workflow_dispatch:
    inputs:
      dispatch_source:
        description: Service that requested this collection cycle
        required: false
        default: manual

permissions:
  contents: read

jobs:
  collect-baseball:
    concurrency:
      group: baseball-ticket-price-collector
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Restore pending baseball snapshot queue
        uses: actions/cache/restore@v5
        with:
          path: collector_pending
          key: collector-pending-${{ github.run_id }}
          restore-keys: |
            collector-pending-

      - name: Install collector dependencies
        run: python -m pip install "selenium>=4.26.1,<5" "SQLAlchemy>=2,<3"

      - name: Discover and collect baseball games inside 72 hours
        env:
          COLLECTOR_INGEST_TOKEN: ${{ secrets.COLLECTOR_INGEST_TOKEN }}
        run: |
          python collector.py remote-run \
            --endpoint https://bunnyjeff.pythonanywhere.com/api/collector/snapshot \
            --headless \
            --timeout 45 \
            --health-output collector_remote_health.json \
            --pending-dir collector_pending

      - name: Save pending baseball snapshot queue
        if: always()
        uses: actions/cache/save@v5
        with:
          path: collector_pending
          key: collector-pending-${{ github.run_id }}

      - name: Upload baseball collection report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseball-collector-report-${{ github.run_id }}
          path: collector_remote_health.json
          if-no-files-found: warn
          retention-days: 14

  collect-concerts:
    concurrency:
      group: concert-ticket-price-collector
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Select the hourly concert slot
        id: cadence
        env:
          DISPATCH_SOURCE: ${{ inputs.dispatch_source }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          minute="$(date -u +%M)"
          if [[ "$EVENT_NAME" == "push" || "$DISPATCH_SOURCE" == "manual" || 10#$minute -lt 30 ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Concert collection is due for this UTC hour."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping concerts; baseball continues on its 30-minute cadence."
          fi

      - if: steps.cadence.outputs.run == 'true'
        uses: actions/checkout@v7

      - if: steps.cadence.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Restore pending concert snapshot queue
        if: steps.cadence.outputs.run == 'true'
        uses: actions/cache/restore@v5
        with:
          path: concert_pending
          key: concert-pending-${{ github.run_id }}
          restore-keys: |
            concert-pending-

      - name: Install concert collector dependencies
        if: steps.cadence.outputs.run == 'true'
        run: python -m pip install "selenium>=4.26.1,<5" "SQLAlchemy>=2,<3"

      - name: Discover and collect concerts inside seven days
        if: steps.cadence.outputs.run == 'true'
        env:
          COLLECTOR_INGEST_TOKEN: ${{ secrets.COLLECTOR_INGEST_TOKEN }}
        run: |
          python concert_collector.py remote-run \
            --endpoint https://bunnyjeff.pythonanywhere.com/api/concerts/snapshot \
            --headless \
            --timeout 45 \
            --health-output concert_remote_health.json \
            --pending-dir concert_pending

      - name: Save pending concert snapshot queue
        if: always() && steps.cadence.outputs.run == 'true'
        uses: actions/cache/save@v5
        with:
          path: concert_pending
          key: concert-pending-${{ github.run_id }}

      - name: Upload concert collection report
        if: always() && steps.cadence.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: concert-collector-report-${{ github.run_id }}
          path: concert_remote_health.json
          if-no-files-found: warn
          retention-days: 14
