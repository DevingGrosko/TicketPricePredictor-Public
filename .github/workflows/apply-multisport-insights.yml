name: Apply multisport venue insights

# Payload chunks are verified against their local Git blob hashes.
on:
  push:
    branches:
      - feature/mlb-nhl-team-insights
    paths:
      - ".github/workflows/apply-multisport-insights.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-multisport-venue-insights
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mlb-nhl-team-insights
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Extract prepared patch
        run: |
          cat .github/patches/multisport-insights.part* \
            | base64 --decode > /tmp/multisport-insights.tar.gz
          tar -xzf /tmp/multisport-insights.tar.gz
          rm -rf .github/patches
          rm -f .github/workflows/apply-multisport-insights.yml

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate implementation
        env:
          DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/baseball.db
          CONCERT_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/concerts.db
          NFL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nfl.db
          NHL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nhl.db
          FLASK_SECRET_KEY: deployment-validation-key
          COLLECTOR_INGEST_TOKEN: deployment-validation-token
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          python -m py_compile \
            Flask_App/nfl_stadium_blueprint.py \
            tests/test_multi_sport_venue_insights.py
          node --check Flask_App/static/js/nfl-stadium.js
          python -m unittest discover -s tests -v

      - name: Commit prepared redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add team-first MLB and NHL venue insights"
          git push origin HEAD:feature/mlb-nhl-team-insights
