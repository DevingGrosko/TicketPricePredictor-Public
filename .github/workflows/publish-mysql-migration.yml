name: Apply MySQL production support

on:
  push:
    branches:
      - feature/mysql-production-migration
    paths:
      - "tools/_apply_mysql_patch.py"
      - ".github/workflows/publish-mysql-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bootstrap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mysql-production-migration
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply reviewed database portability patch
        run: python tools/_apply_mysql_patch.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full SQLite regression suite
        env:
          DATABASE_PATH: ${{ runner.temp }}/mysql-support-tests/baseball.db
          CONCERT_DATABASE_PATH: ${{ runner.temp }}/mysql-support-tests/concerts.db
          NFL_DATABASE_PATH: ${{ runner.temp }}/mysql-support-tests/nfl.db
          NHL_DATABASE_PATH: ${{ runner.temp }}/mysql-support-tests/nhl.db
          FLASK_SECRET_KEY: mysql-support-validation
          COLLECTOR_INGEST_TOKEN: mysql-support-validation-token
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          touch "$DATABASE_PATH"
          python -m py_compile \
            Flask_App/database_runtime.py \
            Flask_App/materialized_analytics.py \
            Flask_App/flask_app.py \
            Flask_App/nfl_blueprint.py \
            Flask_App/nhl_blueprint.py \
            models.py \
            tools/migrate_sqlite_to_mysql.py \
            tools/mysql_integration_check.py
          python -m unittest discover -s tests -v

      - name: Validate schemas and migration path on MariaDB
        env:
          MYSQL_TEST_ADMIN_URL: mysql+pymysql://root:root@127.0.0.1:3306/mysql?charset=utf8mb4
        run: python tools/mysql_integration_check.py

      - name: Commit validated implementation
        run: |
          git config user.name "DevingGrosko"
          git config user.email "79125705+DevingGrosko@users.noreply.github.com"
          git add -A
          git commit -m "Add MySQL production storage and migration tooling"
          git push origin HEAD:feature/mysql-production-migration
