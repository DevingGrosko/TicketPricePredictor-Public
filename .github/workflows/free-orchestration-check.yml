name: Free pipeline safety checks
on:
  push:
    branches: [feature/free-half-hour-publication]
    paths:
      - .github/workflows/free-orchestration-check.yml
      - tools/free_refresh_storage.py
      - tools/free_refresh_cycle.py
      - tests/test_free_refresh_orchestration.py
      - docs/free-ticket-site.workflow.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r requirements-staging.txt 'PyYAML>=6,<7'
      - run: python -m unittest discover -s tests -p 'test_free_refresh*.py' -v
      - name: Verify prepared template remains inactive and uses free standard runners
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          value=yaml.safe_load(Path('docs/free-ticket-site.workflow.yml').read_text())
          trigger=value.get('on',value.get(True))
          assert trigger['schedule']==[{'cron':'17,47 * * * *'}]
          assert all(job['runs-on']=='ubuntu-latest' for job in value['jobs'].values())
          assert not Path('.github/workflows/free-ticket-site.yml').exists()
          assert all(job.get('permissions',{}).get('contents','read')=='read' for job in value['jobs'].values())
          assert value['concurrency']['cancel-in-progress'] is False
          print('FREE_WORKFLOW_TEMPLATE_VALIDATED: inactive, 30-minute target, standard runners, no production deployment')
          PY
