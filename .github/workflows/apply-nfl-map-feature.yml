name: Apply interactive NFL stadium map

on:
  push:
    branches:
      - feature/interactive-nfl-stadium-map
    paths:
      - "apply_nfl_map_feature.ready"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/interactive-nfl-stadium-map
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Normalize README wording for the patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "- `/baseball`: direct baseball alias.\n",
              "- `/baseball`: alias for the baseball homepage.\n",
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply map integration patch
        run: python apply_nfl_map_feature.py

      - name: Validate map implementation
        run: |
          python -m py_compile Flask_App/nfl_blueprint.py
          python -m unittest tests.test_nfl_blueprint tests.test_flask_production_startup -v
          node --check Flask_App/static/js/nfl.js
          node --check Flask_App/static/js/nfl-map.js

      - name: Commit implementation
        run: |
          rm -f apply_nfl_map_feature.py apply_nfl_map_feature.ready .github/workflows/apply-nfl-map-feature.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add interactive NFL stadium section map"
          git push origin HEAD:feature/interactive-nfl-stadium-map
