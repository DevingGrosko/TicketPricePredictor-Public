name: Apply NFL implementation patch

on:
  push:
    branches:
      - feature/switch-concerts-to-nfl-hourly
    paths:
      - "nfl_patch.ready"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/switch-concerts-to-nfl-hourly
          fetch-depth: 0
      - name: Apply tested source patch
        run: |
          cat nfl_patch.part-* | base64 --decode | tar -xzf -
          rm -f nfl_patch.part-* nfl_patch.ready .github/workflows/apply-nfl-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Switch hourly secondary tracking from concerts to NFL"
          git push origin HEAD:feature/switch-concerts-to-nfl-hourly
