name: TiDB staging schema rehearsal

# Creates only reviewed empty staging tables; synthetic test rows are rolled back.
# No production credentials, source database, collection, import, or deployment.
on:
  push:
    branches: [staging/tidb-free-hosting-2026-09-20]
    paths:
      - .github/workflows/tidb-staging-schema.yml
      - tools/tidb_staging_schema.sql
      - tools/tidb_schema_rehearsal.py
      - tests/test_tidb_schema_rehearsal.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tidb-staging-schema-and-import
  cancel-in-progress: false

jobs:
  schema:
    if: >-
      github.repository == 'DevingGrosko/TicketPricePredictor-Public' &&
      github.ref == 'refs/heads/staging/tidb-free-hosting-2026-09-20'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: tidb-staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install only staging test dependencies
        run: python -m pip install --disable-pip-version-check 'SQLAlchemy>=2,<3' 'PyMySQL>=1.1.1,<2'
      - name: Offline staging tests without credentials
        run: python -m unittest discover -s tests -p 'test_tidb*.py' -v
      - name: Verify empty targets, create reviewed tables, test, and roll back synthetic rows
        env:
          TIDB_STAGING_HOST: ${{ secrets.TIDB_STAGING_HOST }}
          TIDB_STAGING_USERNAME: ${{ secrets.TIDB_STAGING_USERNAME }}
          TIDB_STAGING_PASSWORD: ${{ secrets.TIDB_STAGING_PASSWORD }}
        run: python -m tools.tidb_schema_rehearsal --apply-empty-staging
      - name: Read-only metadata diagnostics after a failed rehearsal
        if: failure()
        env:
          TIDB_STAGING_HOST: ${{ secrets.TIDB_STAGING_HOST }}
          TIDB_STAGING_USERNAME: ${{ secrets.TIDB_STAGING_USERNAME }}
          TIDB_STAGING_PASSWORD: ${{ secrets.TIDB_STAGING_PASSWORD }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from sqlalchemy import text
          from Flask_App.tidb_staging import SCHEMAS, create_staging_engine
          from tools.tidb_schema_rehearsal import parse_definitions, assert_target
          definitions = parse_definitions(Path('tools/tidb_staging_schema.sql').read_bytes())
          for sport, items in definitions.items():
              engine = create_staging_engine(sport)
              try:
                  with engine.connect() as c:
                      assert_target(c, SCHEMAS[sport])
                      names = set(c.execute(text('SELECT TABLE_NAME FROM information_schema.tables WHERE table_schema=:s'), {'s': SCHEMAS[sport]}).scalars())
                      print(sport + ': ' + json.dumps(sorted(names)))
                      for d in items:
                          if d.name not in names:
                              continue
                          rows = c.execute(text('SELECT INDEX_NAME, NON_UNIQUE, SEQ_IN_INDEX, COLUMN_NAME FROM information_schema.statistics WHERE table_schema=:s AND table_name=:t'), {'s': SCHEMAS[sport], 't': d.name}).all()
                          print(d.name + ' expected indexes: ' + repr(d.indexes))
                          print(d.name + ' actual indexes: ' + repr([tuple(r) for r in rows]))
                          print(c.exec_driver_sql('SHOW CREATE TABLE `' + d.name + '`').one()[1])
              except Exception as exc:
                  print('Diagnostic stopped: ' + type(exc).__name__ + '; raw errors omitted.')
              finally:
                  engine.dispose()
          PY
