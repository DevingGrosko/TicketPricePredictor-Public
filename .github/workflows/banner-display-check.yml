name: Static banner display acceptance
on:
  push:
    branches: [staging/tidb-free-hosting-2026-09-20]
    paths: [.github/workflows/banner-display-check.yml]
permissions:
  contents: read
jobs:
  public-display:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'selenium==4.26.1'
      - name: Check published stylesheet and visible messages without database access
        run: |
          python -u - <<'PY'
          import hashlib, json, shutil, time
          from pathlib import Path
          from urllib.request import Request, urlopen
          from selenium import webdriver
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          base='https://ticketsignal-static-preview.onrender.com'
          expected=Path('static_original/preview.css').read_bytes()
          def fetch(path):
              assert path.startswith('/') and not path.startswith('//') and '/api/' not in path
              with urlopen(Request(base+path,headers={'Cache-Control':'no-cache'}),timeout=25) as r:
                  assert r.geturl().startswith(base+'/')
                  return r.read(3*1024*1024)
          for attempt in range(24):
              if fetch('/native/preview.css')==expected:break
              time.sleep(10)
          else:raise AssertionError('Updated stylesheet has not finished deploying')
          options=webdriver.ChromeOptions()
          for flag in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1440,1100']:
              options.add_argument(flag)
          options.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          driver=webdriver.Chrome(service=Service(shutil.which('chromedriver')),options=options)
          driver.set_page_load_timeout(45)
          driver.execute_cdp_cmd('Network.enable',{})
          driver.execute_cdp_cmd('Network.setCacheDisabled',{'cacheDisabled':True})
          driver.execute_cdp_cmd('Network.setBlockedURLs',{'urls':['*pythonanywhere*','*tidbcloud*','*/api/*']})
          wait=WebDriverWait(driver,30)
          result={'passed':False,'base':base,'stylesheet_sha256':hashlib.sha256(expected).hexdigest(),'sports':{}}
          try:
              for sport,path in [('mlb','/'),('nfl','/nfl/'),('nhl','/nhl/')]:
                  driver.get(base+path)
                  wait.until(lambda d:d.execute_script("return document.body.dataset.staticReady==='true'"))
                  assert 'Start with a team.' in driver.find_element(By.TAG_NAME,'h1').text
                  notes=driver.find_elements(By.CSS_SELECTOR,'.static-snapshot-note')
                  assert all(not n.is_displayed() for n in notes)
                  assert 'Staging preview' not in driver.find_element(By.TAG_NAME,'body').text
                  driver.set_window_size(390,844)
                  assert all(not n.is_displayed() for n in notes)
                  assert not driver.execute_script('return document.documentElement.scrollWidth>innerWidth+1')
                  driver.set_window_size(1440,1100)
                  result['sports'][sport]={'banner_hidden_desktop':True,'banner_hidden_mobile':True}
              driver.get(base+'/concerts/')
              wait.until(lambda d:d.execute_script("return document.body.dataset.staticReady==='true'"))
              note=driver.find_element(By.CSS_SELECTOR,'.static-snapshot-note')
              assert note.is_displayed() and 'has not been migrated' in note.text
              result['concert_unavailable_notice_visible']=True
              errors=[x for x in driver.get_log('browser') if x['level']=='SEVERE']
              assert not errors, errors[:3]
              manifest=json.loads(fetch('/original-manifest.json'))
              result['live_updates_enabled']=manifest['live_updates_enabled']
              result['source_freshness']={k:json.loads(fetch(p))['captured_through'] for k,p in manifest['sports'].items()}
              result['passed']=True
          finally:
              driver.quit()
              Path('banner-display-result.json').write_text(json.dumps(result,indent=2))
              print('BANNER_DISPLAY_RESULT '+json.dumps(result),flush=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: banner-display-result
          path: banner-display-result.json
          retention-days: 3
