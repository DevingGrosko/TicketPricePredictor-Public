name: Apply MySQL cutover integration

on:
  push:
    branches:
      - feature/mysql-cutover
    paths:
      - ".github/workflows/apply-mysql-cutover.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mysql-cutover
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Integrate backend selection and migration guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S | re.M)
              if count != 1:
                  raise RuntimeError(f"Expected one {label} match, found {count}")
              return updated

          # MLB model: select the configured backend while explicit test paths stay SQLite.
          path = Path("models.py")
          text = path.read_text(encoding="utf-8")
          import_line = "from Flask_App.database_config import create_ticket_engine, is_sqlite_engine\n"
          if import_line not in text:
              marker = "PROJECT_DIR = Path(__file__).resolve().parent\n"
              if marker not in text:
                  raise RuntimeError("models.py project marker not found")
              text = text.replace(marker, import_line + "\n" + marker, 1)

          new_create_model = '''class CreateModel:
              def __init__(self, db_path: str | Path | None = None):
                  self.db_path = Path(db_path or database_path()).expanduser().resolve()
                  self.engine = create_ticket_engine(
                      "mlb",
                      sqlite_path=self.db_path,
                      force_sqlite=db_path is not None,
                  )
                  if is_sqlite_engine(self.engine):
                      if not self.db_path.exists():
                          raise FileNotFoundError(f"Database file missing: {self.db_path}")
                      _ensure_baseball_performance_indexes(self.engine, self.db_path)

                  # Imported lazily to avoid a module cycle: the analytics helper uses
                  # the shared timezone conversion functions defined above.
                  from Flask_App.materialized_analytics import ensure_summary_schema

                  ensure_summary_schema(self.engine)
                  self.SessionLocal = sessionmaker(
                      bind=self.engine,
                      autoflush=False,
                      expire_on_commit=False,
                  )

              def getSession(self):
                  return self.SessionLocal
          '''
          new_create_model = re.sub(r"^          ", "", new_create_model, flags=re.M)
          text = replace_once(
              text,
              r"class CreateModel:\n.*?(?=\n\n# ---------------------------------------------------------------------------\n# Concert storage)",
              new_create_model.rstrip(),
              "CreateModel block",
          )
          path.write_text(text, encoding="utf-8")

          # NFL model: current-schema MySQL tables are created by the migration tool;
          # legacy ALTER/PRAGMA work remains SQLite-only.
          path = Path("Flask_App/nfl_blueprint.py")
          text = path.read_text(encoding="utf-8")
          import_line = "from Flask_App.database_config import create_ticket_engine, is_sqlite_engine\n"
          if import_line not in text:
              marker = "from Flask_App.performance_cache import (\n"
              if marker not in text:
                  raise RuntimeError("NFL import marker not found")
              text = text.replace(marker, import_line + marker, 1)
          signature = "def _ensure_nfl_schema(engine: Any, db_path: Path) -> None:\n"
          if signature not in text:
              raise RuntimeError("NFL schema function not found")
          guard = signature + "    if not is_sqlite_engine(engine):\n        return\n"
          if guard not in text:
              text = text.replace(signature, guard, 1)

          new_nfl_model = '''class CreateNFLModel:
              """Open the configured NFL database, preserving explicit SQLite test files."""

              def __init__(self, db_path: str | Path | None = None):
                  self.db_path = Path(db_path or nfl_database_path()).expanduser().resolve()
                  self.engine = create_ticket_engine(
                      "nfl",
                      sqlite_path=self.db_path,
                      force_sqlite=db_path is not None,
                  )
                  if is_sqlite_engine(self.engine):
                      NFLBase.metadata.create_all(self.engine)
                      _ensure_nfl_schema(self.engine, self.db_path)
                  ensure_summary_schema(self.engine)
                  self.SessionLocal = sessionmaker(
                      bind=self.engine,
                      autoflush=False,
                      expire_on_commit=False,
                  )

              def getSession(self):
                  return self.SessionLocal
          '''
          new_nfl_model = re.sub(r"^          ", "", new_nfl_model, flags=re.M)
          text = replace_once(
              text,
              r"class CreateNFLModel:\n.*?\n    def getSession\(self\):\n        return self\.SessionLocal",
              new_nfl_model.rstrip(),
              "CreateNFLModel block",
          )
          path.write_text(text, encoding="utf-8")

          # NHL model: same backend selection and SQLite-only legacy schema upgrade.
          path = Path("Flask_App/nhl_blueprint.py")
          text = path.read_text(encoding="utf-8")
          import_line = "from Flask_App.database_config import create_ticket_engine, is_sqlite_engine\n"
          if import_line not in text:
              marker = "from Flask_App.performance_cache import (\n"
              if marker not in text:
                  raise RuntimeError("NHL import marker not found")
              text = text.replace(marker, import_line + marker, 1)
          signature = "def _ensure_nhl_schema(engine: Any, db_path: Path) -> None:\n"
          if signature not in text:
              raise RuntimeError("NHL schema function not found")
          guard = signature + "    if not is_sqlite_engine(engine):\n        return\n"
          if guard not in text:
              text = text.replace(signature, guard, 1)

          new_nhl_model = '''class CreateNHLModel:
              """Open the configured NHL database, preserving explicit SQLite test files."""

              def __init__(self, db_path: str | Path | None = None):
                  self.db_path = Path(db_path or nhl_database_path()).expanduser().resolve()
                  self.engine = create_ticket_engine(
                      "nhl",
                      sqlite_path=self.db_path,
                      force_sqlite=db_path is not None,
                  )
                  if is_sqlite_engine(self.engine):
                      NHLBase.metadata.create_all(self.engine)
                      _ensure_nhl_schema(self.engine, self.db_path)
                  ensure_summary_schema(self.engine)
                  self.SessionLocal = sessionmaker(
                      bind=self.engine,
                      autoflush=False,
                      expire_on_commit=False,
                  )

              def getSession(self):
                  return self.SessionLocal
          '''
          new_nhl_model = re.sub(r"^          ", "", new_nhl_model, flags=re.M)
          text = replace_once(
              text,
              r"class CreateNHLModel:\n.*?\n    def getSession\(self\):\n        return self\.SessionLocal",
              new_nhl_model.rstrip(),
              "CreateNHLModel block",
          )
          path.write_text(text, encoding="utf-8")

          # The already-registered maintenance blueprint blocks writes throughout
          # the copy/reload boundary and exposes a token-protected backend status.
          path = Path("Flask_App/analytics_maintenance.py")
          text = path.read_text(encoding="utf-8")
          import_line = "from Flask_App.database_config import configured_backend, migration_pause_active\n"
          if import_line not in text:
              first_flask_import = re.search(r"^from flask import .*?$", text, flags=re.M)
              if first_flask_import:
                  insert_at = first_flask_import.end()
                  text = text[:insert_at] + "\n" + import_line.rstrip() + text[insert_at:]
              else:
                  text = import_line + text

          blueprint_match = re.search(r"^(\w+)\s*=\s*Blueprint\(", text, flags=re.M)
          if not blueprint_match:
              raise RuntimeError("Analytics maintenance blueprint variable not found")
          blueprint = blueprint_match.group(1)
          if "/api/database/status" not in text:
              text += f'''\n\n@{blueprint}.before_app_request
          def pause_ticket_ingestion_during_database_migration():
              from flask import jsonify, request

              protected_paths = {{
                  "/api/collector/snapshot",
                  "/api/nfl/snapshot",
                  "/api/nhl/snapshot",
              }}
              if (
                  request.method == "POST"
                  and request.path in protected_paths
                  and migration_pause_active()
              ):
                  return (
                      jsonify(
                          {{
                              "status": "maintenance",
                              "message": "Ticket collection is paused during a database migration.",
                          }}
                      ),
                      503,
                  )
              return None


          @{blueprint}.get("/api/database/status")
          def database_backend_status():
              import hmac
              import os
              from flask import jsonify, request

              expected = os.getenv("COLLECTOR_INGEST_TOKEN", "").strip()
              supplied = request.headers.get("Authorization", "")
              prefix = "Bearer "
              token = supplied[len(prefix):].strip() if supplied.startswith(prefix) else ""
              if not expected or not token or not hmac.compare_digest(expected, token):
                  return jsonify({{"status": "unauthorized"}}), 401
              return jsonify(
                  {{
                      "status": "ok",
                      "backend": configured_backend(),
                      "migration_paused": migration_pause_active(),
                  }}
              )
          '''
              text = re.sub(r"^          ", "", text, flags=re.M)
          path.write_text(text, encoding="utf-8")

          # Record the deployment/cutover procedure in the project documentation.
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          if "## Production database migration" not in text:
              text += '''

          ## Production database migration

          SQLite remains the default local and rollback backend. Production can use
          independent MySQL databases for MLB, NFL, and NHL by setting
          `TICKETSIGNAL_DATABASE_BACKEND=mysql` and the server-owned MySQL settings
          documented in `.env.example`.

          The guarded production cutover is:

          ```bash
          python tools/mysql_cutover.py migrate
          # Reload the PythonAnywhere web app from the Web tab.
          python tools/mysql_cutover.py activate
          ```

          `migrate` blocks collector writes, copies all raw and materialized tables,
          verifies counts, key ranges, deterministic samples, and foreign-key
          integrity, then leaves collection paused until a reloaded live worker
          confirms it is using MySQL. The original SQLite files are retained for
          rollback.
          '''
              text = re.sub(r"^          ", "", text, flags=re.M)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate implementation
        env:
          DATABASE_PATH: ${{ runner.temp }}/mysql-cutover-tests/baseball.db
          CONCERT_DATABASE_PATH: ${{ runner.temp }}/mysql-cutover-tests/concerts.db
          NFL_DATABASE_PATH: ${{ runner.temp }}/mysql-cutover-tests/nfl.db
          NHL_DATABASE_PATH: ${{ runner.temp }}/mysql-cutover-tests/nhl.db
          FLASK_SECRET_KEY: test-key
          COLLECTOR_INGEST_TOKEN: test-token
          TICKETSIGNAL_DATABASE_BACKEND: sqlite
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          python -m py_compile \
            Flask_App/database_config.py \
            Flask_App/analytics_maintenance.py \
            Flask_App/flask_app.py \
            Flask_App/materialized_analytics.py \
            Flask_App/nfl_blueprint.py \
            Flask_App/nhl_blueprint.py \
            models.py \
            tools/mysql_cutover.py
          python -m unittest discover -s tests -v

      - name: Publish implementation branch
        run: |
          git rm .github/workflows/apply-mysql-cutover.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .env.example \
            README.md \
            requirements.txt \
            Flask_App/database_config.py \
            Flask_App/analytics_maintenance.py \
            Flask_App/nfl_blueprint.py \
            Flask_App/nhl_blueprint.py \
            models.py \
            tools/mysql_cutover.py \
            tests/test_database_config.py
          git commit -m "Add guarded MySQL production cutover"
          git push origin HEAD:feature/mysql-cutover
