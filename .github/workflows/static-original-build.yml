name: Original-interface static build
on:
  push:
    branches: [staging/tidb-free-hosting-2026-09-20]
    paths:
      - .github/workflows/static-original-build.yml
      - tools/build_original_static.py
      - tools/build_static_preview.py
      - tools/check_original_static.py
      - static_original/**
      - tests/test_original_static.py
permissions:
  contents: read
concurrency:
  group: static-original-interface
  cancel-in-progress: false
jobs:
  offline:
    if: github.repository == 'DevingGrosko/TicketPricePredictor-Public' && github.ref == 'refs/heads/staging/tidb-free-hosting-2026-09-20'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r requirements-staging.txt
      - name: Original template and data regression tests without secrets
        run: |
          node --check static_original/bridge.js
          python -m py_compile tools/build_original_static.py tools/check_original_static.py
          set +e
          python -m unittest discover -s tests -v > "$RUNNER_TEMP/original-tests.log" 2>&1
          code=$?
          tail -n 65 "$RUNNER_TEMP/original-tests.log"
          exit "$code"
      - name: Exercise synthetic original page flows in real Chrome before reading TiDB
        run: |
          python -u - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('fixture_module','tests/test_original_static.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          print(mod.fixture('original-synthetic-site'))
          PY
          python -u -m tools.check_original_static original-synthetic-site --browser --output synthetic-browser-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: original-synthetic-browser
          path: synthetic-browser-results/
          retention-days: 7
  snapshot:
    needs: offline
    runs-on: ubuntu-latest
    # Rendering the full legacy route surface (thousands of original-template
    # pages) is intentionally heavier than the simplified preview. This is a
    # staging acceptance run, not the eventual incremental publish cadence.
    timeout-minutes: 60
    environment: tidb-staging
    concurrency:
      group: tidb-staging-schema-and-import
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r requirements-staging.txt
      - name: Render original templates from isolated read-only TiDB snapshots
        env:
          TICKETSIGNAL_STAGING_SITE: '1'
          TIDB_STAGING_HOST: ${{ secrets.TIDB_STAGING_HOST }}
          TIDB_STAGING_USERNAME: ${{ secrets.TIDB_STAGING_USERNAME }}
          TIDB_STAGING_PASSWORD: ${{ secrets.TIDB_STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          python -u -m tools.build_original_static --output original-static-dist | tee "$RUNNER_TEMP/original-build.log"
      - name: Validate every original-page link and published data file without secrets
        run: python -u -m tools.check_original_static original-static-dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ticketsignal-original-static
          path: original-static-dist/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
  browser:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'selenium==4.26.1'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ticketsignal-original-static
          path: original-static-dist
      - name: Original interface Chrome tests with no Flask server or database credentials
        run: python -u -m tools.check_original_static original-static-dist --browser --output original-browser-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: original-static-browser-results
          path: original-browser-results/
          retention-days: 7
