name: Register NFL stadium blueprint

on:
  push:
    branches:
      - feature/nfl-stadium-insights
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: register-nfl-stadium-blueprint
  cancel-in-progress: false

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/nfl-stadium-insights
          fetch-depth: 0

      - name: Register route and extend validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("Flask_App/flask_app.py")
          app = app_path.read_text()
          old = '''from Flask_App.nfl_blueprint import nfl_blueprint
          from Flask_App.nhl_blueprint import nhl_blueprint

          app.register_blueprint(nfl_blueprint)
          app.register_blueprint(nhl_blueprint)
          '''
          new = '''from Flask_App.nfl_blueprint import nfl_blueprint
          from Flask_App.nfl_stadium_blueprint import nfl_stadium_blueprint
          from Flask_App.nhl_blueprint import nhl_blueprint

          app.register_blueprint(nfl_blueprint)
          app.register_blueprint(nfl_stadium_blueprint)
          app.register_blueprint(nhl_blueprint)
          '''
          if old not in app:
              raise SystemExit("Could not find the Flask blueprint registration block.")
          app_path.write_text(app.replace(old, new, 1))

          workflow_path = Path(".github/workflows/deploy-pythonanywhere.yml")
          workflow = workflow_path.read_text()
          slash = chr(92)
          compile_line = f"            Flask_App/nfl_blueprint.py {slash}\n"
          if compile_line not in workflow:
              raise SystemExit("Could not find the Python compile validation line.")
          workflow = workflow.replace(
              compile_line,
              compile_line
              + f"            Flask_App/nfl_stadium_blueprint.py {slash}\n",
              1,
          )

          js_line = "          node --check Flask_App/static/js/nfl-map.js\n"
          if js_line not in workflow:
              raise SystemExit("Could not find the JavaScript validation line.")
          workflow = workflow.replace(
              js_line,
              js_line
              + "          node --check Flask_App/static/js/nfl-stadium.js\n",
              1,
          )
          workflow_path.write_text(workflow)

          Path(".github/workflows/register-nfl-stadium-blueprint.yml").unlink()
          PY

      - name: Commit registered blueprint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Register and validate NFL stadium insights"
          git push origin HEAD:feature/nfl-stadium-insights
