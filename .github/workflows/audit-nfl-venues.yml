name: Audit production NFL venue metadata

on:
  push:
    branches:
      - audit/nfl-venue-integrity-2026-08-30
    paths:
      - ".github/workflows/audit-nfl-venues.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Read every public production NFL game and compare venues
        run: |
          python - <<'PY'
          from collections import defaultdict
          from datetime import datetime, timedelta, timezone
          from html.parser import HTMLParser
          import html
          import json
          from pathlib import Path
          import re
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          BASE_URL = 'https://bunnyjeff.pythonanywhere.com'
          EASTERN = ZoneInfo('America/New_York')

          def fetch_text(url, timeout=30):
              request = Request(
                  url,
                  headers={
                      'Accept': 'text/html,application/json',
                      'User-Agent': 'TicketSignal-NFL-venue-audit/1.0',
                  },
              )
              with urlopen(request, timeout=timeout) as response:
                  return response.read().decode('utf-8'), response.status

          class MapPageParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_banner = False
                  self.banner_depth = 0
                  self.in_banner_paragraph = False
                  self.in_heading = False
                  self.paragraph_text = []
                  self.heading_text = []
                  self.provider_url = ''
                  self.error_text = []
                  self.in_error = False
                  self.error_depth = 0

              @staticmethod
              def classes(attrs):
                  values = dict(attrs).get('class') or ''
                  return set(str(values).split())

              def handle_starttag(self, tag, attrs):
                  classes = self.classes(attrs)
                  if tag == 'header' and 'nfl-map-banner' in classes:
                      self.in_banner = True
                      self.banner_depth = 1
                  elif self.in_banner:
                      self.banner_depth += 1

                  if self.in_banner and tag == 'p':
                      self.in_banner_paragraph = True
                  if self.in_banner and tag == 'h1':
                      self.in_heading = True

                  if tag == 'a' and 'nfl-map-provider-link' in classes:
                      self.provider_url = str(dict(attrs).get('href') or '')

                  if tag == 'div' and 'nfl-map-error' in classes:
                      self.in_error = True
                      self.error_depth = 1
                  elif self.in_error:
                      self.error_depth += 1

              def handle_endtag(self, tag):
                  if tag == 'p' and self.in_banner_paragraph:
                      self.in_banner_paragraph = False
                  if tag == 'h1' and self.in_heading:
                      self.in_heading = False

                  if self.in_banner:
                      self.banner_depth -= 1
                      if self.banner_depth <= 0:
                          self.in_banner = False
                  if self.in_error:
                      self.error_depth -= 1
                      if self.error_depth <= 0:
                          self.in_error = False

              def handle_data(self, data):
                  if self.in_banner_paragraph:
                      self.paragraph_text.append(data)
                  if self.in_heading:
                      self.heading_text.append(data)
                  if self.in_error:
                      self.error_text.append(data)

          def parse_game_label(label):
              normalized = ' '.join(str(label or '').split())
              match = re.match(
                  r'^(?P<title>.+?)\s+—\s+'
                  r'(?P<date>[A-Z][a-z]{2}\s+\d{1,2},\s+\d{4})\s+·\s+'
                  r'(?P<time>\d{1,2}:\d{2}\s+[AP]M)$',
                  normalized,
              )
              if not match:
                  raise ValueError(f'Unexpected NFL game label: {label!r}')
              local = datetime.strptime(
                  f"{match.group('date')} {match.group('time')}",
                  '%b %d, %Y %I:%M %p',
              ).replace(tzinfo=EASTERN)
              return match.group('title'), local.astimezone(timezone.utc)

          home_html, home_status = fetch_text(f'{BASE_URL}/nfl')
          if home_status != 200:
              raise SystemExit(f'NFL page returned HTTP {home_status}')
          match = re.search(
              r'const\s+nflGamesData\s*=\s*(\{.*?\});\s*'
              r'const\s+nflGameSectionsData',
              home_html,
              flags=re.DOTALL,
          )
          if not match:
              raise SystemExit('Could not locate nflGamesData in the production page.')
          games_data = json.loads(html.unescape(match.group(1)))

          stored = []
          page_errors = []
          for team, games in games_data.items():
              for game in games:
                  game_id = str(game.get('value') or '')
                  label = str(game.get('label') or '')
                  title, event_date = parse_game_label(label)
                  map_url = f"{BASE_URL}/nfl/map?{urlencode({'team': team, 'game': game_id})}"
                  try:
                      map_html, map_status = fetch_text(map_url)
                  except Exception as exc:
                      page_errors.append(
                          f'{team} game {game_id}: {type(exc).__name__}: {exc}'
                      )
                      continue
                  if map_status != 200:
                      page_errors.append(f'{team} game {game_id}: HTTP {map_status}')
                      continue

                  parser = MapPageParser()
                  parser.feed(map_html)
                  error_text = ' '.join(' '.join(parser.error_text).split())
                  if error_text:
                      page_errors.append(f'{team} game {game_id}: {error_text}')
                      continue

                  paragraph = ' '.join(' '.join(parser.paragraph_text).split())
                  parts = [part.strip() for part in paragraph.split('·')]
                  if len(parts) < 3:
                      page_errors.append(
                          f'{team} game {game_id}: could not parse map banner {paragraph!r}'
                      )
                      continue
                  venue = parts[1]
                  section_match = re.search(r'(\d+)\s+sections?', parts[-1])
                  section_count = int(section_match.group(1)) if section_match else None
                  stored.append(
                      {
                          'id': game_id,
                          'home_team_bucket': team,
                          'title': title,
                          'event_date': event_date.isoformat(),
                          'venue': venue,
                          'source_url': parser.provider_url,
                          'section_count': section_count,
                          'map_url': map_url,
                      }
                  )
                  time.sleep(0.05)

          Path('production_nfl_events.json').write_text(
              json.dumps(
                  {
                      'source_page': f'{BASE_URL}/nfl',
                      'event_count': len(stored),
                      'page_errors': page_errors,
                      'events': stored,
                  },
                  indent=2,
              ) + '\n',
              encoding='utf-8',
          )

          if page_errors:
              raise SystemExit(
                  'One or more production map pages could not be audited: '
                  + '; '.join(page_errors[:5])
              )

          if stored:
              stored_times = [datetime.fromisoformat(row['event_date']) for row in stored]
              start = min(stored_times) - timedelta(days=3)
              end = max(stored_times) + timedelta(days=3)
          else:
              start = datetime.now(timezone.utc) - timedelta(days=7)
              end = datetime.now(timezone.utc) + timedelta(days=35)

          dates = f'{start.astimezone(EASTERN):%Y%m%d}-{end.astimezone(EASTERN):%Y%m%d}'
          schedule_url = (
              'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard'
              f'?dates={dates}&limit=1000'
          )
          schedule_text, schedule_status = fetch_text(schedule_url)
          if schedule_status != 200:
              raise SystemExit(f'Schedule API returned HTTP {schedule_status}')
          schedule_payload = json.loads(schedule_text)

          schedule = []
          for event in schedule_payload.get('events') or []:
              competitions = event.get('competitions') or []
              competition = competitions[0] if competitions else {}
              sides = {}
              for competitor in competition.get('competitors') or []:
                  team_data = competitor.get('team') or {}
                  name = ' '.join(str(team_data.get('displayName') or '').split())
                  side = str(competitor.get('homeAway') or '').lower()
                  if side in {'home', 'away'} and name:
                      sides[side] = name
              if not sides.get('home') or not sides.get('away'):
                  continue
              venue_data = competition.get('venue') or {}
              address = venue_data.get('address') or {}
              schedule.append(
                  {
                      'schedule_id': str(event.get('id') or competition.get('id') or ''),
                      'name': ' '.join(str(event.get('name') or '').split()),
                      'event_date': datetime.fromisoformat(
                          str(event['date']).replace('Z', '+00:00')
                      ).astimezone(timezone.utc),
                      'away_team': sides['away'],
                      'home_team': sides['home'],
                      'venue': ' '.join(str(venue_data.get('fullName') or '').split()),
                      'city': ' '.join(str(address.get('city') or '').split()),
                      'state': ' '.join(str(address.get('state') or '').split()),
                  }
              )

          def normalize(value):
              return re.sub(r'[^a-z0-9]+', '', str(value or '').lower())

          equivalent_groups = [
              {'arrowheadstadium', 'gehafieldatarrowheadstadium'},
              {'highmarkstadium', 'newhighmarkstadium'},
          ]
          legacy_groups = {
              'fedexfield': 'Northwest Stadium',
              'firstenergystadium': 'Huntington Bank Field',
              'clevelandbrownsstadium': 'Huntington Bank Field',
              'heinzfield': 'Acrisure Stadium',
              'paulbrownstadium': 'Paycor Stadium',
              'tiaabankfield': 'EverBank Stadium',
              'everbankfield': 'EverBank Stadium',
              'centurylinkfield': 'Lumen Field',
              'reliantstadium': 'NRG Stadium',
              'mercedesbenzsuperdome': 'Caesars Superdome',
              'universityofphoenixstadium': 'State Farm Stadium',
              'sunlifestadium': 'Hard Rock Stadium',
              'landsharkstadium': 'Hard Rock Stadium',
              'lpfield': 'Nissan Stadium',
          }

          def compare_venue(provider, scheduled):
              left = normalize(provider)
              right = normalize(scheduled)
              if left and left == right:
                  return 'exact'
              if left and right and (left in right or right in left):
                  return 'same_place_noncanonical'
              if any(left in group and right in group for group in equivalent_groups):
                  return 'same_place_noncanonical'
              if left in legacy_groups and normalize(legacy_groups[left]) == right:
                  return 'legacy_name'
              return 'mismatch'

          audited = []
          for row in stored:
              stored_time = datetime.fromisoformat(row['event_date']).astimezone(timezone.utc)
              title_normalized = row['title'].casefold()
              candidates = []
              for game in schedule:
                  if game['away_team'].casefold() not in title_normalized:
                      continue
                  if game['home_team'].casefold() not in title_normalized:
                      continue
                  difference = abs((game['event_date'] - stored_time).total_seconds())
                  if difference <= 36 * 3600:
                      candidates.append((difference, game))
              candidates.sort(key=lambda item: item[0])
              if not candidates:
                  audited.append(
                      {
                          **row,
                          'audit_status': 'unmatched_schedule',
                          'schedule_id': None,
                          'schedule_venue': None,
                          'schedule_home_team': None,
                          'schedule_away_team': None,
                          'kickoff_difference_minutes': None,
                      }
                  )
                  continue

              difference, game = candidates[0]
              audited.append(
                  {
                      **row,
                      'audit_status': compare_venue(row['venue'], game['venue']),
                      'schedule_id': game['schedule_id'],
                      'schedule_venue': game['venue'],
                      'schedule_home_team': game['home_team'],
                      'schedule_away_team': game['away_team'],
                      'schedule_city': game['city'],
                      'schedule_state': game['state'],
                      'kickoff_difference_minutes': round(difference / 60, 1),
                      'home_team_bucket_matches_schedule': (
                          row['home_team_bucket'] == game['home_team']
                      ),
                  }
              )

          counts = defaultdict(int)
          for row in audited:
              counts[row['audit_status']] += 1

          unique_pairs = {}
          for row in audited:
              key = (
                  row.get('schedule_home_team') or row.get('home_team_bucket') or '',
                  row.get('venue') or '',
                  row.get('schedule_venue') or '',
                  row.get('audit_status') or '',
              )
              unique_pairs[key] = {
                  'home_team': row.get('schedule_home_team') or row.get('home_team_bucket'),
                  'provider_venue': row.get('venue'),
                  'schedule_venue': row.get('schedule_venue'),
                  'audit_status': row.get('audit_status'),
              }

          shared = defaultdict(set)
          for row in audited:
              if row.get('schedule_venue') and row.get('schedule_home_team'):
                  shared[row['schedule_venue']].add(row['schedule_home_team'])

          bucket_mismatches = [
              row for row in audited
              if row.get('home_team_bucket_matches_schedule') is False
          ]
          report = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'production_source': f'{BASE_URL}/nfl and /nfl/map',
              'schedule_source': schedule_url,
              'stored_event_count': len(stored),
              'schedule_event_count_in_query': len(schedule),
              'status_counts': dict(sorted(counts.items())),
              'all_map_pages_readable': not page_errors,
              'all_schedule_matched': counts.get('unmatched_schedule', 0) == 0,
              'all_same_physical_venue': (
                  counts.get('mismatch', 0) == 0
                  and counts.get('unmatched_schedule', 0) == 0
              ),
              'canonical_name_issues': (
                  counts.get('same_place_noncanonical', 0)
                  + counts.get('legacy_name', 0)
              ),
              'home_team_bucket_mismatch_count': len(bucket_mismatches),
              'unique_venue_pairs': sorted(
                  unique_pairs.values(),
                  key=lambda item: (
                      item.get('home_team') or '',
                      item.get('provider_venue') or '',
                  ),
              ),
              'shared_schedule_venues': {
                  venue: sorted(teams)
                  for venue, teams in sorted(shared.items())
                  if len(teams) > 1
              },
              'events': audited,
          }
          Path('nfl_venue_audit.json').write_text(
              json.dumps(report, indent=2) + '\n',
              encoding='utf-8',
          )

          lines = [
              '# Production NFL venue audit',
              '',
              f"Generated: {report['generated_at']}",
              f"Publicly tracked events: {report['stored_event_count']}",
              f"Status counts: {report['status_counts']}",
              f"All events matched to schedule: {report['all_schedule_matched']}",
              f"All events use the same physical venue as schedule: {report['all_same_physical_venue']}",
              f"Home-team grouping mismatches: {report['home_team_bucket_mismatch_count']}",
              '',
              '| Home team | Website/Vivid venue | Schedule venue | Result |',
              '|---|---|---|---|',
          ]
          for item in report['unique_venue_pairs']:
              lines.append(
                  f"| {item.get('home_team') or 'Unmatched'} | "
                  f"{item.get('provider_venue') or ''} | "
                  f"{item.get('schedule_venue') or ''} | "
                  f"{item.get('audit_status') or ''} |"
              )
          Path('nfl_venue_audit.md').write_text('\n'.join(lines) + '\n')

          print(json.dumps(report['status_counts'], indent=2))
          print(f"Home-team grouping mismatches: {len(bucket_mismatches)}")
          if not report['all_same_physical_venue'] or bucket_mismatches:
              raise SystemExit('One or more production NFL venue assignments failed validation.')
          PY

      - name: Upload venue audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nfl-venue-audit-${{ github.run_id }}
          path: |
            production_nfl_events.json
            nfl_venue_audit.json
            nfl_venue_audit.md
          if-no-files-found: error
          retention-days: 14
