name: Export section-detail working copy

on:
  push:
    branches:
      - feature/section-detail-insights
    paths:
      - ".github/workflows/export-working-copy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/section-detail-insights

      - name: Remove Git metadata
        run: rm -rf .git

      - uses: actions/upload-artifact@v4
        with:
          name: ticketprice-working-copy
          path: .
          include-hidden-files: true
          retention-days: 1
