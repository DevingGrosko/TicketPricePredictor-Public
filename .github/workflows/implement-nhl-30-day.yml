              <div><span>01</span><strong>Seven-day window</strong><small>Collection begins up to 168 hours before puck drop.</small></div>
              <div><span>02</span><strong>Focused cadence</strong><small>Every six hours, then hourly throughout the final 72 hours.</small></div>
              <div><span>03</span><strong>Conservative compaction</strong><small>After 14 days, final-day hourly detail stays; older hours are sampled at 3h and 6h intervals.</small></div>
            </section>''',
