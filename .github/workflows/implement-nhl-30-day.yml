              '''        <div class="nfl-feature-list">
                  <div><span>168h</span><p><strong>Full seven-day window</strong><small>Early market through the final countdown.</small></p></div>
                  <div><span>6→1h</span><p><strong>Adaptive snapshots</strong><small>Hourly detail during the final 72 hours.</small></p></div>
                  <div><span>14D</span><p><strong>Review before compaction</strong><small>Raw snapshots remain untouched for two weeks after the game.</small></p></div>
