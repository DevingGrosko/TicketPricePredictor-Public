      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate implementation
        env:
          DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/baseball.db
          CONCERT_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/concerts.db
          NFL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nfl.db
          NHL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nhl.db
          FLASK_SECRET_KEY: deployment-validation-key
          COLLECTOR_INGEST_TOKEN: deployment-validation-token
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          python -m py_compile \
            nhl_collector.py \
            nhl_schedule_collector.py \
            Flask_App/nhl_blueprint.py \
            tests/test_nhl_collector.py \
            tests/test_nhl_schedule_collector.py \
            tests/test_nhl_blueprint.py \
            tests/test_nhl_empty_schedule.py
          node --check Flask_App/static/js/nhl.js
          node --check Flask_App/static/js/nhl-graph.js
          node --check Flask_App/static/js/nhl-map.js
          python -m unittest discover -s tests -v

      - name: Commit the 30-day NHL cadence
        run: |
          rm .github/workflows/implement-nhl-30-day.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extend NHL tracking to a 30-day tiered cadence"
          git push origin HEAD:feature/nhl-30-day-tiered-cadence
