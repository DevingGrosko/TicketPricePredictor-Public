name: Export current MySQL cutover branch

on:
  push:
    branches:
      - feature/mysql-cutover
    paths:
      - ".github/workflows/export-mysql-cutover-branch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mysql-cutover
      - name: Package source
        run: tar --exclude=.git -czf "$RUNNER_TEMP/mysql-cutover-branch.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: mysql-cutover-branch-source
          path: ${{ runner.temp }}/mysql-cutover-branch.tar.gz
          retention-days: 1
