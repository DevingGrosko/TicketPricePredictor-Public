name: Public GitHub Pages acceptance
on:
  push:
    branches: [feature/free-half-hour-publication]
    paths:
      - .github/workflows/free-pages-public-check.yml
      - tools/check_public_pages.py
permissions:
  contents: read
concurrency:
  group: ticketsignal-public-pages-acceptance
  cancel-in-progress: true
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m py_compile tools/check_public_pages.py
      - run: python -m pip install --disable-pip-version-check 'selenium==4.26.1'
      - name: Wait for the first public Pages manifest with a fixed request budget
        run: |
          python -u - <<'PY'
          import json,time,urllib.error
          from urllib.request import Request,build_opener
          from tools.check_public_pages import fixed_url,Redirects
          opener=build_opener(Redirects())
          for attempt in range(16):
              try:
                  with opener.open(Request(fixed_url('/original-manifest.json'),headers={'Cache-Control':'no-cache'}),timeout=15) as response:
                      manifest=json.loads(response.read(65536))
                  assert manifest.get('publication_host')=='github-pages'
                  print('Public GitHub Pages manifest is available.');break
              except urllib.error.HTTPError as error:
                  if error.code not in (404,502,503,504):raise
              except urllib.error.URLError:
                  pass
              if attempt==15:raise RuntimeError('Public deployment did not become ready within the test window')
              time.sleep(15)
          PY
      - name: Exercise original UI and compare charts with actual published observations
        run: python -u -m tools.check_public_pages
      - name: Attach compact acceptance result to the job summary
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          file=Path('public-pages-result.json')
          if file.exists():
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:
                  output.write('## Public Pages result\n```json\n'+file.read_text()+'\n```\n')
          PY
