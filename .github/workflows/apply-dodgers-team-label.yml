name: Apply Dodgers team label fix

on:
  push:
    branches:
      - fix/dodgers-team-label
    paths:
      - ".github/workflows/apply-dodgers-team-label.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dodgers-team-label
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply venue-label fix
        run: |
          python - <<'PY'
          from pathlib import Path

          blueprint_path = Path("Flask_App/nfl_stadium_blueprint.py")
          blueprint = blueprint_path.read_text()

          mapping_old = '    "dodger stadium": "Los Angeles Dodgers",\n'
          mapping_new = (
              '    "dodger stadium": "Los Angeles Dodgers",\n'
              '    "dodgers stadium": "Los Angeles Dodgers",\n'
          )
          if mapping_old not in blueprint:
              raise SystemExit("Dodger Stadium mapping anchor not found")
          blueprint = blueprint.replace(mapping_old, mapping_new, 1)

          function_old = '''def mlb_team_for_venue(venue: Any) -> str:\n    return _MLB_VENUE_TEAMS.get(_normalize(venue), "MLB home team")\n'''
          function_new = '''def _mapped_mlb_team_for_venue(venue: Any) -> str | None:\n    normalized = _normalize(venue)\n    if not normalized:\n        return None\n\n    mapped = _MLB_VENUE_TEAMS.get(normalized)\n    if mapped:\n        return mapped\n\n    # Provider venue metadata sometimes appends a city/state suffix. Match a\n    # known stadium at either edge without accepting arbitrary partial words.\n    for venue_name, team in _MLB_VENUE_TEAMS.items():\n        if normalized.startswith(f"{venue_name} ") or normalized.endswith(\n            f" {venue_name}"\n        ):\n            return team\n    return None\n\n\ndef mlb_team_for_venue(venue: Any) -> str:\n    return _mapped_mlb_team_for_venue(venue) or "MLB home team"\n'''
          if function_old not in blueprint:
              raise SystemExit("MLB venue helper anchor not found")
          blueprint = blueprint.replace(function_old, function_new, 1)

          event_lookup_old = '    mapped = _MLB_VENUE_TEAMS.get(_normalize(getattr(event, "Place", "")))\n'
          event_lookup_new = '    mapped = _mapped_mlb_team_for_venue(getattr(event, "Place", ""))\n'
          if event_lookup_old not in blueprint:
              raise SystemExit("MLB event venue lookup anchor not found")
          blueprint = blueprint.replace(event_lookup_old, event_lookup_new, 1)
          blueprint_path.write_text(blueprint)

          tests_path = Path("tests/test_multi_sport_venue_insights.py")
          tests = tests_path.read_text()
          assertions_old = '''        self.assertEqual(mlb_team_for_venue("Nationals Park"), "Washington Nationals")\n        self.assertEqual(mlb_event_home_team(event), "Washington Nationals")\n'''
          assertions_new = '''        self.assertEqual(mlb_team_for_venue("Nationals Park"), "Washington Nationals")\n        self.assertEqual(mlb_event_home_team(event), "Washington Nationals")\n        self.assertEqual(mlb_team_for_venue("Dodgers Stadium"), "Los Angeles Dodgers")\n        self.assertEqual(\n            mlb_team_for_venue("Dodger Stadium, Los Angeles, CA"),\n            "Los Angeles Dodgers",\n        )\n\n        dodgers_event = Event(\n            title="Provider event without a parseable matchup",\n            event_date=datetime(2026, 9, 1),\n            event_sections=[],\n            URL="https://example.com/--sports-mlb-baseball/production/2",\n            Place="Dodgers Stadium",\n        )\n        self.assertEqual(mlb_event_home_team(dodgers_event), "Los Angeles Dodgers")\n'''
          if assertions_old not in tests:
              raise SystemExit("MLB venue test anchor not found")
          tests_path.write_text(tests.replace(assertions_old, assertions_new, 1))
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate fix
        env:
          DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/baseball.db
          CONCERT_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/concerts.db
          NFL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nfl.db
          NHL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nhl.db
          FLASK_SECRET_KEY: deployment-validation-key
          COLLECTOR_INGEST_TOKEN: deployment-validation-token
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          python -m py_compile Flask_App/nfl_stadium_blueprint.py tests/test_multi_sport_venue_insights.py
          python -m unittest tests.test_multi_sport_venue_insights.MLBVenueInsightTests -v
          python -m unittest discover -s tests -v

      - name: Commit fix
        run: |
          rm -f .github/workflows/apply-dodgers-team-label.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Resolve Dodgers stadium team labels"
          git push origin HEAD:fix/dodgers-team-label
