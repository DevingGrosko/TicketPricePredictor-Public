name: Complete materialized analytics backfill

on:
  push:
    branches:
      - ops/complete-materialized-backfill
    paths:
      - ".github/workflows/complete-materialized-backfill.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: complete-materialized-backfill
  cancel-in-progress: false

jobs:
  backfill:
    strategy:
      fail-fast: false
      matrix:
        sport: [mlb, nfl, nhl]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Backfill ${{ matrix.sport }} one event at a time
        env:
          COLLECTOR_INGEST_TOKEN: ${{ secrets.COLLECTOR_INGEST_TOKEN }}
          SPORT: ${{ matrix.sport }}
        shell: bash
        run: |
          set -u
          base="https://bunnyjeff.pythonanywhere.com"
          consecutive_failures=0

          for batch in $(seq 1 2000); do
            response_file="$(mktemp)"
            status="$(
              curl -sS --max-time 900 \
                -o "$response_file" \
                -w '%{http_code}' \
                -X POST \
                -H "Authorization: Bearer $COLLECTOR_INGEST_TOKEN" \
                -H 'Content-Type: application/json' \
                -d "{\"sport\":\"$SPORT\",\"limit\":1}" \
                "$base/api/analytics/backfill" || true
            )"
            response="$(cat "$response_file")"
            rm -f "$response_file"
            echo "$SPORT batch $batch: HTTP $status $response"

            if [[ "$status" == "200" ]]; then
              consecutive_failures=0
              complete="$(
                python -c 'import json,sys; print(1 if json.load(sys.stdin).get("complete") else 0)' <<< "$response"
              )"
              if [[ "$complete" == "1" ]]; then
                echo "$SPORT materialized backfill is complete."
                exit 0
              fi
              continue
            fi

            if [[ "$status" == "409" || "$status" == "000" ]]; then
              echo "$SPORT maintenance is busy or the request timed out; waiting before retry."
              sleep 30
              continue
            fi

            consecutive_failures=$((consecutive_failures + 1))
            if (( consecutive_failures >= 5 )); then
              echo "$SPORT backfill failed five consecutive times." >&2
              exit 1
            fi
            sleep 20
          done

          echo "$SPORT backfill did not complete within 2000 batches." >&2
          exit 1
