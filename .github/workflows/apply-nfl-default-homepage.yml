name: Apply NFL default homepage

on:
  push:
    branches:
      - feature/nfl-default-homepage
    paths:
      - "apply_nfl_default_homepage.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/nfl-default-homepage
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply homepage routing patch
        run: python apply_nfl_default_homepage.py
      - name: Validate application
        run: |
          python -m py_compile Flask_App/flask_app.py Flask_App/nfl_blueprint.py
          python -m unittest discover -s tests -v
      - name: Commit implementation
        run: |
          rm -f apply_nfl_default_homepage.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make NFL tracker the default homepage"
          git push origin HEAD:feature/nfl-default-homepage
