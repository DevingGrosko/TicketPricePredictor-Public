name: TiDB staging connection check

# This file is intentionally present only on the staging branch.
# No schedule, production deployment, collector, import, or migration is invoked.
on:
  push:
    branches:
      - staging/tidb-free-hosting-2026-09-20
    paths:
      - .github/workflows/tidb-staging-check.yml
      - Flask_App/tidb_staging.py
      - Flask_App/tidb_staging_check.py
      - tests/test_tidb_staging.py
      - tests/test_tidb_staging_check.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tidb-staging-connectivity-check
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.repository == 'DevingGrosko/TicketPricePredictor-Public' &&
      github.ref == 'refs/heads/staging/tidb-free-hosting-2026-09-20'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: tidb-staging
    steps:
      - name: Check out the exact staging commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install only connection-test dependencies
        run: python -m pip install --disable-pip-version-check 'SQLAlchemy>=2,<3' 'PyMySQL>=1.1.1,<2'

      - name: Run isolated offline tests without database credentials
        run: python -m unittest discover -s tests -p 'test_tidb_staging*.py' -v

      - name: Read-only TiDB connectivity and empty-schema check
        id: connection_check
        env:
          TIDB_STAGING_HOST: ${{ secrets.TIDB_STAGING_HOST }}
          TIDB_STAGING_USERNAME: ${{ secrets.TIDB_STAGING_USERNAME }}
          TIDB_STAGING_PASSWORD: ${{ secrets.TIDB_STAGING_PASSWORD }}
        run: python -m Flask_App.tidb_staging_check

      - name: Diagnose missing schemas without creating or changing anything
        if: failure() && steps.connection_check.outcome == 'failure'
        env:
          TIDB_STAGING_HOST: ${{ secrets.TIDB_STAGING_HOST }}
          TIDB_STAGING_USERNAME: ${{ secrets.TIDB_STAGING_USERNAME }}
          TIDB_STAGING_PASSWORD: ${{ secrets.TIDB_STAGING_PASSWORD }}
        run: |
          python - <<'PYCODE'
          import json
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import URL
          from sqlalchemy.pool import NullPool
          from Flask_App.tidb_staging import SCHEMAS, StagingTiDBConfig
          from Flask_App.tidb_staging_check import CheckFailed, safe_diagnostic

          engine = None
          try:
              config = StagingTiDBConfig.from_environment()
              # Connect without selecting a database, only to inspect schema names.
              # Credentials and host still come exclusively from validated staging settings.
              url = URL.create('mysql+pymysql', host=config.host, port=4000,
                               username=config.username, password=config.password,
                               query={'charset': 'utf8mb4'})
              engine = create_engine(url, poolclass=NullPool, hide_parameters=True,
                                     connect_args={'ssl': config.tls_context(),
                                                   'connect_timeout': 10,
                                                   'read_timeout': 15,
                                                   'write_timeout': 15})
              with engine.connect() as connection:
                  version = connection.execute(text('SELECT VERSION()')).scalar_one()
                  if 'tidb' not in str(version).lower():
                      raise CheckFailed('wrong_server')
                  names = [row[0] for row in connection.execute(text(
                      "SELECT SCHEMA_NAME FROM information_schema.SCHEMATA "
                      "WHERE SCHEMA_NAME LIKE 'ticketsignal%' ORDER BY SCHEMA_NAME"))]
              print('Certificate-verified login to TiDB succeeded.')
              print('Visible TicketSignal schema names: ' + json.dumps(names))
              print('Expected staging schemas present: ' + str(len(set(names) & set(SCHEMAS.values()))) + '/3')
              print('Metadata inspection only; nothing was created, imported, or changed.')
          except Exception as error:
              print('Metadata check failed: ' + safe_diagnostic(error))
              raise SystemExit(1)
          finally:
              if engine is not None:
                  engine.dispose()
          PYCODE
