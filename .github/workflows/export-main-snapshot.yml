name: Export main repository snapshot

on:
  push:
    branches:
      - diagnose/page-performance-2026-09-03
    paths:
      - ".github/workflows/export-main-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Package repository
        run: zip -qr "$RUNNER_TEMP/TicketPricePredictor-Public-main.zip" . -x '.git/*'

      - uses: actions/upload-artifact@v7
        with:
          name: TicketPricePredictor-Public-main
          path: ${{ runner.temp }}/TicketPricePredictor-Public-main.zip
          retention-days: 1
