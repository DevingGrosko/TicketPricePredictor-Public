name: Apply persistent venue analytics

on:
  push:
    branches:
      - fix/persistent-venue-analytics
    paths:
      - ".github/workflows/apply-persistent-analytics.yml"
      - ".github/persistent-analytics/patch.b64"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-persistent-venue-analytics
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/persistent-venue-analytics
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply reviewed analytics patch
        run: |
          base64 -d .github/persistent-analytics/patch.b64 | gzip -d > /tmp/persistent-analytics.patch
          git apply --check /tmp/persistent-analytics.patch
          git apply /tmp/persistent-analytics.patch
          git diff --check

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate application and tests
        env:
          DATABASE_PATH: ${{ runner.temp }}/materialized/baseball.db
          CONCERT_DATABASE_PATH: ${{ runner.temp }}/materialized/concerts.db
          NFL_DATABASE_PATH: ${{ runner.temp }}/materialized/nfl.db
          NHL_DATABASE_PATH: ${{ runner.temp }}/materialized/nhl.db
          FLASK_SECRET_KEY: materialized-validation
          COLLECTOR_INGEST_TOKEN: materialized-token
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          python -m py_compile \
            models.py \
            graph_builder.py \
            Flask_App/flask_app.py \
            Flask_App/analytics_summary.py \
            Flask_App/performance_cache.py \
            Flask_App/nfl_blueprint.py \
            Flask_App/section_canonicalization.py \
            Flask_App/nfl_stadium_blueprint.py \
            Flask_App/nhl_blueprint.py
          node --check Flask_App/static/js/script.js
          node --check Flask_App/static/js/nfl.js
          node --check Flask_App/static/js/nhl.js
          python -m unittest discover -s tests -v

      - name: Commit validated application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/deploy-pythonanywhere.yml \
            Flask_App/analytics_summary.py \
            Flask_App/flask_app.py \
            Flask_App/nfl_blueprint.py \
            Flask_App/nfl_stadium_blueprint.py \
            Flask_App/nhl_blueprint.py \
            Flask_App/performance_cache.py \
            tests/test_materialized_analytics.py
          git commit -m "Materialize venue analytics for fast cold loads"
          git push origin HEAD:fix/persistent-venue-analytics
