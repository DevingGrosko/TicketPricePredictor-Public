name: Free refresh bounded rehearsal
on:
  push:
    branches: [feature/free-half-hour-publication]
    paths: [.github/workflows/free-refresh-rehearsal.yml]
permissions:
  contents: read
concurrency:
  group: free-refresh-bounded-rehearsal
  cancel-in-progress: false
jobs:
  unit:
    if: github.repository == 'DevingGrosko/TicketPricePredictor-Public' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r requirements-staging.txt
      - run: python -m unittest discover -s tests -p 'test_free_refresh*.py' -v
  capture:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: tidb-staging
    concurrency:
      group: free-refresh-staging-mlb-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r requirements-staging.txt
      - name: Capture exactly one real MLB game into TiDB staging and check idempotency
        env:
          TICKETSIGNAL_STAGING_SITE: '1'
          TICKETSIGNAL_ENABLE_STAGING_WRITES: '1'
          TIDB_STAGING_HOST: ${{ secrets.TIDB_STAGING_HOST }}
          TIDB_STAGING_USERNAME: ${{ secrets.TIDB_STAGING_USERNAME }}
          TIDB_STAGING_PASSWORD: ${{ secrets.TIDB_STAGING_PASSWORD }}
        run: python -u -m tools.free_refresh_capture --sport mlb --smoke --directory free-capture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: free-refresh-one-capture-report
          path: free-capture/smoke-report.json
          retention-days: 1
          if-no-files-found: warn
