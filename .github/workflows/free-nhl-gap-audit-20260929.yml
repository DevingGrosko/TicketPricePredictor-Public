name: Free NHL unresolved-game audit
on:
  push:
    branches: [feature/free-half-hour-publication]
    paths: [.github/workflows/free-nhl-gap-audit-20260929.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 6be41c6a82ba8161784cb005f1974d82e5498f7d
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r requirements-staging.txt
      - name: Read official game and trace exact provider candidate rejection
        run: |
          python -u - <<'PY'
          import json,time
          from datetime import datetime,timezone
          from dataclasses import asdict
          from unittest.mock import patch
          import nhl_schedule_collector as nhl
          from tools.free_live_map_cache import cached_map_matching
          target='2026020182'
          def emit(label,data):
              print(label+' '+json.dumps(data,default=str),flush=True)
          now=datetime.now(timezone.utc)
          emit('AUDIT_TIME',now)
          schedule,sources=nhl.fetch_schedule_games(now)
          matches=[g for g in schedule if str(g.schedule_id)==target]
          emit('OFFICIAL_SOURCES',sources)
          emit('TARGET_SCHEDULE',[asdict(g) for g in matches])
          try:
              landing=nhl.fetch_json('https://api-web.nhle.com/v1/gamecenter/'+target+'/landing')
              emit('TARGET_LANDING',{k:landing.get(k) for k in ('id','season','gameType','gameDate','startTimeUTC','venue','venueTimezone','neutralSite','gameState','awayTeam','homeTeam','ticketsLink')})
          except Exception as exc:
              emit('LANDING_ERROR',{'type':type(exc).__name__,'message':str(exc)[:500]})
          if len(matches)!=1:
              raise SystemExit('Target is no longer uniquely present in the live capture window')
          game=matches[0]
          feed,warnings=nhl.discover_nhl_games(True,35)
          emit('FEED_COUNTS',{'rows':len(feed),'warnings':warnings})
          emit('FEED_MATCHUP_ROWS',[asdict(r) for r in feed if set(nhl.ordered_matchup_from_title(r.title) or ())==set(game.matchup_key)])
          original_extract=nhl.extract_nhl_game_rows
          seen=set()
          def traced_extract(text,url,stamp):
              rows=original_extract(text,url,stamp)
              for row in rows:
                  if row.url in seen:continue
                  seen.add(row.url)
                  emit('SEARCH_PARSED_ROW',{**asdict(row),'query_url':url,'ordered_teams':nhl.ordered_matchup_from_title(row.title),'accepted':bool(nhl.candidates_for_schedule_game(game,[row]))})
              return rows
          with patch.object(nhl,'extract_nhl_game_rows',traced_extract):
              resolutions,errors=nhl.resolve_schedule_games([game],feed,headless=True,timeout=35)
          emit('RESOLUTIONS',[asdict(r) for r in resolutions]);emit('SEARCH_ERRORS',errors)
          browser=nhl.VividNFLBrowser(headless=True,timeout=35)
          try:
              from urllib.parse import quote_plus
              query=game.away_team+' '+game.home_team
              url='https://www.vividseats.com/search?searchTerm='+quote_plus(query)
              nhl._load_search_page(browser,url);time.sleep(5)
              emit('SEARCH_PAGE',{'url':browser.driver.current_url,'title':browser.driver.title,'body_prefix':browser.driver.find_element('tag name','body').text[:1500]})
              links=browser.driver.execute_script('return [...document.querySelectorAll("a[href]")].filter(a=>a.href.includes("/production/")).map(a=>({url:a.href,text:a.textContent,label:a.getAttribute("aria-label")}));')
              emit('RAW_SEARCH_LINKS',links[:60])
          finally:browser.close()
          if resolutions and resolutions[0].candidates:
              with cached_map_matching():
                  url,at,snapshot=nhl._capture_resolution(resolutions[0],headless=True,timeout=35)
              emit('READ_ONLY_CAPTURE',{'url':url,'event_at':at,'title':snapshot.title,'venue':snapshot.venue,'sections':len(snapshot.sections)})
          emit('AUDIT_COMPLETE',{'database_access':False,'database_writes':0,'production_changes':False})
          PY
