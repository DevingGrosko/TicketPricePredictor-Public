name: Patch NFL provider-gap notifications

on:
  push:
    branches:
      - fix/nfl-expected-provider-gaps
    paths:
      - ".github/workflows/patch-nfl-provider-gap-notifications.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/nfl-expected-provider-gaps
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply provider-gap classification
        run: python .github/scripts/patch_nfl_provider_gap_notifications.py

      - name: Compile transformed files
        run: |
          python -m py_compile nfl_schedule_collector.py tests/test_nfl_schedule_collector.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run complete test suite
        run: python -m unittest discover -s tests -v

      - name: Commit the notification fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_schedule_collector.py tests/test_nfl_schedule_collector.py
          git commit -m "Treat unresolved non-US NFL games as known provider gaps"
          git push origin HEAD:fix/nfl-expected-provider-gaps
