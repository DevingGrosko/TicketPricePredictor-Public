name: Patch NFL provider-gap notifications

on:
  push:
    branches:
      - fix/nfl-expected-provider-gaps
    paths:
      - ".github/workflows/patch-nfl-provider-gap-notifications.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/nfl-expected-provider-gaps
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Classify expected non-US Vivid coverage gaps
        run: |
          python - <<'PY'
          from pathlib import Path

          collector = Path("nfl_schedule_collector.py")
          source = collector.read_text(encoding="utf-8")

          helper_marker = "JsonFetcher = Callable[[str, int], dict[str, Any]]\n"
          helper_block = '''JsonFetcher = Callable[[str, int], dict[str, Any]]


_US_COUNTRY_MARKERS = frozenset(
    {
        "us",
        "usa",
        "united states",
        "united states of america",
    }
)


def is_expected_vivid_provider_gap(game: ScheduledNFLGame) -> bool:
    """Return whether an unresolved game is outside Vivid's normal US coverage.

    We still attempt to resolve and capture every game. This classification is
    used only after Vivid returns no candidate, so non-US games remain visible
    in the health report without turning an otherwise successful hourly run red.
    """
    country = " ".join(str(game.country or "").split()).casefold().replace(".", "")
    return bool(country) and country not in _US_COUNTRY_MARKERS


def _schedule_collection_exit_code(
    expected: int,
    captured: int,
    expected_provider_gap_count: int,
    feed_errors: list[str],
    actionable_search_errors: list[str],
) -> int:
    actionable_expected = max(0, expected - expected_provider_gap_count)
    if captured < actionable_expected:
        return 1
    if feed_errors or actionable_search_errors:
        return 1
    return 0
'''
          if source.count(helper_marker) != 1:
              raise SystemExit(
                  f"Expected one JsonFetcher marker, found {source.count(helper_marker)}"
              )
          source = source.replace(helper_marker, helper_block, 1)

          start_marker = '    pending_count = len(list(pending_dir.glob("*.json")))\n'
          end_marker = '\n\n\ndef run_schedule_smoke('
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate the NFL collection result block")

          result_block = '''    pending_count = len(list(pending_dir.glob("*.json")))
    expected = len(due_schedule)
    coverage = 100.0 if expected == 0 else round(captured / expected * 100, 2)

    expected_gap_names = {
        resolution.game.name
        for resolution in resolutions
        if is_expected_vivid_provider_gap(resolution.game)
    }
    expected_gap_search_errors = [
        error
        for error in search_errors
        if any(error.startswith(f"{name}:") for name in expected_gap_names)
    ]
    actionable_search_errors = [
        error for error in search_errors if error not in expected_gap_search_errors
    ]

    # Split unresolved games only after all feed/search attempts have finished.
    expected_provider_gaps: list[str] = []
    actionable_unresolved: list[str] = []
    unresolved_by_matchup = {
        (
            resolution.game.away_team,
            resolution.game.home_team,
            eastern_iso(resolution.game.event_date),
        ): resolution.game
        for resolution in resolutions
        if not resolution.candidates
    }
    for message in unresolved:
        matched_game = next(
            (
                game
                for (away, home, event_date), game in unresolved_by_matchup.items()
                if message.startswith(f"{away} at {home} ({event_date})")
            ),
            None,
        )
        if matched_game is not None and is_expected_vivid_provider_gap(matched_game):
            expected_provider_gaps.append(message)
        else:
            actionable_unresolved.append(message)
    unresolved = actionable_unresolved

    provider_supported_expected = max(0, expected - len(expected_provider_gaps))
    provider_supported_coverage = (
        100.0
        if provider_supported_expected == 0
        else round(captured / provider_supported_expected * 100, 2)
    )
    all_errors = feed_errors + search_errors + capture_errors + queue_errors
    if unresolved or capture_errors or feed_errors or actionable_search_errors:
        status = "degraded"
    elif expected_provider_gaps or expected_gap_search_errors:
        status = "known-provider-gap"
    elif pending_count:
        status = "queued"
    else:
        status = "healthy"

    report = {
        "status": status,
        "event_type": "nfl",
        "coverage_mode": "schedule-backed",
        "schedule_status": "available",
        "schedule_source": schedule_source,
        "timezone": "America/New_York",
        "started_at": eastern_iso(started_at),
        "capture_slot": eastern_iso(capture_slot),
        "capture_window_hours": NFL_CAPTURE_WINDOW_HOURS,
        "cadence_policy": {
            "days_15_to_30_hours": 6,
            "days_8_to_14_hours": 3,
            "final_7_days_hours": 1,
            "staggering": "deterministic per schedule ID",
        },
        "scheduled_in_window": len(schedule),
        "scheduled_due": expected,
        "skipped_by_cadence": len(schedule) - expected,
        "cadence_tiers": cadence_summary,
        "feed_discovered": len(feed_rows),
        "matched_from_feed": matched_from_feed,
        "recovered_from_search": recovered_from_search,
        "unresolved_count": len(unresolved),
        "unresolved": unresolved,
        "known_provider_gap_count": len(expected_provider_gaps),
        "known_provider_gaps": expected_provider_gaps,
        "coverage_percent": coverage,
        "provider_supported_due": provider_supported_expected,
        "provider_supported_coverage_percent": provider_supported_coverage,
        "captured": captured,
        "uploaded": uploaded,
        "queued": queued,
        "replayed": replayed,
        "pending": pending_count,
        "failed": len(capture_errors),
        "uploads": uploads,
        "errors": all_errors,
        "actionable_search_errors": actionable_search_errors,
        "known_provider_gap_search_errors": expected_gap_search_errors,
    }
    _write_health(health_output, report)
    print(
        "NFL schedule-backed collection finished: "
        f"{captured}/{expected} due games captured ({coverage:.2f}% total; "
        f"{provider_supported_coverage:.2f}% of provider-supported games); "
        f"{len(schedule)} games remain inside the 30-day window, "
        f"{recovered_from_search} recovered through search, "
        f"{len(expected_provider_gaps)} known provider gaps, "
        f"{len(unresolved)} actionable unresolved, {queued} queued, "
        f"{replayed} replayed.",
        flush=True,
    )

    return _schedule_collection_exit_code(
        expected,
        captured,
        len(expected_provider_gaps),
        feed_errors,
        actionable_search_errors,
    )
'''
          source = source[:start] + result_block + source[end:]
          collector.write_text(source, encoding="utf-8")

          tests = Path("tests/test_nfl_schedule_collector.py")
          test_source = tests.read_text(encoding="utf-8")
          import_marker = "    EVENT_TIME_TOLERANCE_HOURS,\n"
          import_replacement = (
              "    EVENT_TIME_TOLERANCE_HOURS,\n"
              "    _schedule_collection_exit_code,\n"
              "    is_expected_vivid_provider_gap,\n"
          )
          if test_source.count(import_marker) != 1:
              raise SystemExit(
                  f"Expected one schedule test import marker, found {test_source.count(import_marker)}"
              )
          test_source = test_source.replace(import_marker, import_replacement, 1)

          test_marker = "\n\nclass NFLVividResolutionTests(unittest.TestCase):\n"
          tests_to_add = '''
    def test_non_us_games_are_expected_vivid_provider_gaps(self):
        foreign_game = ScheduledNFLGame(
            schedule_id="international-australia",
            event_date=datetime(2026, 9, 10, 0, 35, tzinfo=timezone.utc),
            away_team="San Francisco 49ers",
            home_team="Los Angeles Rams",
            venue="Melbourne Cricket Ground",
            name="San Francisco 49ers at Los Angeles Rams",
            city="Melbourne",
            country="Australia",
            neutral_site=True,
        )
        domestic_game = ScheduledNFLGame(
            schedule_id="domestic",
            event_date=datetime(2026, 9, 13, 17, tzinfo=timezone.utc),
            away_team="Buffalo Bills",
            home_team="Houston Texans",
            venue="Reliant Stadium",
            name="Buffalo Bills at Houston Texans",
            city="Houston",
            country="USA",
        )

        self.assertTrue(is_expected_vivid_provider_gap(foreign_game))
        self.assertFalse(is_expected_vivid_provider_gap(domestic_game))

    def test_expected_provider_gap_does_not_fail_successful_domestic_collection(self):
        self.assertEqual(
            _schedule_collection_exit_code(15, 14, 1, [], []),
            0,
        )
        self.assertEqual(
            _schedule_collection_exit_code(12, 11, 0, [], []),
            1,
        )
        self.assertEqual(
            _schedule_collection_exit_code(
                15,
                14,
                1,
                [],
                ["Domestic game: Vivid search failed"],
            ),
            1,
        )
'''
          if test_source.count(test_marker) != 1:
              raise SystemExit(
                  f"Expected one schedule test class marker, found {test_source.count(test_marker)}"
              )
          test_source = test_source.replace(test_marker, tests_to_add + test_marker, 1)
          tests.write_text(test_source, encoding="utf-8")
          PY

      - name: Compile transformed files
        run: |
          python -m py_compile nfl_schedule_collector.py tests/test_nfl_schedule_collector.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run complete test suite
        run: python -m unittest discover -s tests -v

      - name: Commit the notification fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_schedule_collector.py tests/test_nfl_schedule_collector.py
          git commit -m "Treat unresolved non-US NFL games as known provider gaps"
          git push origin HEAD:fix/nfl-expected-provider-gaps
