name: NFL collector smoke test

on:
  pull_request:
    branches:
      - main
    paths:
      - "nfl_collector.py"
      - "nfl_schedule_collector.py"
      - "nfl_metadata.py"
      - "collector.py"
      - "Flask_App/nfl_blueprint.py"
      - "Flask_App/static/js/nfl-map.js"
      - "Flask_App/templates/nfl_map.html"
      - "tests/test_nfl_collector.py"
      - "tests/test_nfl_schedule_collector.py"
      - "tests/test_nfl_metadata_enhancements.py"
      - ".github/workflows/nfl-smoke-test.yml"
  workflow_dispatch:
    inputs:
      event_url:
        description: Optional Vivid Seats NFL event URL
        required: false
        default: ""

permissions:
  contents: read

jobs:
  capture-nfl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install collector dependencies
        run: python -m pip install "selenium>=4.26.1,<5" "SQLAlchemy>=2,<3"

      - name: Show browser versions
        run: |
          google-chrome --version || chromium --version || true
          chromedriver --version || true

      - name: Validate the complete 30-day NFL schedule source
        run: |
          python nfl_schedule_collector.py schedule \
            --horizon-hours 720 \
            > nfl_schedule_result.json

      - name: Capture one NFL event without writing to production
        env:
          REQUESTED_EVENT_URL: ${{ inputs.event_url }}
        run: |
          python nfl_collector.py smoke "$REQUESTED_EVENT_URL" \
            --headless \
            --timeout 45 \
            --output nfl_smoke_result.json

      - name: Require usable real section geometry
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          payload = json.loads(
              Path("nfl_smoke_result.json").read_text(encoding="utf-8")
          )
          geometry = payload.get("map_geometry") or {}
          mapped = int(geometry.get("mapped_section_count") or 0)
          known = int(
              geometry.get("known_section_count")
              or payload.get("section_count")
              or 0
          )
          ratio = float(geometry.get("coverage_ratio") or 0)
          shape_count = sum(
              len(row.get("shapes") or [])
              for row in geometry.get("sections") or []
          )
          required = max(4, min(12, math.ceil(known * 0.6)))
          if mapped < required or ratio < 0.6:
              raise SystemExit(
                  "Provider geometry is not usable: "
                  f"{mapped}/{known} sections ({ratio:.1%})"
              )
          if shape_count < mapped:
              raise SystemExit(
                  "Provider geometry has fewer SVG shapes than matched sections: "
                  f"{shape_count} < {mapped}"
              )
          print(
              f"Verified {mapped}/{known} real provider sections "
              f"({ratio:.1%}) across {shape_count} SVG shapes."
          )
          PY

      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nfl-smoke-result-${{ github.run_id }}
          path: |
            nfl_schedule_result.json
            nfl_smoke_result.json
          if-no-files-found: warn
          retention-days: 14
