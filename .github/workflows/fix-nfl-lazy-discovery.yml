name: Fix NFL lazy-loaded discovery

on:
  push:
    branches:
      - feature/switch-concerts-to-nfl-hourly
    paths:
      - "fix_nfl_discovery.ready"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/switch-concerts-to-nfl-hourly
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependency
        run: python -m pip install "SQLAlchemy>=2,<3"

      - name: Keep loading the NFL feed until future games appear
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("nfl_collector.py")
          text = path.read_text(encoding="utf-8")

          old_state = '''        deadline = time.monotonic() + self.timeout\n        best: dict[str, DiscoveredNFLGame] = {}\n        last_new_at: float | None = None\n        while time.monotonic() < deadline:\n            rows = extract_nfl_game_rows(\n'''
          new_state = '''        deadline = time.monotonic() + self.timeout\n        started_at = time.monotonic()\n        last_scroll_at = 0.0\n        best: dict[str, DiscoveredNFLGame] = {}\n        last_new_at: float | None = None\n        while time.monotonic() < deadline:\n            now_monotonic = time.monotonic()\n            if now_monotonic - last_scroll_at >= 1.0:\n                try:\n                    self.driver.execute_script(\n                        "window.scrollTo(0, document.body.scrollHeight);"\n                    )\n                except Exception:\n                    pass\n                last_scroll_at = now_monotonic\n\n            rows = extract_nfl_game_rows(\n'''
          if old_state not in text:
              raise SystemExit("NFL discovery state target was not found")
          text = text.replace(old_state, new_state, 1)

          old_stop = '''            elif best and last_new_at is not None:\n                if time.monotonic() - last_new_at >= DISCOVERY_SETTLE_SECONDS:\n                    return sorted(\n                        best.values(),\n                        key=lambda row: (\n                            row.date_hint or date.max,\n                            row.title.casefold(),\n                            row.url,\n                        ),\n                    )\n            time.sleep(0.5)\n'''
          new_stop = '''            elif best and last_new_at is not None:\n                local_today = (\n                    datetime.now(timezone.utc).astimezone(NEW_YORK).date()\n                )\n                has_future_game = any(\n                    row.date_hint is not None and row.date_hint >= local_today\n                    for row in best.values()\n                )\n                if (\n                    has_future_game\n                    and time.monotonic() - last_new_at\n                    >= max(4.0, DISCOVERY_SETTLE_SECONDS)\n                    and time.monotonic() - started_at >= 6.0\n                ):\n                    return sorted(\n                        best.values(),\n                        key=lambda row: (\n                            row.date_hint or date.max,\n                            row.title.casefold(),\n                            row.url,\n                        ),\n                    )\n            time.sleep(0.5)\n'''
          if old_stop not in text:
              raise SystemExit("NFL discovery stop target was not found")
          text = text.replace(old_stop, new_stop, 1)

          old_report = '''        games = browser.discover_games(NFL_FEED_URL)\n        print(f"NFL feed: discovered {len(games)} game links.", flush=True)\n        return games, []\n'''
          new_report = '''        games = browser.discover_games(NFL_FEED_URL)\n        print(f"NFL feed: discovered {len(games)} game links.", flush=True)\n        for game in games:\n            print(\n                f"NFL DISCOVERED: {game.date_hint or 'unknown'} | "\n                f"{game.title} | {game.url}",\n                flush=True,\n            )\n        return games, []\n'''
          if old_report not in text:
              raise SystemExit("NFL discovery report target was not found")
          path.write_text(text.replace(old_report, new_report, 1), encoding="utf-8")
          PY

          python -m py_compile nfl_collector.py
          python -m unittest discover -s tests -p 'test_nfl_collector.py' -v

      - name: Commit repair and remove temporary workflow
        run: |
          rm -f fix_nfl_discovery.ready .github/workflows/fix-nfl-lazy-discovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Load future NFL games before ending discovery"
          git push origin HEAD:feature/switch-concerts-to-nfl-hourly
