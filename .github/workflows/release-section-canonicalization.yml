name: Release audited section canonicalization

on:
  push:
    branches:
      - feature/section-canonicalization
    paths:
      - ".github/workflows/release-section-canonicalization.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: "65"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/section-canonicalization
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Reduce branch to the reviewed implementation
        run: |
          rm -f tools/apply_section_canonicalization.py
          rmdir tools 2>/dev/null || true

          rm -f .github/workflows/apply-section-canonicalization.yml
          rm -f .github/workflows/verify-section-canonicalization-branch.yml
          rm -f .github/workflows/finalize-section-canonicalization.yml
          rm -f .github/workflows/verify-section-canonicalization-prerequisites.yml
          rm -f .github/workflows/require-clean-canonicalization-pr.yml
          rm -f .github/workflows/cleanup-section-canonicalization-branch.yml
          rm -f .github/workflows/release-section-canonicalization.yml

          rm -f audits/DO_NOT_ADD_MORE_MARKERS.txt
          rm -f audits/last-marker-before-pr.txt
          rm -f audits/pr-next.txt
          rm -f audits/no-more-files.txt
          rm -f audits/why-am-i-doing-this.txt
          rm -f audits/section-canonicalization-ready.txt
          rm -f audits/section-canonicalization-scope.txt
          rm -f audits/final-cleanup-list.txt
          rm -f audits/section-canonicalization-validation.md
          rm -f audits/section-canonicalization-release-notes.md

          test -f Flask_App/section_canonicalization.py
          test -f tests/test_section_canonicalization.py
          test -f audits/section-canonicalization-implementation.md

          git fetch origin main
          cat > /tmp/expected-files.txt <<'EOF'
          .github/workflows/deploy-pythonanywhere.yml
          Flask_App/nfl_stadium_blueprint.py
          Flask_App/section_canonicalization.py
          Flask_App/templates/HomeScreen.html
          Flask_App/templates/NFLHomeScreen.html
          Flask_App/templates/NHLHomeScreen.html
          Flask_App/templates/nfl_stadium.html
          audits/section-canonicalization-implementation.md
          tests/test_section_canonicalization.py
          EOF
          sed -i 's/^          //' /tmp/expected-files.txt
          git diff --name-only origin/main | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git diff --check

      - name: Require the integrated behavior
        run: |
          grep -F 'rows = _canonicalize_snapshot_rows(events, rows, sport_key)' Flask_App/nfl_stadium_blueprint.py
          grep -F 'canonical_section_key' Flask_App/templates/HomeScreen.html
          grep -Fi 'tracked areas' Flask_App/templates/HomeScreen.html
          grep -Fi 'tracked areas' Flask_App/templates/NFLHomeScreen.html
          grep -Fi 'tracked areas' Flask_App/templates/NHLHomeScreen.html
          grep -Fi 'tracked areas' Flask_App/templates/nfl_stadium.html
          grep -F 'Flask_App/section_canonicalization.py' .github/workflows/deploy-pythonanywhere.yml
          grep -F 'workflow_dispatch' .github/workflows/deploy-pythonanywhere.yml

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full validation
        env:
          DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/baseball.db
          CONCERT_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/concerts.db
          NFL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nfl.db
          NHL_DATABASE_PATH: ${{ runner.temp }}/ticket-price-validation/nhl.db
          FLASK_SECRET_KEY: deployment-validation-key
          COLLECTOR_INGEST_TOKEN: deployment-validation-token
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")"
          python -m py_compile \
            models.py \
            graph_builder.py \
            Flask_App/flask_app.py \
            Flask_App/section_canonicalization.py \
            Flask_App/nfl_stadium_blueprint.py
          node --check Flask_App/static/js/script.js
          node --check Flask_App/static/js/nfl.js
          node --check Flask_App/static/js/nhl.js
          node --check Flask_App/static/js/nfl-stadium.js
          node --check Flask_App/static/js/venue-section.js
          python -m unittest discover -s tests -v
          git diff --check

      - name: Commit the clean validated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Canonicalize section aliases across venue insights"
          git push origin HEAD:feature/section-canonicalization
          echo "RELEASE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Merge the validated pull request
        run: |
          sleep 4
          remote_head="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid)"
          test "$remote_head" = "$RELEASE_HEAD"
          merged_at="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json mergedAt --jq '.mergedAt // ""')"
          if [ -z "$merged_at" ]; then
            if ! gh pr merge "$PR_NUMBER" \
              --repo "$REPO" \
              --squash \
              --match-head-commit "$RELEASE_HEAD" \
              --subject "Canonicalize audited section aliases across venue insights (#65)" \
              --body "Combine conservative venue-scoped aliases at read time, preserve distinct ticket products, filter audited access-only inventory, use the cheapest equivalent listing per snapshot, and label marketplace counts as tracked areas."; then
              gh pr merge "$PR_NUMBER" \
                --repo "$REPO" \
                --squash \
                --admin \
                --match-head-commit "$RELEASE_HEAD" \
                --subject "Canonicalize audited section aliases across venue insights (#65)" \
                --body "Combine conservative venue-scoped aliases at read time, preserve distinct ticket products, filter audited access-only inventory, use the cheapest equivalent listing per snapshot, and label marketplace counts as tracked areas."
            fi
          fi
          main_sha="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          echo "MAIN_SHA=$main_sha" >> "$GITHUB_ENV"

      - name: Dispatch and wait for production deployment
        run: |
          gh workflow run deploy-pythonanywhere.yml --repo "$REPO" --ref main
          run_id=""
          for attempt in $(seq 1 24); do
            run_id="$(gh run list \
              --repo "$REPO" \
              --workflow deploy-pythonanywhere.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq '.[] | select(.headSha == env.MAIN_SHA) | .databaseId' \
              | head -n 1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$REPO" --exit-status --interval 5

      - name: Verify live public pages
        run: |
          verify_page() {
            url="$1"
            expected="$2"
            for attempt in $(seq 1 8); do
              status="$(curl -sS --max-time 180 -o /tmp/page.html -w '%{http_code}' "$url" || true)"
              if [ "$status" = "200" ] && grep -Fi "$expected" /tmp/page.html >/dev/null; then
                return 0
              fi
              sleep $((attempt * 3))
            done
            echo "Verification failed for $url (last status: $status)" >&2
            return 1
          }

          verify_page "https://bunnyjeff.pythonanywhere.com/" "tracked areas"
          verify_page "https://bunnyjeff.pythonanywhere.com/nfl" "tracked areas"
          verify_page "https://bunnyjeff.pythonanywhere.com/nhl" "tracked areas"
          verify_page "https://bunnyjeff.pythonanywhere.com/baseball/stadium?venue=Fenway%20Park" "Cheapest sections"
