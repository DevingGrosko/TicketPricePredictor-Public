# Read-only integration canary on the free source branch; no scheduled activation.
name: Free Firefox capture compatibility canary
on:
  workflow_dispatch:
    inputs:
      canary_events:
        description: JSON list of two to four distinct NFL/NHL public event URLs
        required: true
      event_dates:
        description: JSON mapping of production IDs to verified UTC event datetimes
        required: true
permissions:
  contents: read
jobs:
  free-firefox-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install the explicit Firefox collector runtime
        run: python -m pip install -r requirements-collector.txt
      - name: Verify stock Firefox and geckodriver availability
        run: |
          command -v firefox
          command -v geckodriver
          firefox --version
          geckodriver --version
      - name: Exercise the free HTTP and recovery wrappers with real browser captures
        env:
          TICKETSIGNAL_BROWSER_ENGINE: firefox
          CANARY_EVENTS: ${{ inputs.canary_events }}
          EVENT_DATES: ${{ inputs.event_dates }}
        run: |
          xvfb-run --auto-servernum timeout --signal=TERM --kill-after=10s 360s \
            python -m tools.free_browser_capture_canary --events "$CANARY_EVENTS" --event-dates "$EVENT_DATES" --directory free-firefox-canary --timeout 45
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: free-firefox-multi-event-canary-${{ github.run_id }}
          path: free-firefox-canary/*.json
          if-no-files-found: warn
          retention-days: 14
