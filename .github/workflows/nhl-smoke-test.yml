name: NHL collector smoke test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: One target or the fixed four-capture normal-link comparison
        type: choice
        options:
          - single
          - linkcanary
        default: single
      diagnostic_target:
        description: Single-mode target on a fresh runner
        type: choice
        options:
          - nhl
          - nfl
        default: nhl
      navigation:
        description: Normal navigation to the public event
        type: choice
        options:
          - direct
          - performer
        default: direct

permissions:
  contents: read

jobs:
  firefox-inventory-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install standard Selenium
        run: python -m pip install "selenium==4.50.0"
      - name: Verify the installed browser and driver
        run: |
          command -v firefox
          command -v geckodriver
          command -v xvfb-run
          firefox --version
          geckodriver --version
      - name: Observe one public event in headed Firefox
        if: inputs.mode != 'linkcanary'
        env:
          DIAGNOSTIC_NAVIGATION: ${{ inputs.navigation || 'direct' }}
          DIAGNOSTIC_TARGET: ${{ inputs.diagnostic_target || 'nhl' }}
        run: |
          if [ "$DIAGNOSTIC_TARGET" = "nfl" ]; then
            event_url='https://www.vividseats.com/new-orleans-saints-tickets-new-orleans-caesars-superdome-3-7-2027/production/6493143'
            performer_url='https://www.vividseats.com/en/new-orleans-saints-tickets--sports-nfl-football/performer/597'
            production_id='6493143'
            expected_event_utc='2026-10-11T17:00:00Z'
          else
            event_url='https://www.vividseats.com/boston-bruins-tickets-td-garden-10-8-2026/production/7302493'
            performer_url='https://www.vividseats.com/boston-bruins-tickets--sports-nhl-hockey/performer/104'
            production_id='7302493'
            expected_event_utc='2026-10-08T23:00:00Z'
          fi
          timeout --signal=TERM --kill-after=10s 120s xvfb-run -a \
            python tools/firefox_inventory_diagnostic.py --timeout 75 \
            --navigation "$DIAGNOSTIC_NAVIGATION" \
            --event-url "$event_url" --performer-url "$performer_url" \
            --production-id "$production_id" --expected-event-utc "$expected_event_utc" \
            --output firefox_inventory_result.json \
            --inventory-output firefox_public_inventory.json
      - name: Compare four normal team-to-event link captures
        if: inputs.mode == 'linkcanary'
        run: |
          timeout --signal=TERM --kill-after=10s 540s xvfb-run -a \
            python tools/firefox_link_canary.py --directory firefox-link-canary
      - name: Save sanitized diagnostics and public inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firefox-inventory-${{ github.run_id }}
          path: |
            firefox_inventory_result.json
            firefox_public_inventory.json
            firefox-link-canary/
          if-no-files-found: warn
          retention-days: 14
