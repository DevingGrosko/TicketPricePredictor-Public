name: NHL collector smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-free-control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the historical workflow dependencies
        run: python -m pip install "selenium==4.49.0" "SQLAlchemy>=2,<3"
      - name: Install the browser versions shipped with the successful September runner
        run: |
          mkdir -p "$RUNNER_TEMP/pre-free-browser"
          curl --fail --location --max-time 90 \
            https://storage.googleapis.com/chrome-for-testing-public/153.0.8010.52/linux64/chrome-linux64.zip \
            --output "$RUNNER_TEMP/pre-free-browser/chrome.zip"
          curl --fail --location --max-time 45 \
            https://storage.googleapis.com/chrome-for-testing-public/153.0.8010.52/linux64/chromedriver-linux64.zip \
            --output "$RUNNER_TEMP/pre-free-browser/driver.zip"
          unzip -q "$RUNNER_TEMP/pre-free-browser/chrome.zip" -d "$RUNNER_TEMP/pre-free-browser"
          unzip -q "$RUNNER_TEMP/pre-free-browser/driver.zip" -d "$RUNNER_TEMP/pre-free-browser"
          "$RUNNER_TEMP/pre-free-browser/chrome-linux64/chrome" --version
          "$RUNNER_TEMP/pre-free-browser/chromedriver-linux64/chromedriver" --version
      - name: Capture one event with unchanged pre-free collector code
        run: |
          export CHROMEDRIVER_PATH="$RUNNER_TEMP/pre-free-browser/chromedriver-linux64/chromedriver"
          timeout --signal=TERM --kill-after=10s 120s python run_pre_free_control.py \
            --headless --timeout 45 --output pre_free_result.json \
            --chrome-binary "$RUNNER_TEMP/pre-free-browser/chrome-linux64/chrome"
      - name: Save comparison evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pre-free-control-${{ github.run_id }}
          path: pre_free_result.json
          if-no-files-found: warn
          retention-days: 14
