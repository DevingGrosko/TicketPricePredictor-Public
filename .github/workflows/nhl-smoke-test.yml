# Diagnostic-branch draft only. Do not replace the main smoke workflow.
name: Import one verified NHL observation (manual draft)
on:
  workflow_dispatch:
    inputs:
      destination:
        description: Verify the saved observation or deliver it to both existing stores
        type: choice
        options: [verify_only, both]
        default: verify_only
permissions:
  contents: read
env:
  CAPTURE_SOURCE_REF: 48735f3dd9d70c193e370e8d34cbee9a347f3376
  SNAPSHOT_SHA256: 0f8cb8d09958ada129fd5e70ec7541efe63a6e011ddde6a1f3f1c96f31b5a922
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: bridge
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.CAPTURE_SOURCE_REF }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r source/requirements-staging.txt
      - name: Verify the immutable saved observation without database or browser access
        run: |
          cp bridge/tools/import_shared_snapshot.py source/tools/import_shared_snapshot.py
          cp bridge/docs/firefox-capture-7302493-20261008-0330.json source/import-input.json
          cd source
          python -m tools.import_shared_snapshot verify --payload import-input.json --sha256 "$SNAPSHOT_SHA256" --receipt verify-receipt.json
      - uses: actions/upload-artifact@v7
        with:
          name: shared-snapshot-verification-${{ github.run_id }}
          path: source/verify-receipt.json
          retention-days: 14
  pythonanywhere:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.destination == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: bridge
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.CAPTURE_SOURCE_REF }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r source/requirements-staging.txt
      - name: Deliver the original observation to the existing PythonAnywhere API
        env:
          COLLECTOR_INGEST_TOKEN: ${{ secrets.COLLECTOR_INGEST_TOKEN }}
        run: |
          cp bridge/tools/import_shared_snapshot.py source/tools/import_shared_snapshot.py
          cp bridge/docs/firefox-capture-7302493-20261008-0330.json source/import-input.json
          cd source
          python -m tools.import_shared_snapshot pythonanywhere --payload import-input.json --sha256 "$SNAPSHOT_SHA256" --receipt pythonanywhere-receipt.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shared-snapshot-pythonanywhere-${{ github.run_id }}
          path: source/pythonanywhere-receipt.json
          if-no-files-found: warn
          retention-days: 14
  tidb:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.destination == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: tidb-staging
    concurrency:
      group: free-refresh-staging-nhl-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: bridge
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.CAPTURE_SOURCE_REF }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r source/requirements-staging.txt
      - name: Deliver and read back the identical observation in existing TiDB raw tables
        env:
          TICKETSIGNAL_STAGING_SITE: '1'
          TICKETSIGNAL_ENABLE_STAGING_WRITES: '1'
          TIDB_STAGING_HOST: ${{ secrets.TIDB_STAGING_HOST }}
          TIDB_STAGING_USERNAME: ${{ secrets.TIDB_STAGING_USERNAME }}
          TIDB_STAGING_PASSWORD: ${{ secrets.TIDB_STAGING_PASSWORD }}
        run: |
          cp bridge/tools/import_shared_snapshot.py source/tools/import_shared_snapshot.py
          cp bridge/docs/firefox-capture-7302493-20261008-0330.json source/import-input.json
          cd source
          python -m tools.import_shared_snapshot tidb --payload import-input.json --sha256 "$SNAPSHOT_SHA256" --receipt tidb-receipt.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shared-snapshot-tidb-${{ github.run_id }}
          path: source/tidb-receipt.json
          if-no-files-found: warn
          retention-days: 14
