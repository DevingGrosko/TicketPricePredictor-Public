name: NHL collector smoke test

on:
  pull_request:
    branches:
      - main
    paths:
      - "nhl_collector.py"
      - "nhl_schedule_collector.py"
      - "collector.py"
      - "nfl_collector.py"
      - "vivid_inventory.py"
      - "vivid_webkit.py"
      - "vivid_performer_routes.py"
      - "tests/test_vivid_webkit.py"
      - "tests/test_nhl_official_identity.py"
      - "tests/test_nhl_time_identity_canary.py"
      - "tests/fixtures/nhl_official_provider_identity.json"
      - "tools/nhl_time_identity_canary.py"
      - "tests/test_saved_collector_payloads.py"
      - "tests/test_smoke_workflow_gates.py"
      - "docs/shared-observations/**"
      - "tests/test_vivid_inventory.py"
      - "tests/test_nfl_geometry_matching.py"
      - "nfl_metadata.py"
      - "Flask_App/nhl_blueprint.py"
      - "Flask_App/static/js/nhl-map.js"
      - "Flask_App/templates/nhl_map.html"
      - "tests/test_nhl_collector.py"
      - "tests/test_nhl_schedule_collector.py"
      - "tests/test_nhl_blueprint.py"
      - ".github/workflows/nhl-smoke-test.yml"
  workflow_dispatch:
    inputs:
      event_url:
        description: Optional Vivid Seats NHL event URL
        required: false
        default: ""
      mode:
        description: Original NHL smoke or a bounded stock-browser canary
        type: choice
        options: [smoke, firefox_canary, webkit_canary, nhl_time_canary]
        default: smoke
      canary_events:
        description: JSON list of two to four distinct NFL/NHL public event URLs
        required: false
        default: ""
      canary_pace_seconds:
        description: Optional idle seconds between canary observations (0 to 90)
        type: number
        required: false
        default: 0
      canary_normal_navigation:
        description: Follow the observed team-page link to each exact event
        type: boolean
        default: false
      canary_isolated_events:
        description: Capture each distinct event once in its own browser
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  capture-nhl:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'firefox_canary' && inputs.mode != 'webkit_canary' && inputs.mode != 'nhl_time_canary')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install offline collector test dependencies
        if: github.event_name == 'pull_request'
        run: python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Validate saved NHL observations and native adapter contracts offline
        if: github.event_name == 'pull_request'
        run: |
          python -m unittest \
            tests.test_saved_collector_payloads.SavedCollectorPayloadTests.test_nhl_original_observations \
            tests.test_vivid_webkit tests.test_nhl_collector \
            tests.test_nhl_schedule_collector tests.test_nfl_geometry_matching \
            tests.test_nhl_official_identity tests.test_nhl_time_identity_canary \
            tests.test_smoke_workflow_gates -v

      - name: Install legacy Chrome diagnostic dependencies
        if: github.event_name == 'workflow_dispatch'
        run: python -m pip install "selenium>=4.26.1,<5" "SQLAlchemy>=2,<3"

      - name: Show browser versions
        if: github.event_name == 'workflow_dispatch'
        run: |
          google-chrome --version || chromium --version || true
          chromedriver --version || true

      - name: Validate the official NHL schedule source
        if: github.event_name == 'workflow_dispatch'
        run: |
          python nhl_schedule_collector.py schedule \
            --horizon-hours 1080 \
            > nhl_schedule_result.json

      - name: Capture one NHL event in legacy headed Chrome without writing to production
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_EVENT_URL: ${{ inputs.event_url }}
        run: |
          xvfb-run --auto-servernum timeout --signal=TERM --kill-after=10s 120s \
            python nhl_schedule_collector.py smoke "$REQUESTED_EVENT_URL" \
            --timeout 45 \
            --output nhl_smoke_result.json

      - name: Validate NHL section prices, currency, and optional geometry
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          payload = json.loads(
              Path("nhl_smoke_result.json").read_text(encoding="utf-8")
          )
          if payload.get("status") != "success":
              raise SystemExit(f"NHL smoke status was {payload.get('status')!r}")

          section_count = int(payload.get("section_count") or 0)
          if section_count < 8:
              raise SystemExit(f"NHL smoke returned only {section_count} sections")

          listing_count = int(payload.get("inventory_listing_count") or 0)
          if listing_count < section_count:
              raise SystemExit("NHL smoke did not retain its complete inventory count")
          diagnostics = payload.get("capture_diagnostics") or {}
          if str(diagnostics.get("production_id")) != str(payload.get("source_id")):
              raise SystemExit("NHL inventory diagnostics do not match the captured event")
          if not any(row.get("status") == 200 for row in diagnostics.get("responses") or []):
              raise SystemExit("NHL smoke did not capture a successful inventory response")
          print(f"Captured {listing_count} unfiltered listings for event {payload['source_id']}.")

          currency = str(payload.get("currency") or "").upper()
          if len(currency) != 3 or not currency.isalpha():
              raise SystemExit(f"Invalid NHL currency code: {currency!r}")

          geometry = payload.get("map_geometry") or {}
          if geometry:
              mapped = int(geometry.get("mapped_section_count") or 0)
              known = int(
                  geometry.get("known_section_count")
                  or section_count
                  or 0
              )
              ratio = float(geometry.get("coverage_ratio") or 0)
              shape_count = sum(
                  len(row.get("shapes") or [])
                  for row in geometry.get("sections") or []
              )
              required = max(4, min(12, math.ceil(known * 0.6)))
              if (mapped < 1 or mapped > known or shape_count < mapped
                  or not math.isfinite(ratio) or not 0 <= ratio <= 1
                  or not math.isclose(ratio, mapped / max(1, known), abs_tol=0.0001)):
                  raise SystemExit(
                      "Returned NHL geometry is invalid: "
                      f"{mapped}/{known} sections ({ratio:.1%}), "
                      f"{shape_count} shapes"
                  )
              if mapped >= required and ratio >= 0.6:
                  print(
                      f"Verified {section_count} NHL sections in {currency} and "
                      f"{mapped}/{known} provider-map sections ({ratio:.1%})."
                  )
              else:
                  print(
                      f"Verified {section_count} NHL sections in {currency}; "
                      f"provider geometry is partial ({mapped}/{known}, {ratio:.1%}). "
                      "The interface will use its rink fallback."
                  )
          else:
              print(
                  f"Verified {section_count} NHL sections in {currency}; "
                  "the interface will use its rink fallback until provider "
                  "geometry is available."
              )
          PY

      - name: Upload diagnostic results
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: nhl-smoke-result-${{ github.run_id }}
          path: |
            nhl_schedule_result.json
            nhl_smoke_result.json
            nhl_smoke_result.png
          if-no-files-found: warn
          retention-days: 14

  nhl-time-canary:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'nhl_time_canary'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install the stock WebKit diagnostic runtime
        run: |
          python -m pip install -r requirements-collector.txt -r requirements-webkit-collector.txt
          python -m playwright install --with-deps webkit
      - name: Validate three fixed NHL identities through the production capture path without storing
        env:
          TICKETSIGNAL_BROWSER_ENGINE: webkit
        run: |
          xvfb-run --auto-servernum timeout --signal=TERM --kill-after=10s 300s \
            python -m tools.nhl_time_identity_canary --directory nhl-time-canary
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nhl-time-identity-canary-${{ github.run_id }}
          path: nhl-time-canary/*.json
          if-no-files-found: warn
          retention-days: 1

  firefox-canary:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'firefox_canary' || inputs.mode == 'webkit_canary')
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install the explicit Firefox collector runtime
        run: python -m pip install -r requirements-collector.txt
      - name: Install stock WebKit for the explicit WebKit canary
        if: inputs.mode == 'webkit_canary'
        run: |
          python -m pip install -r requirements-webkit-collector.txt
          python -m playwright install --with-deps webkit
      - name: Verify stock Firefox and driver availability
        if: inputs.mode == 'firefox_canary'
        run: |
          command -v firefox
          command -v geckodriver
          firefox --version
          geckodriver --version
      - name: Capture distinct NFL/NHL events, repeat after navigation, and restart
        env:
          TICKETSIGNAL_BROWSER_ENGINE: ${{ inputs.mode == 'webkit_canary' && 'webkit' || 'firefox' }}
          CANARY_EVENTS: ${{ inputs.canary_events }}
          CANARY_PACE_SECONDS: ${{ inputs.canary_pace_seconds || '0' }}
          CANARY_NORMAL_NAVIGATION: ${{ inputs.canary_normal_navigation || 'false' }}
          CANARY_ISOLATED_EVENTS: ${{ inputs.canary_isolated_events || 'false' }}
        run: |
          CANARY_TIMEOUT_SECONDS=$(python -c 'import os; pace = int(os.environ["CANARY_PACE_SECONDS"]); assert 0 <= pace <= 90; print(360 + 5 * pace)')
          options=()
          if [ "$CANARY_NORMAL_NAVIGATION" = "true" ]; then options+=(--normal-navigation); fi
          if [ "$CANARY_ISOLATED_EVENTS" = "true" ]; then options+=(--isolated-events); fi
          xvfb-run --auto-servernum timeout --signal=TERM --kill-after=10s "${CANARY_TIMEOUT_SECONDS}s" \
            python -m tools.browser_capture_canary --engine "$TICKETSIGNAL_BROWSER_ENGINE" --events "$CANARY_EVENTS" --directory firefox-canary --timeout 45 --pace-seconds "$CANARY_PACE_SECONDS" "${options[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: firefox-multi-event-canary-${{ github.run_id }}
          path: firefox-canary/*.json
          if-no-files-found: warn
          retention-days: 14
